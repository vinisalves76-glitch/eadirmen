    cloudMessage='Sistema atualizado';
    updateCloudBadge();
    return;
  }
  if(!cloudReady) return;
  try{
    await db.collection('sistema').doc('sharedData').set({

      plans:data.plans,
      people:data.people,
      atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()

  try{
    const ref=db.collection('sistema').doc('sharedData');
    const snap=await ref.get();
    if(snap.exists){
      const remote=snap.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people
      };
      cacheLocal();
    }else{
      await ref.set({
        skills:defaults.skills,
        plans:defaults.plans,
        people:defaults.people,
        criadoEm:firebase.firestore.FieldValue.serverTimestamp(),
        atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
      });
      data=JSON.parse(JSON.stringify(defaults));
      cacheLocal();
    }
    cloudReady=true;
    cloudMessage='Sistema atualizado';
    updateCloudBadge();

    if(cloudUnsubscribe) cloudUnsubscribe();
    cloudUnsubscribe=ref.onSnapshot(doc=>{
      if(!doc.exists) return;
      if(instructorSimulationMode) return;
      const remote=doc.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people
      };
      cacheLocal();
      if(role) go(currentPage);
    },err=>{
      console.error('Falha na sincronização em tempo real:',err);
      cloudMessage='Modo offline';
      updateCloudBadge();
    });
  }catch(err){
    console.warn('Firestore ainda não disponível; usando armazenamento local.',err);
    cloudReady=false;
    cloudMessage='Modo offline';
    updateCloudBadge();
  }
}

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function friendlyAuthError(err){
  const code=err && err.code ? err.code : '';
  if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')) return 'E-mail ou senha inválidos.';
  if(code.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if(code.includes('network-request-failed')) return 'Falha de conexão. Verifique a internet.';
  if(code.includes('operation-not-allowed')) return 'O login por e-mail e senha ainda não está ativado no Firebase.';
  if(code.includes('user-disabled')) return 'Este usuário está desativado no Firebase.';
  return 'Não foi possível entrar. Confira o e-mail e a senha.';
}

async function loginWithEmail(event){
  event.preventDefault();

    await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
    const credential=await auth.signInWithEmailAndPassword(email,password);

    // Não dependemos apenas do onAuthStateChanged.
    // Isso evita ficar preso em "Entrando..." quando já existe uma sessão salva.

async function ensureUserProfile(user){
  const ref=db.collection('usuarios').doc(user.uid);
  const email=(user.email||'').trim().toLowerCase();
  const isZion=email==='zion.almeida@irmen.com.br';

  const perfilZion={
    nome:'Zion Almeida',
    email:user.email||'',
    perfil:'admin',
    cargo:'ADM',
    ativo:true
  };

  try{
    const snap=await ref.get();

    if(snap.exists){
      return {uid:user.uid,...snap.data()};
    }

    if(isZion){
      try{
        await ref.set({
          ...perfilZion,
          criadoEm:firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});
      }catch(writeErr){
        console.warn('Perfil ADM autenticado; Firestore ainda sem permissão de escrita.',writeErr);
      }
      return {uid:user.uid,...perfilZion};
    }

    return null;
  }catch(err){
    console.warn('Não foi possível ler o perfil no Firestore.',err);
    if(isZion){
      return {uid:user.uid,...perfilZion};
    }
    throw err;
  }
}

async function openAuthenticatedApp(user){
  if(!user) return;
  if(appReadyUid===user.uid && !document.getElementById('app').classList.contains('hidden')) return;
  if(openingUserUid===user.uid) return;

  openingUserUid=user.uid;
  const loginError=document.getElementById('loginError');
  const btn=document.getElementById('loginButton');

  try{
    const profile=await ensureUserProfile(user);

    if(!profile){
      throw new Error('EAD: Login autenticado, mas o perfil ainda não foi cadastrado no EAD Irmen.');
    }

    if(profile.ativo===false){
      throw new Error('EAD: Este login está desativado. Procure um administrador.');
    }

    if(!['admin','instructor'].includes(profile.perfil)){
      throw new Error('EAD: O perfil deste usuário está inválido no Firestore.');
    }

    currentUserProfile=profile;
    role=profile.perfil;
    currentPersonName=profile.nome||user.email||'Usuário';

    document.getElementById('profileName').textContent=currentPersonName;
    document.getElementById('profileRole').textContent='Perfil: '+(profile.cargo || (role==='admin'?'ADM':'Instrutor'));

    // Abre a interface primeiro. Sincronizações secundárias não podem travar o login.
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    buildNav();
    go('dashboard');
    appReadyUid=user.uid;

    // Carregamentos complementares executam depois que a interface já abriu.
    await loadTeamUsers();
    await initCloud();
    go(currentPage);
  }catch(err){
    appReadyUid=null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
    loginError.textContent=(err && err.message ? err.message.replace(/^EAD:\s*/,'') : 'Falha ao carregar o perfil do usuário.');
    throw err;
  }finally{
    openingUserUid=null;
    if(btn){
      btn.disabled=false;
      btn.textContent='Entrar';
    }
  }
}

function normalizePersonName(value){
  return String(value||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9 ]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function resolveInstructorDataName(name=currentPersonName){
  const target=normalizePersonName(name);
  if(!target) return name||'';

  const candidates=[...new Set([
    ...(Array.isArray(data.people)?data.people:[]),
    ...(Array.isArray(data.skills)?data.skills.map(s=>s.owner):[]),
    ...(Array.isArray(data.plans)?data.plans.map(p=>p.person):[])
  ].filter(Boolean))];

  const exact=candidates.find(candidate=>normalizePersonName(candidate)===target);
  if(exact) return exact;

  const targetFirst=target.split(' ')[0];
  const sameFirst=candidates.filter(candidate=>{
    const n=normalizePersonName(candidate);
    return n && n.split(' ')[0]===targetFirst;
  });

  if(sameFirst.length===1) return sameFirst[0];

  const contained=candidates.filter(candidate=>{
    const n=normalizePersonName(candidate);
    return n && (target.includes(n)||n.includes(target));
  });

  if(contained.length===1) return contained[0];

  return name||'';
}

function currentInstructorDataName(){
  return role==='admin'?currentPersonName:resolveInstructorDataName(currentPersonName);
}

function ensureSkillWorkflow(s){
  if(!s) return s;
  if(!Array.isArray(s.materials)) s.materials=[];
  if(!Array.isArray(s.productionOutputs)) s.productionOutputs=[];
  if(typeof s.noMaterials!=='boolean') s.noMaterials=s.materials.length===0;

  if(!s.workflow||typeof s.workflow!=='object'){
    const oldStatus=s.status||'Planejamento';
    s.workflow={
      production:oldStatus==='Concluída'||oldStatus==='Em revisão'?'Finalizado':oldStatus==='Em produção'?'Em produção':'Não iniciado',
      review:oldStatus==='Concluída'?'Aprovado':oldStatus==='Em revisão'?'Em revisão':'Não iniciado',
      finalization:oldStatus==='Concluída'?'Finalizado':'Não iniciado'
    };
  }

  if(!['Não iniciado','Em produção','Finalizado'].includes(s.workflow.production)) s.workflow.production='Não iniciado';
  if(!['Não iniciado','Em revisão','Aprovado'].includes(s.workflow.review)) s.workflow.review='Não iniciado';
  if(!['Não iniciado','Em finalização','Finalizado'].includes(s.workflow.finalization)) s.workflow.finalization='Não iniciado';
  return s;
}

function skillWorkflowMetrics(s){
  ensureSkillWorkflow(s);

  const objectiveOk=String(s.objective||'').trim().length>0;
  const developmentOk=String(s.development||'').trim().length>0;
  const durationOk=String(s.duration||'').trim().length>0;
  const planningScore=[objectiveOk,developmentOk,durationOk].filter(Boolean).length/3;
  const planningDone=objectiveOk&&developmentOk&&durationOk;

  let materialScore=0;
  let materialsDone=false;
  if(s.noMaterials){
    materialScore=1;
    materialsDone=true;
  }else if(s.materials.length){
    materialScore=s.materials.reduce((sum,m)=>sum+(m.status==='Finalizado'?1:m.status==='Em produção'?0.5:0),0)/s.materials.length;
    materialsDone=s.materials.every(m=>m.status==='Finalizado');
  }

  const productionHasResult=s.productionOutputs.length>0||s.legacyProductionComplete===true;
  const productionScore=s.workflow.production==='Finalizado'&&productionHasResult?1:s.workflow.production==='Em produção'?0.5:0;
  const productionDone=s.workflow.production==='Finalizado'&&productionHasResult;
  const reviewScore=s.workflow.review==='Aprovado'?1:s.workflow.review==='Em revisão'?0.5:0;
  const reviewDone=s.workflow.review==='Aprovado';
  const finalScore=s.workflow.finalization==='Finalizado'?1:s.workflow.finalization==='Em finalização'?0.5:0;
  const finalDone=s.workflow.finalization==='Finalizado';

  const progress=Math.round((planningScore+materialScore+productionScore+reviewScore+finalScore)*20);
  let status='Planejamento';
  if(finalDone) status='Concluída';
  else if(productionDone||s.workflow.review!=='Não iniciado'||s.workflow.finalization!=='Não iniciado') status='Em revisão';
  else if(planningDone||s.materials.length||s.noMaterials||s.workflow.production==='Em produção') status='Em produção';

  const done=[planningDone,materialsDone,productionDone,reviewDone,finalDone];
  const labels=['Planejamento','Materiais','Produção','Revisão','Finalização'];
  const currentIndex=done.findIndex(v=>!v);

  return {progress,status,planningDone,materialsDone,productionDone,reviewDone,finalDone,done,labels,currentIndex:currentIndex<0?5:currentIndex};
}

function draftSkillFromForm(){
  const id=Number(document.getElementById('mSkillId')?.value||0);
  const original=data.skills.find(x=>Number(x.id)===id)||{};
  const draft=JSON.parse(JSON.stringify(original));
  ensureSkillWorkflow(draft);
  draft.objective=document.getElementById('mObjective')?.value||'';
  draft.development=document.getElementById('mDevelopment')?.value||'';
  draft.duration=document.getElementById('mDuration')?.value||'';
  draft.materials=readSkillMaterialsFromForm();

  if(!Array.isArray(draft.productionOutputs)) draft.productionOutputs=[];
  draft.workflow.production=document.getElementById('mProductionStep')?.value||'Não iniciado';
  draft.workflow.review=document.getElementById('mReviewStep')?.value||'Não iniciado';
  draft.workflow.finalization=document.getElementById('mFinalStep')?.value||'Não iniciado';
  return draft;
}

function productionResultAccept(type){
  if(type==='Slide / PDF') return '.pdf,.ppt,.pptx';
  if(type==='Foto de peça / componente') return 'image/*';
  if(type==='Material impresso') return '.pdf,.doc,.docx,image/*';
  if(type==='Vídeo') return 'video/*';
  return '*/*';
}
function updateProductionFileAccept(){
  const type=document.getElementById('mOutputType')?.value||'Outro arquivo';
  const input=document.getElementById('mOutputFile');
  if(input) input.accept=productionResultAccept(type);
}
function workflowFileSize(bytes){
  const n=Number(bytes)||0;
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function productionOutputHtml(output,skillId){
  const o=output||{};
  return '<div class="production-output"><div class="production-output-main"><b>'+esc(o.name||'Arquivo anexado')+'</b><span>'+esc(o.type||'Resultado')+' • '+workflowFileSize(o.size||0)+'</span></div><div class="production-output-actions">'+(o.url?'<a href="'+esc(o.url)+'" target="_blank" rel="noopener">Abrir</a>':'')+'<button type="button" onclick="removeProductionResult('+Number(skillId)+','+Number(o.id)+')">Remover</button></div></div>';
}
function renderProductionOutputs(skill){
  const list=document.getElementById('productionOutputList');
  if(!list) return;
  const outputs=Array.isArray(skill?.productionOutputs)?skill.productionOutputs:[];
  list.innerHTML=outputs.length?outputs.map(o=>productionOutputHtml(o,skill.id)).join(''):'<div class="workflow-note">Nenhum resultado anexado. Para concluir a Produção, anexe o arquivo, foto ou vídeo produzido.</div>';
}
function productionUploadMessage(message,type=''){
  const el=document.getElementById('productionUploadStatus');
  if(!el) return;
  el.className='production-upload-status'+(type?' '+type:'');
  el.textContent=message||'';
}
function syncProductionOutputWithMaterials(skill,outputType,url){
  const map={'Slide / PDF':'Slide','Foto de peça / componente':'Peça / componente','Material impresso':'Material impresso'};
  const materialType=map[outputType];
  if(!materialType) return;
  (skill.materials||[]).forEach(material=>{
    if(material.type===materialType){material.status='Finalizado';material.reference=url||material.reference||'';}
  });
  document.querySelectorAll('#skillMaterialsList .workflow-material').forEach(row=>{
    if(row.dataset.materialType===materialType){
      setMaterialRowStatus(row,'Finalizado');
      const ref=row.querySelector('.material-reference');
      if(ref&&url) ref.value=url;
    }
  });
}
function friendlyProductionUploadError(err){
  const code=err&&err.code?err.code:'';
  if(code.includes('unauthorized')) return 'Você não tem permissão para anexar arquivos.';
  if(code.includes('canceled')) return 'Envio cancelado.';
  if(code.includes('quota-exceeded')) return 'O limite de armazenamento foi atingido.';
  if(code.includes('retry-limit-exceeded')) return 'A conexão falhou durante o envio. Tente novamente.';
  return 'Não foi possível anexar o resultado. Tente novamente.';
}
function applyWorkflowFormToSkill(skill){
  skill.objective=document.getElementById('mObjective')?.value.trim()||'';
  skill.development=document.getElementById('mDevelopment')?.value.trim()||'';
  skill.duration=document.getElementById('mDuration')?.value.trim()||'';
  skill.materials=readSkillMaterialsFromForm();
  skill.noMaterials=!!document.getElementById('mNoMaterials')?.checked;
  if(role==='admin'&&document.getElementById('mOwner')) skill.owner=document.getElementById('mOwner').value;
}
async function fileToBase64Chunk(blob){
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
    reader.onerror=()=>reject(reader.error||new Error('Falha ao ler arquivo.'));
    reader.readAsDataURL(blob);
  });
}

async function apiProductionFile(body){
  if(!auth.currentUser) throw new Error('auth-required');
  const token=await auth.currentUser.getIdToken(true);
  const response=await fetch('/api/production-files',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+token
    },
    body:JSON.stringify(body)
  });

  let result={};
  try{ result=await response.json(); }catch(_){}
  if(!response.ok) throw new Error(result.error||'Falha ao processar arquivo.');
  return result;
}

async function uploadProductionResult(skillId){
  const skill=data.skills.find(x=>Number(x.id)===Number(skillId));
  if(!skill) return;
  ensureSkillWorkflow(skill);

  const input=document.getElementById('mOutputFile');
  const file=input?.files?.[0];
  const outputType=document.getElementById('mOutputType')?.value||'Outro arquivo';

  if(!file){
    productionUploadMessage('Selecione um arquivo antes de anexar.','error');
    return;
  }
  if(file.size>25*1024*1024){
    productionUploadMessage('O arquivo deve ter no máximo 25 MB.','error');
    return;
  }

  applyWorkflowFormToSkill(skill);
  if(!skillWorkflowMetrics(skill).planningDone){
    productionUploadMessage('Preencha objetivo, desenvolvimento e duração antes de anexar o resultado.','error');
    return;
  }

  const button=document.getElementById('mUploadOutputBtn');
  if(button){button.disabled=true;button.textContent='Enviando...';}
  productionUploadMessage('Preparando arquivo...');

  try{
    const chunkSize=1.5*1024*1024;
    const chunkCount=Math.ceil(file.size/chunkSize);
    const uploadId='upl_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);

    for(let i=0;i<chunkCount;i++){
      const startByte=i*chunkSize;
      const endByte=Math.min(file.size,startByte+chunkSize);
      const blob=file.slice(startByte,endByte);
      const dataBase64=await fileToBase64Chunk(blob);

      await apiProductionFile({
        action:'chunk',
        uploadId,
        skillId:String(skill.id),
        chunkIndex:i,
        chunkCount,
        dataBase64
      });

      const pct=Math.round(((i+1)/chunkCount)*90);
      productionUploadMessage('Enviando resultado... '+pct+'%');
    }

    productionUploadMessage('Finalizando arquivo... 95%');

    const safeName=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
    const done=await apiProductionFile({
      action:'complete',
      uploadId,
      skillId:String(skill.id),
      chunkCount,
      fileName:safeName,
      originalName:file.name,
      contentType:file.type||'application/octet-stream'
    });

    const output={
      id:Date.now(),
      type:outputType,
      name:file.name,
      url:done.url,
      storagePath:done.storagePath,
      size:file.size,
      contentType:file.type||'',
      uploadedAt:new Date().toISOString(),
      uploadedBy:currentPersonName||''
    };

    skill.productionOutputs.push(output);
    skill.legacyProductionComplete=false;
    syncProductionOutputWithMaterials(skill,outputType,done.url);
    skill.workflow.production='Finalizado';

    const metrics=skillWorkflowMetrics(skill);
    skill.status=metrics.status;
    skill.progress=metrics.progress;
    await save();

    renderProductionOutputs(skill);
    const production=document.getElementById('mProductionStep');
    if(production) production.value='Finalizado';
    if(input) input.value='';
    productionUploadMessage('Resultado anexado com sucesso. Produção finalizada.','ok');
    refreshWorkflowPreview();
  }catch(err){
    console.error('Falha ao anexar resultado:',err);
    let message=err&&err.message?err.message:'Não foi possível anexar o resultado.';
    if(String(message).includes('auth-required')) message='Sua sessão expirou. Entre novamente no sistema.';
    productionUploadMessage(message,'error');
  }finally{
    if(button){button.disabled=false;button.textContent='Anexar resultado';}
  }
}

async function removeProductionResult(skillId,outputId){
  const skill=data.skills.find(x=>Number(x.id)===Number(skillId));
  if(!skill||!Array.isArray(skill.productionOutputs)) return;
  const output=skill.productionOutputs.find(o=>Number(o.id)===Number(outputId));
  if(!output||!confirm('Remover este resultado da produção?')) return;

  if(output.storagePath){
    try{
      await apiProductionFile({
        action:'delete',
        skillId:String(skill.id),
        storagePath:output.storagePath
      });
    }catch(err){
      console.warn('Arquivo físico não removido:',err);
    }
  }

  skill.productionOutputs=skill.productionOutputs.filter(o=>Number(o.id)!==Number(outputId));
  if(!skill.productionOutputs.length&&skill.legacyProductionComplete!==true){
    skill.workflow.production='Em produção';
    skill.workflow.review='Não iniciado';
    skill.workflow.finalization='Não iniciado';
  }

  const metrics=skillWorkflowMetrics(skill);
  skill.status=metrics.status;
  skill.progress=metrics.progress;
  await save();

  renderProductionOutputs(skill);
  const production=document.getElementById('mProductionStep');
  if(production) production.value=skill.workflow.production;
  productionUploadMessage(skill.productionOutputs.length?'Resultado removido.':'Resultado removido. A Produção voltou para Em produção.');
  refreshWorkflowPreview();
}

function productionStepChanged(){
  const production=document.getElementById('mProductionStep');
  if(!production) return;
  const draft=draftSkillFromForm();
  if(production.value==='Finalizado'&&!draft.productionOutputs.length&&draft.legacyProductionComplete!==true){
    production.value='Em produção';
    productionUploadMessage('Para finalizar a Produção, anexe o resultado produzido.','error');
  }
  refreshWorkflowPreview();
}

function refreshWorkflowPreview(){
  const draft=draftSkillFromForm();
  const m=skillWorkflowMetrics(draft);

  const progress=document.getElementById('mAutoProgress');
  const progressBar=document.getElementById('mAutoProgressBar');
  const status=document.getElementById('mAutoStatus');
  const current=document.getElementById('mCurrentStep');
  if(progress) progress.textContent=m.progress+'%';
  if(progressBar) progressBar.style.width=m.progress+'%';
  if(status) status.textContent=m.status;
  if(current) current.textContent=m.currentIndex>=5?'Concluída':m.labels[m.currentIndex];

  document.querySelectorAll('[data-workflow-step]').forEach((el,index)=>{
    el.classList.remove('done','current','locked');
    el.classList.add(m.done[index]?'done':m.currentIndex===index?'current':'locked');
    const span=el.querySelector('span');
    if(span) span.textContent=m.done[index]?'Concluído':m.currentIndex===index?'Etapa atual':'Aguardando';
  });

  const production=document.getElementById('mProductionStep');
  const review=document.getElementById('mReviewStep');
  const finalStep=document.getElementById('mFinalStep');
  if(production) production.disabled=!(m.planningDone&&m.materialsDone);
  if(review) review.disabled=!(m.productionDone&&m.materialsDone);
  if(finalStep) finalStep.disabled=!m.reviewDone;

  if(!(m.planningDone&&m.materialsDone)&&production&&production.value!=='Não iniciado') production.value='Não iniciado';
  if(!(m.productionDone&&m.materialsDone)&&review&&review.value!=='Não iniciado') review.value='Não iniciado';
  if(!m.reviewDone&&finalStep&&finalStep.value!=='Não iniciado') finalStep.value='Não iniciado';
}

function saveSkill(id){
  let s=data.skills.find(x=>x.id===id);
  if(!s)return;
  if(role!=='admin'&&s.owner!==currentInstructorDataName()){
    alert('Você só pode atualizar habilidades atribuídas a você.');
    return;
  }

  ensureSkillWorkflow(s);
  s.objective=document.getElementById('mObjective').value.trim();
  s.development=document.getElementById('mDevelopment').value.trim();
  s.duration=document.getElementById('mDuration').value.trim();
  s.materials=readSkillMaterialsFromForm();
  s.noMaterials=!!document.getElementById('mNoMaterials').checked;
  if(!Array.isArray(s.productionOutputs)) s.productionOutputs=[];
  s.workflow.production=document.getElementById('mProductionStep').value;
  if(s.workflow.production==='Finalizado'&&!s.productionOutputs.length&&s.legacyProductionComplete!==true){
    s.workflow.production='Em produção';
  }
  s.workflow.review=document.getElementById('mReviewStep').value;
  s.workflow.finalization=document.getElementById('mFinalStep').value;

  let metrics=skillWorkflowMetrics(s);
  if(!(metrics.planningDone&&metrics.materialsDone)){
    s.workflow.production='Não iniciado';
    s.workflow.review='Não iniciado';
    s.workflow.finalization='Não iniciado';
  }else if(!metrics.productionDone){
    s.workflow.review='Não iniciado';
    s.workflow.finalization='Não iniciado';
  }else if(!metrics.reviewDone){
    s.workflow.finalization='Não iniciado';
  }

  metrics=skillWorkflowMetrics(s);
  s.status=metrics.status;
  s.progress=metrics.progress;

  if(role==='admin'&&document.getElementById('mOwner')) s.owner=document.getElementById('mOwner').value;
  save();
  closeModal();
  renderSkills();

function userCreationError(err){
  const code=err&&err.code?err.code:'';
  if(code.includes('email-already-in-use')) return 'Já existe um login com esse e-mail.';
  if(code.includes('invalid-email')) return 'Informe um e-mail válido.';
  if(code.includes('weak-password')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(code.includes('operation-not-allowed')) return 'Ative E-mail/senha no Firebase Authentication.';
  if(code.includes('permission-denied')) return 'Sem permissão para gravar o perfil no Firestore.';
  return 'Não foi possível criar o login.';
}


async function adminUserAction(payload){
  const user=auth.currentUser;
  if(!user) throw new Error('Sua sessão expirou. Entre novamente.');
  const token=await user.getIdToken(true);
  const response=await fetch('/api/admin-users',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+token
    },
    body:JSON.stringify(payload)
  });

  let body={};
  try{ body=await response.json(); }catch(_){}

  if(!response.ok){
    throw new Error(body.error || 'Não foi possível concluir a operação.');
  }

  return body;
}

function normalizeAgentText(text){
  return String(text||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();
}

function normalizeExcelHeader(text){
  return normalizeAgentText(text)
    .replace(/[^a-z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'');
}

function canonicalLevel(value){
  const v=normalizeAgentText(value);
  if(v==='basica'||v==='basico') return 'Básica';
  if(v==='intermediaria'||v==='intermediario') return 'Intermediária';
  if(v==='media'||v==='medio') return 'Média';
  if(v==='avancada'||v==='avancado') return 'Avançada';
  return '';
}

function canonicalStatus(value){
  const v=normalizeAgentText(value);
  if(!v) return 'Planejamento';
  if(v==='planejamento') return 'Planejamento';
  if(v==='em producao'||v==='producao') return 'Em produção';
  if(v==='em revisao'||v==='revisao') return 'Em revisão';
  if(v==='concluida'||v==='concluido'||v==='concluido(a)') return 'Concluída';
  return 'Planejamento';
}

function getActiveInstructors(){
  const firestoreInstructors=teamUsers
    .filter(u=>u.perfil==='instructor' && u.ativo!==false)
    .map(u=>u.nome)
    .filter(Boolean);

  const fallback=data.people.filter(name=>{
    if(!name) return false;
    const user=teamUsers.find(u=>u.nome===name);
    if(user && user.perfil==='admin') return false;
    return name!==currentPersonName;
  });

  return [...new Set(firestoreInstructors.length?firestoreInstructors:fallback)];
}

function getWeeklyLoad(person){
  return data.plans.filter(p=>p.week==='Semana atual' && p.person===person).length;
}

function getAgentEligibleSkills(){
  const alreadyPlanned=new Set(
    data.plans
      .filter(p=>p.week==='Semana atual')
      .map(p=>Number(p.skillId))
  );

  const statusPriority={'Planejamento':0,'Em produção':1,'Em revisão':2};

  return data.skills
    .filter(s=>s.status!=='Concluída' && !alreadyPlanned.has(Number(s.id)))
    .sort((a,b)=>{
      const pa=statusPriority[a.status]??9;
      const pb=statusPriority[b.status]??9;
      if(pa!==pb) return pa-pb;
      return Number(a.progress||0)-Number(b.progress||0);
    });
}

function buildAgentDistribution(skillCount,instructorCount){
  const instructors=getActiveInstructors()
    .map(name=>({name,load:getWeeklyLoad(name)}))
    .sort((a,b)=>a.load-b.load || a.name.localeCompare(b.name));

  if(!instructors.length){
    return {error:'Não encontrei nenhum usuário ativo com perfil Instrutor. Cadastre ou ative os instrutores antes de montar a distribuição.'};
  }

  const useCount=Math.max(1,Math.min(Number(instructorCount)||instructors.length,instructors.length));
  const selectedInstructors=instructors.slice(0,useCount);
  const eligible=getAgentEligibleSkills();

  if(!eligible.length){
    return {error:'Não há habilidades pendentes e ainda não planejadas disponíveis para distribuir nesta semana.'};
  }

  const requested=Math.max(1,Number(skillCount)||eligible.length);
  const selectedSkills=eligible.slice(0,requested);
  const dynamicLoads=Object.fromEntries(selectedInstructors.map(i=>[i.name,i.load]));
  const assignments=[];

  selectedSkills.forEach(skill=>{
    const person=selectedInstructors
      .slice()
      .sort((a,b)=>dynamicLoads[a.name]-dynamicLoads[b.name] || a.name.localeCompare(b.name))[0];

    assignments.push({
      skillId:skill.id,
      skillTitle:skill.title,
      level:skill.level,
      person:person.name,
      previousLoad:dynamicLoads[person.name]
    });
    dynamicLoads[person.name]+=1;
  });

  return {
    type:'plan',
    requested,
    available:eligible.length,
    selectedInstructors:selectedInstructors.map(i=>i.name),
    assignments,
    finalLoads:dynamicLoads,
    limited:selectedSkills.length<requested
  };
}

function agentDistributionSummary(plan){

  });

  let text='Preparei a distribuição de '+plan.assignments.length+' habilidade(s) para esta semana.\n\n';
  Object.entries(perPerson).forEach(([person,items])=>{
    text+='• '+person+': '+items.length+' habilidade(s)\n';
  });

  if(plan.limited){

  }else{

  }

  text+='\n\nNenhuma alteração foi feita ainda. Confirme o plano ao lado para executar.';
  return text;
}

function parseAgentUserCommand(command){
  const email=(command.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';
  const passMatch=command.match(/senha\s*[:=\-]?\s*["']?([^\s,;]+)["']?/i);
  const password=passMatch?passMatch[1]:'';
  const roleMatch=command.match(/(?:perfil|como)\s*[:=\-]?\s*(adm|admin|administrador|instrutor)/i);
  const profile=roleMatch
    ? (/adm|admin|administrador/i.test(roleMatch[1])?'admin':'instructor')
    : '';

  let name='';
  const nameMatch=command.match(/(?:crie|criar|novo|nova)?\s*(?:um\s*)?(?:login|usuario|usuário)\s+(?:para\s+)?(.+?)(?=\s+(?:email|e-mail|senha|perfil|como)\b|$)/i);
  if(nameMatch) name=nameMatch[1].replace(/^para\s+/i,'').trim();

  return {name,email,password,profile};
}

function parseAgentSkillCommand(command){
  const titleMatch=command.match(/(?:habilidade|titulo|título)\s*[:=\-]?\s*(.+?)(?=\s+(?:nivel|nível|objetivo|desenvolvimento|duracao|duração|responsavel|responsável|status)\b|$)/i);
  const levelMatch=command.match(/(?:nivel|nível)\s*[:=\-]?\s*(basica|básica|basico|básico|intermediaria|intermediária|intermediario|intermediário|media|média|medio|médio|avancada|avançada|avancado|avançado)/i);
  const objectiveMatch=command.match(/objetivo\s*[:=\-]?\s*(.+?)(?=\s+(?:desenvolvimento|duracao|duração|responsavel|responsável|status)\b|$)/i);
  const developmentMatch=command.match(/desenvolvimento\s*[:=\-]?\s*(.+?)(?=\s+(?:duracao|duração|responsavel|responsável|status)\b|$)/i);
  const durationMatch=command.match(/(?:duracao|duração)\s*[:=\-]?\s*([0-9]+\s*(?:min|minutos?|h|horas?))/i);
  const ownerMatch=command.match(/(?:responsavel|responsável)\s*[:=\-]?\s*(.+?)(?=\s+(?:status)\b|$)/i);
  const statusMatch=command.match(/status\s*[:=\-]?\s*(planejamento|em\s+producao|em\s+produção|producao|produção|em\s+revisao|em\s+revisão|revisao|revisão|concluida|concluída)/i);

  return {
    title:titleMatch?titleMatch[1].trim():'',
    level:levelMatch?canonicalLevel(levelMatch[1]):'',
    objective:objectiveMatch?objectiveMatch[1].trim():'',
    development:developmentMatch?developmentMatch[1].trim():'',
    duration:durationMatch?durationMatch[1].trim():'8 min',
    owner:ownerMatch?ownerMatch[1].trim():'',
    status:statusMatch?canonicalStatus(statusMatch[1]):'Planejamento'
  };
}

function getExcelField(row,aliases){
  const normalized={};
  Object.entries(row||{}).forEach(([key,value])=>{
    normalized[normalizeExcelHeader(key)]=value;
  });
  for(const alias of aliases){
    const key=normalizeExcelHeader(alias);
    if(normalized[key]!==undefined && String(normalized[key]).trim()!=='') return String(normalized[key]).trim();
  }
  return '';
}

async function handleAgentExcelImport(event){
  if(role!=='admin') return;
  const input=event.target;
  const file=input.files&&input.files[0];
  if(!file) return;

  try{
    if(typeof XLSX==='undefined') throw new Error('Biblioteca de Excel não carregada.');

    agentAddMessage('user','Importar planilha: '+file.name);

    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array'});
    const sheetName=workbook.SheetNames[0];
    if(!sheetName) throw new Error('A planilha não possui nenhuma aba.');

    const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:false});
    if(!rows.length) throw new Error('A primeira aba está vazia.');

    const existing=new Set(data.skills.map(s=>normalizeAgentText(s.title)));
    const seen=new Set();
    const valid=[];
    const duplicates=[];
    const invalid=[];
    const unknownOwners=[];

    rows.forEach((row,index)=>{
      const title=getExcelField(row,['titulo','título','habilidade','nome']);
      const rawLevel=getExcelField(row,['nivel','nível']);
      const level=canonicalLevel(rawLevel);
      const objective=getExcelField(row,['objetivo']);
      const development=getExcelField(row,['desenvolvimento','roteiro']);
      const duration=getExcelField(row,['duracao','duração','tempo'])||'8 min';
      const rawOwner=getExcelField(row,['responsavel','responsável','instrutor']);
      const status=canonicalStatus(getExcelField(row,['status','situacao','situação']));
      const key=normalizeAgentText(title);

      if(!title || !level){
        invalid.push({linha:index+2,title:title||'(sem título)',motivo:!title?'Título ausente':'Nível inválido ou ausente'});
        return;
      }

      if(existing.has(key)||seen.has(key)){
        duplicates.push({linha:index+2,title});
        return;
      }

      seen.add(key);

      let owner='';
      if(rawOwner){
        const matched=data.people.find(p=>normalizeAgentText(p)===normalizeAgentText(rawOwner));
        if(matched) owner=matched;
        else unknownOwners.push({linha:index+2,title,responsavel:rawOwner});
      }

      valid.push({
        title,
        level,
        objective,
        development,
        duration,
        owner,
        status,
        progress:status==='Concluída'?100:0
      });
    });

    const estimatedBytes=new Blob([JSON.stringify([...data.skills,...valid])]).size;
    if(estimatedBytes>850000){
      agentPendingAction=null;
      agentAddMessage('assistant','Li a planilha, mas o volume de texto ultrapassa o limite seguro da estrutura atual do banco. Antes de importar, precisamos migrar as habilidades para uma coleção própria no Firestore. A planilha possui '+rows.length+' linha(s).');
      renderAgent();
      return;
    }

    agentPendingAction={
      type:'importSkills',
      fileName:file.name,
      sheetName,
      totalRows:rows.length,
      rows:valid,
      duplicates,
      invalid,
      unknownOwners
    };

    agentAddMessage(
      'assistant',
      'Planilha analisada. Encontrei '+valid.length+' habilidade(s) prontas para importar, '+duplicates.length+' duplicada(s) e '+invalid.length+' linha(s) inválida(s).\n\nNada foi importado ainda. Confira o resumo ao lado e confirme para executar.'
    );
  }catch(err){
    console.error('Erro ao importar Excel:',err);
    agentPendingAction=null;
    agentAddMessage('assistant','Não consegui ler essa planilha. Verifique se é um arquivo .xlsx, .xls ou .csv válido e se possui as colunas "titulo" e "nivel".');
  }finally{
    input.value='';
    renderAgent();
  }
}

function processAgentCommand(event){
  event.preventDefault();
  if(role!=='admin') return;

  const input=document.getElementById('agentInput');
  const command=(input.value||'').trim();
  if(!command) return;

  const normalized=normalizeAgentText(command);
  const sanitized=/senha/i.test(command)
    ? command.replace(/(senha\s*[:=\-]?\s*)[^\s,;]+/i,'$1******')
    : command;

  agentAddMessage('user',sanitized);
  input.value='';

  if(agentPendingAction&&agentPendingAction.type==='skillMode'){
    if(/^(uma|1|unica|única|individual|so uma|só uma)\b/.test(normalized)){
      chooseAgentSkillMode('single');
      return;
    }
    if(/^(varias|várias|multiplas|múltiplas|muitas|excel|planilha|lote)\b/.test(normalized)){
      chooseAgentSkillMode('bulk');
      return;
    }
  }

  const wantsCreateUser=/\b(crie|criar|novo|nova)\b/.test(normalized) && /(login|usuario)/.test(normalized);
  const wantsCreateSkill=/\b(crie|criar|nova|novo)\b/.test(normalized) && /habilidade/.test(normalized);

  if(wantsCreateUser){
    prepareAgentCreateUser(command);
    renderAgent();
    return;
  }

  if(wantsCreateSkill){
    prepareAgentSkillMode(command);
    renderAgent();
    return;
  }

  const skillMatch=normalized.match(/(\d+)\s*(?:habilidade|habilidades)/);
  const instructorMatch=normalized.match(/(\d+)\s*(?:instrutor|instrutores)/);
  const skillCount=skillMatch?Number(skillMatch[1]):null;
  const instructorCount=instructorMatch?Number(instructorMatch[1]):null;

  const wantsDistribution=/organiza|organize|distribu|divid|liber|planej|meta/.test(normalized);
  const wantsLoad=/carga|carregado|ocupado|livre|disponivel|quem esta|quantas tarefas/.test(normalized) && !wantsDistribution;

  if(wantsDistribution){
    const plan=buildAgentDistribution(skillCount,instructorCount);
    if(plan.error){
      agentPendingAction=null;
      agentAddMessage('assistant',plan.error);
    }else{
      agentPendingAction=plan;
      agentAddMessage('assistant',agentDistributionSummary(plan));
    }
  }else if(wantsLoad){
    agentPendingAction=null;
    agentAddMessage('assistant',agentTeamSummary());
  }else{
    agentPendingAction=null;
    agentAddMessage(
      'assistant',
      'Posso executar tarefas do portal ADM, sempre pedindo confirmação antes de criar ou alterar dados. Exemplos:\n\n• "Distribua 10 habilidades entre 2 instrutores."\n• "Crie login para Ana Silva, email ana@empresa.com, senha 123456, perfil Instrutor."\n• "Quero criar habilidade." — vou perguntar se é uma ou várias.\n• Use o modelo Excel para cadastrar centenas de habilidades de uma vez.'
    );
  }

  renderAgent();
}

function agentUseExample(text){
  const input=document.getElementById('agentInput');
  if(!input) return;
  input.value=text;
  input.focus();
}

async function executeAgentPlan(action){
  const now=Date.now();
  action.assignments.forEach((assignment,index)=>{
    const exists=data.plans.some(p=>p.week==='Semana atual' && Number(p.skillId)===Number(assignment.skillId));
    if(!exists){
      data.plans.push({
        id:now+index,
        person:assignment.person,
        skillId:assignment.skillId,
        week:'Semana atual',
        origem:'Agente ADM'
      });
    }
    const skill=data.skills.find(s=>Number(s.id)===Number(assignment.skillId));
    if(skill){
      skill.owner=assignment.person;
      if(skill.status==='Planejamento') skill.status='Em produção';
    }
  });
  await save();
  return 'Planejamento aplicado. Distribuí '+action.assignments.length+' habilidade(s) e atualizei os responsáveis.';
}

async function executeAgentCreateUser(action){
  await secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);
  try{
    const credential=await secondaryAuth.createUserWithEmailAndPassword(action.email,action.password);
    const uid=credential.user.uid;
    const profile={
      nome:action.name,
      email:action.email,
      perfil:action.profile,
      cargo:action.profile==='admin'?'ADM':'Instrutor',
      ativo:true,
      criadoPor:currentUserProfile&&currentUserProfile.uid?currentUserProfile.uid:null,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('usuarios').doc(uid).set(profile);

    if(!data.people.includes(action.name)){
      data.people.push(action.name);
      await save();
    }

    await loadTeamUsers();
    return 'Login criado com sucesso para '+action.name+' como '+(action.profile==='admin'?'ADM':'Instrutor')+'.';
  }finally{
    try{await secondaryAuth.signOut();}catch(_){}
  }
}

async function executeAgentCreateSkill(action){
  const skill={
    id:Date.now(),
    title:action.title,
    level:action.level,
    owner:action.owner||'',
    status:action.status||'Planejamento',
    progress:action.status==='Concluída'?100:0,
    duration:action.duration||'8 min',
    objective:action.objective||'',
    development:action.development||''
  };
  data.skills.push(skill);
  await save();
  return 'Habilidade criada com sucesso: '+action.title+'.';
}

async function executeAgentImportSkills(action){
  const now=Date.now();
  action.rows.forEach((row,index)=>{
    data.skills.push({
      id:now+index,
      title:row.title,
      level:row.level,
      owner:row.owner||'',
      status:row.status||'Planejamento',
      progress:Number(row.progress||0),
      duration:row.duration||'8 min',
      objective:row.objective||'',
      development:row.development||''
    });
  });
  await save();
  return 'Importação concluída. '+action.rows.length+' habilidade(s) foram adicionadas ao sistema.';
}

async function confirmAgentAction(){
  if(role!=='admin' || !agentPendingAction) return;

  const button=document.getElementById('agentConfirmButton');
  if(button){button.disabled=true;button.textContent='Executando...';}

  const action=agentPendingAction;
  try{
    let result='';
    if(action.type==='plan') result=await executeAgentPlan(action);
    if(action.type==='createUser') result=await executeAgentCreateUser(action);
    if(action.type==='createSkill') result=await executeAgentCreateSkill(action);
    if(action.type==='importSkills') result=await executeAgentImportSkills(action);

    agentPendingAction=null;
    agentAddMessage('assistant',result||'Ação concluída.');
  }catch(err){
    console.error('Erro ao executar ação do Agente ADM:',err);
    agentAddMessage('assistant','Não consegui concluir a ação. '+(err&&err.message?err.message:'Verifique Firebase e tente novamente.'));
  }
  renderAgent();
}

function cancelAgentAction(){
  agentPendingAction=null;
  agentAddMessage('assistant','Ação cancelada. Nenhuma alteração foi feita.');
  renderAgent();
}

function renderAgentPendingAction(){

        '<a class="btn btn-soft" href="/assets/modelos/modelo-importacao-habilidades.xlsx" download>Baixar modelo Excel</a>'+

      '<div class="agent-warning">Nenhuma habilidade será criada sem você revisar o resumo e confirmar a importação.</div>'+
      '<div class="agent-confirm"><button class="btn btn-soft" type="button" onclick="cancelAgentAction()">Cancelar</button></div>'+
    '</div>';
  }

  let body='';
  let confirmLabel='Confirmar e executar';

  if(a.type==='plan'){
    const grouped={};
    a.assignments.forEach(item=>{
      if(!grouped[item.person]) grouped[item.person]=[];
      grouped[item.person].push(item);
    });
    body='<h4>Planejamento proposto</h4>'+
      Object.entries(grouped).map(([person,items])=>
        '<div style="margin-bottom:12px"><b>'+esc(person)+'</b>'+

        '</div>'
      ).join('');
    confirmLabel='Aplicar planejamento';
  }

  if(a.type==='createUser'){
    body='<h4>Novo login</h4>'+
      '<div class="agent-plan-item"><b>Nome</b>'+esc(a.name)+'</div>'+
      '<div class="agent-plan-item"><b>E-mail</b>'+esc(a.email)+'</div>'+
      '<div class="agent-plan-item"><b>Perfil</b>'+(a.profile==='admin'?'ADM':'Instrutor')+'</div>'+
      '<div class="agent-plan-item"><b>Senha</b>••••••••</div>';
    confirmLabel='Criar login';
  }

  if(a.type==='createSkill'){
    body='<h4>Nova habilidade</h4>'+
      '<div class="agent-plan-item"><b>Título</b>'+esc(a.title)+'</div>'+
      '<div class="agent-plan-item"><b>Nível</b>'+esc(a.level)+'</div>'+
      '<div class="agent-plan-item"><b>Duração</b>'+esc(a.duration||'8 min')+'</div>'+
      '<div class="agent-plan-item"><b>Status</b>'+esc(a.status||'Planejamento')+'</div>'+
      (a.objective?'<div class="agent-plan-item"><b>Objetivo</b>'+esc(a.objective)+'</div>':'')+
      (a.development?'<div class="agent-plan-item"><b>Desenvolvimento</b>'+esc(a.development)+'</div>':'');
    confirmLabel='Criar habilidade';
  }

  if(a.type==='importSkills'){
    body='<h4>Importação de Excel</h4>'+
      '<div class="muted">'+esc(a.fileName)+' • aba '+esc(a.sheetName)+'</div>'+
      '<div class="agent-import-summary">'+
        '<div class="agent-import-kpi"><span class="muted">Prontas</span><b>'+a.rows.length+'</b></div>'+
        '<div class="agent-import-kpi"><span class="muted">Duplicadas</span><b>'+a.duplicates.length+'</b></div>'+
        '<div class="agent-import-kpi"><span class="muted">Inválidas</span><b>'+a.invalid.length+'</b></div>'+
      '</div>'+
      '<div class="agent-preview-list">'+
        a.rows.slice(0,12).map((s,i)=>'<div class="agent-preview-row"><b>'+(i+1)+'. '+esc(s.title)+'</b><br>'+esc(s.level)+' • '+esc(s.duration||'8 min')+'</div>').join('')+
        (a.rows.length>12?'<div class="agent-preview-row">… e mais '+(a.rows.length-12)+' habilidade(s)</div>':'')+
      '</div>'+
      (a.unknownOwners.length?'<div class="agent-warning">'+a.unknownOwners.length+' linha(s) possuem responsável que não corresponde a um usuário cadastrado. Essas habilidades serão importadas sem responsável.</div>':'')+
      (a.invalid.length?'<div class="agent-warning">Linhas inválidas não serão importadas. Confira título e nível.</div>':'');
    confirmLabel='Importar '+a.rows.length+' habilidades';
  }

  return '<div class="agent-plan">'+body+
    '<div class="agent-confirm">'+
      '<button id="agentConfirmButton" class="btn btn-primary" onclick="confirmAgentAction()">'+esc(confirmLabel)+'</button>'+
      '<button class="btn btn-soft" onclick="cancelAgentAction()">Cancelar</button>'+

  const instructors=getActiveInstructors()
    .map(name=>({name,load:getWeeklyLoad(name)}))

  document.getElementById('content').innerHTML=
    '<div class="agent-shell">'+
      '<div class="agent-chat">'+

}
