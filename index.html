async function save(){
  cacheLocal();
  if(!cloudReady) return;
  try{
    await db.collection('sistema').doc('sharedData').set({
      skills:data.skills,
      plans:data.plans,
      people:data.people,
      atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    cloudMessage='Firebase sincronizado';
    updateCloudBadge();
  }catch(err){
    console.error('Erro ao salvar no Firebase:',err);
    cloudMessage='Firebase sem permissão';
    updateCloudBadge();
  }
}

async function initCloud(){
  try{
    const ref=db.collection('sistema').doc('sharedData');
    const snap=await ref.get();
    if(snap.exists){
      const remote=snap.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people
      };
      cacheLocal();
    }else{
      await ref.set({
        skills:defaults.skills,
        plans:defaults.plans,
        people:defaults.people,
        criadoEm:firebase.firestore.FieldValue.serverTimestamp(),
        atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
      });
      data=JSON.parse(JSON.stringify(defaults));
      cacheLocal();
    }
    cloudReady=true;
    cloudMessage='Firebase sincronizado';
    updateCloudBadge();

    if(cloudUnsubscribe) cloudUnsubscribe();
    cloudUnsubscribe=ref.onSnapshot(doc=>{
      if(!doc.exists) return;
      const remote=doc.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people
      };
      cacheLocal();
      if(role) go(currentPage);
    },err=>{
      console.error('Falha na sincronização em tempo real:',err);
      cloudMessage='Firebase offline';
      updateCloudBadge();
    });
  }catch(err){
    console.warn('Firestore ainda não disponível; usando armazenamento local.',err);
    cloudReady=false;
    cloudMessage='Usando dados locais';
    updateCloudBadge();
  }
}

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function friendlyAuthError(err){
  const code=err && err.code ? err.code : '';
  if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')) return 'E-mail ou senha inválidos.';
  if(code.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if(code.includes('network-request-failed')) return 'Falha de conexão. Verifique a internet.';
  if(code.includes('operation-not-allowed')) return 'O login por e-mail e senha ainda não está ativado no Firebase.';
  if(code.includes('user-disabled')) return 'Este usuário está desativado no Firebase.';
  return 'Não foi possível entrar. Confira o e-mail e a senha.';
}

async function loginWithEmail(event){
  event.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;

  // Lembra apenas o e-mail no navegador.
  // A senha fica a cargo do gerenciador seguro de senhas do próprio navegador.
  if(email) localStorage.setItem('ead-irmen-last-email',email);
  const btn=document.getElementById('loginButton');
  const error=document.getElementById('loginError');

  error.textContent='';
  btn.disabled=true;
  btn.textContent='Entrando...';

  try{
    loginAutorizadoNestaPagina=true;
    await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
    const credential=await auth.signInWithEmailAndPassword(email,password);

    // Não dependemos apenas do onAuthStateChanged.
    // Isso evita ficar preso em "Entrando..." quando já existe uma sessão salva.
    await openAuthenticatedApp(credential.user);
  }catch(err){
    loginAutorizadoNestaPagina=false;
    console.error('Falha no login:',err);
    const message=err && err.message ? err.message : '';
    error.textContent=message.startsWith('EAD:') ? message.replace(/^EAD:\s*/,'') : friendlyAuthError(err);
    btn.disabled=false;
    btn.textContent='Entrar';
  }
}

async function ensureUserProfile(user){
  const ref=db.collection('usuarios').doc(user.uid);
  const email=(user.email||'').trim().toLowerCase();
  const isZion=email==='zion.almeida@irmen.com.br';

  const perfilZion={
    nome:'Zion Almeida',
    email:user.email||'',
    perfil:'admin',
    cargo:'ADM',
    ativo:true
  };

  try{
    const snap=await ref.get();

    if(snap.exists){
      return {uid:user.uid,...snap.data()};
    }

    if(isZion){
      try{
        await ref.set({
          ...perfilZion,
          criadoEm:firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});
      }catch(writeErr){
        console.warn('Perfil ADM autenticado; Firestore ainda sem permissão de escrita.',writeErr);
      }
      return {uid:user.uid,...perfilZion};
    }

    return null;
  }catch(err){
    console.warn('Não foi possível ler o perfil no Firestore.',err);
    if(isZion){
      return {uid:user.uid,...perfilZion};
    }
    throw err;
  }
}

async function loadTeamUsers(){
  try{
    const snap=await db.collection('usuarios').get();
    teamUsers=snap.docs.map(d=>({uid:d.id,...d.data()}));
    const names=teamUsers.map(u=>u.nome).filter(Boolean);
    names.forEach(name=>{ if(!data.people.includes(name)) data.people.push(name); });
  }catch(err){
    console.warn('Não foi possível carregar usuários da equipe',err);
    teamUsers=[];
  }
}

async function openAuthenticatedApp(user){
  if(!user) return;
  if(appReadyUid===user.uid && !document.getElementById('app').classList.contains('hidden')) return;
  if(openingUserUid===user.uid) return;

  openingUserUid=user.uid;
  const loginError=document.getElementById('loginError');
  const btn=document.getElementById('loginButton');

  try{
    const profile=await ensureUserProfile(user);

    if(!profile){
      throw new Error('EAD: Login autenticado, mas o perfil ainda não foi cadastrado no EAD Irmen.');
    }

    if(profile.ativo===false){
      throw new Error('EAD: Este login está desativado. Procure um administrador.');
    }

    if(!['admin','consultant','instructor'].includes(profile.perfil)){
      throw new Error('EAD: O perfil deste usuário está inválido no Firestore.');
    }

    currentUserProfile=profile;
    role=profile.perfil;
    currentPersonName=profile.nome||user.email||'Usuário';

    document.getElementById('profileName').textContent=currentPersonName;
    document.getElementById('profileRole').textContent='Perfil: '+(profile.cargo || (role==='admin'?'ADM':role==='consultant'?'Consultor de Treinamento':'Instrutor'));

    // Abre a interface primeiro. Sincronizações secundárias não podem travar o login.
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    buildNav();
    go(role==='consultant'?'fleet':'dashboard');
    appReadyUid=user.uid;

    // Carregamentos complementares executam depois que a interface já abriu.
    await loadTeamUsers();
    await initCloud();
    go(currentPage);
  }catch(err){
    appReadyUid=null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
    loginError.textContent=(err && err.message ? err.message.replace(/^EAD:\s*/,'') : 'Falha ao carregar o perfil do usuário.');
    throw err;
  }finally{
    openingUserUid=null;
    if(btn){
      btn.disabled=false;
      btn.textContent='Entrar';
    }
  }
}

function buildNav(){

      ? [['fleet','Acompanhamento de Frotas']]
      : [['dashboard','Minha semana'],['fleet','Frotas'],['skills','Minhas habilidades'],['week','Planejamento']];

  const nav=document.getElementById('nav');
  nav.innerHTML='';

  items.forEach(([page,label])=>{
    const button=document.createElement('button');
    button.type='button';
    button.dataset.p=page;
    button.textContent=label;
    button.addEventListener('click',()=>go(page));
    nav.appendChild(button);
  });
}

function userCreationError(err){
  const code=err&&err.code?err.code:'';
  if(code.includes('email-already-in-use')) return 'Já existe um login com esse e-mail.';
  if(code.includes('invalid-email')) return 'Informe um e-mail válido.';
  if(code.includes('weak-password')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(code.includes('operation-not-allowed')) return 'Ative E-mail/senha no Firebase Authentication.';
  if(code.includes('permission-denied')) return 'Sem permissão para gravar o perfil no Firestore.';
  return 'Não foi possível criar o login.';
}


async function adminUserAction(payload){
  const user=auth.currentUser;
  if(!user) throw new Error('Sua sessão expirou. Entre novamente.');
  const token=await user.getIdToken(true);
  const response=await fetch('/api/admin-users',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+token
    },
    body:JSON.stringify(payload)
  });

  let body={};
  try{ body=await response.json(); }catch(_){}

  if(!response.ok){
    throw new Error(body.error || 'Não foi possível concluir a operação.');
  }

  return body;
}

async function createUserLogin(event){
  event.preventDefault();
  if(role!=='admin') return;

  const name=document.getElementById('newUserName').value.trim();
  const email=document.getElementById('newUserEmail').value.trim().toLowerCase();
  const password=document.getElementById('newUserPassword').value;

  msg.textContent='';

  if(!name){msg.textContent='Informe o nome.';return;}
  if(password.length<6){msg.textContent='A senha precisa ter pelo menos 6 caracteres.';return;}
  if(!['admin','consultant','instructor'].includes(newRole)){msg.textContent='Selecione ADM, Consultor de Treinamento ou Instrutor.';return;}

  btn.disabled=true;
  btn.textContent='Criando...';

  try{
    await secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);
    const credential=await secondaryAuth.createUserWithEmailAndPassword(email,password);
    const uid=credential.user.uid;
    const profile={
      nome:name,
      email,
      perfil:newRole,
      cargo:newRole==='admin'?'ADM':newRole==='consultant'?'Consultor de Treinamento':'Instrutor',
      ativo:true,
      criadoPor:currentUserProfile&&currentUserProfile.uid?currentUserProfile.uid:null,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('usuarios').doc(uid).set(profile);

    if(!data.people.includes(name)){
      data.people.push(name);
      await save();
    }

    await secondaryAuth.signOut();
    await loadTeamUsers();
    renderUsers('Login criado com sucesso para '+name+'.');
  }catch(err){
    console.error(err);
    try{await secondaryAuth.signOut();}catch(_){}
    msg.textContent=userCreationError(err);
    btn.disabled=false;
    btn.textContent='Criar login';
  }
}


function normalizeAgentText(text){
  return String(text||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();
}

function normalizeExcelHeader(text){
  return normalizeAgentText(text)
    .replace(/[^a-z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'');
}

function canonicalLevel(value){
  const v=normalizeAgentText(value);
  if(v==='basica'||v==='basico') return 'Básica';
  if(v==='intermediaria'||v==='intermediario') return 'Intermediária';
  if(v==='media'||v==='medio') return 'Média';
  if(v==='avancada'||v==='avancado') return 'Avançada';
  return '';
}

function canonicalStatus(value){
  const v=normalizeAgentText(value);
  if(!v) return 'Planejamento';
  if(v==='planejamento') return 'Planejamento';
  if(v==='em producao'||v==='producao') return 'Em produção';
  if(v==='em revisao'||v==='revisao') return 'Em revisão';
  if(v==='concluida'||v==='concluido'||v==='concluido(a)') return 'Concluída';
  return 'Planejamento';
}

function getActiveInstructors(){
  const firestoreInstructors=teamUsers
    .filter(u=>u.perfil==='instructor' && u.ativo!==false)
    .map(u=>u.nome)
    .filter(Boolean);

  const fallback=data.people.filter(name=>{
    if(!name) return false;
    const user=teamUsers.find(u=>u.nome===name);
    if(user && user.perfil==='admin') return false;
    return name!==currentPersonName;
  });

  return [...new Set(firestoreInstructors.length?firestoreInstructors:fallback)];
}

function getWeeklyLoad(person){
  return data.plans.filter(p=>p.week==='Semana atual' && p.person===person).length;
}

function getAgentEligibleSkills(){
  const alreadyPlanned=new Set(
    data.plans
      .filter(p=>p.week==='Semana atual')
      .map(p=>Number(p.skillId))
  );

  const statusPriority={'Planejamento':0,'Em produção':1,'Em revisão':2};

  return data.skills
    .filter(s=>s.status!=='Concluída' && !alreadyPlanned.has(Number(s.id)))
    .sort((a,b)=>{
      const pa=statusPriority[a.status]??9;
      const pb=statusPriority[b.status]??9;
      if(pa!==pb) return pa-pb;
      return Number(a.progress||0)-Number(b.progress||0);
    });
}

function buildAgentDistribution(skillCount,instructorCount){
  const instructors=getActiveInstructors()
    .map(name=>({name,load:getWeeklyLoad(name)}))
    .sort((a,b)=>a.load-b.load || a.name.localeCompare(b.name));

  if(!instructors.length){
    return {error:'Não encontrei nenhum usuário ativo com perfil Instrutor. Cadastre ou ative os instrutores antes de montar a distribuição.'};
  }

  const useCount=Math.max(1,Math.min(Number(instructorCount)||instructors.length,instructors.length));
  const selectedInstructors=instructors.slice(0,useCount);
  const eligible=getAgentEligibleSkills();

  if(!eligible.length){
    return {error:'Não há habilidades pendentes e ainda não planejadas disponíveis para distribuir nesta semana.'};
  }

  const requested=Math.max(1,Number(skillCount)||eligible.length);
  const selectedSkills=eligible.slice(0,requested);
  const dynamicLoads=Object.fromEntries(selectedInstructors.map(i=>[i.name,i.load]));
  const assignments=[];

  selectedSkills.forEach(skill=>{
    const person=selectedInstructors
      .slice()
      .sort((a,b)=>dynamicLoads[a.name]-dynamicLoads[b.name] || a.name.localeCompare(b.name))[0];

    assignments.push({
      skillId:skill.id,
      skillTitle:skill.title,
      level:skill.level,
      person:person.name,
      previousLoad:dynamicLoads[person.name]
    });
    dynamicLoads[person.name]+=1;
  });

  return {
    type:'plan',
    requested,
    available:eligible.length,
    selectedInstructors:selectedInstructors.map(i=>i.name),
    assignments,
    finalLoads:dynamicLoads,
    limited:selectedSkills.length<requested
  };
}

function agentAddMessage(type,text){

function agentDistributionSummary(plan){
  const perPerson={};
  plan.assignments.forEach(a=>{
    if(!perPerson[a.person]) perPerson[a.person]=[];
    perPerson[a.person].push(a);
  });

  let text='Preparei a distribuição de '+plan.assignments.length+' habilidade(s) para esta semana.\n\n';
  Object.entries(perPerson).forEach(([person,items])=>{
    text+='• '+person+': '+items.length+' habilidade(s)\n';
  });

  if(plan.limited){
    text+='\nVocê pediu '+plan.requested+', mas encontrei somente '+plan.assignments.length+' habilidade(s) pendentes e disponíveis.';
  }else{
    text+='\nA distribuição foi equilibrada considerando a carga que cada instrutor já possui nesta semana.';
  }

  text+='\n\nNenhuma alteração foi feita ainda. Confirme o plano ao lado para executar.';
  return text;
}

function agentTeamSummary(){
  const instructors=getActiveInstructors();
  if(!instructors.length) return 'Não encontrei instrutores ativos cadastrados.';
  const stats=instructors
    .map(name=>({name,load:getWeeklyLoad(name)}))
    .sort((a,b)=>b.load-a.load);

  return 'Carga atual da semana:\n\n'+stats.map(s=>'• '+s.name+': '+s.load+' habilidade(s)').join('\n');
}

function parseAgentUserCommand(command){
  const email=(command.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';
  const passMatch=command.match(/senha\s*[:=\-]?\s*["']?([^\s,;]+)["']?/i);
  const password=passMatch?passMatch[1]:'';
  const roleMatch=command.match(/(?:perfil|como)\s*[:=\-]?\s*(adm|admin|administrador|instrutor)/i);
  const profile=roleMatch
    ? (/adm|admin|administrador/i.test(roleMatch[1])?'admin':'instructor')
    : '';

  let name='';
  const nameMatch=command.match(/(?:crie|criar|novo|nova)?\s*(?:um\s*)?(?:login|usuario|usuário)\s+(?:para\s+)?(.+?)(?=\s+(?:email|e-mail|senha|perfil|como)\b|$)/i);
  if(nameMatch) name=nameMatch[1].replace(/^para\s+/i,'').trim();

  return {name,email,password,profile};
}

function parseAgentSkillCommand(command){
  const titleMatch=command.match(/(?:habilidade|titulo|título)\s*[:=\-]?\s*(.+?)(?=\s+(?:nivel|nível|objetivo|desenvolvimento|duracao|duração|responsavel|responsável|status)\b|$)/i);
  const levelMatch=command.match(/(?:nivel|nível)\s*[:=\-]?\s*(basica|básica|basico|básico|intermediaria|intermediária|intermediario|intermediário|media|média|medio|médio|avancada|avançada|avancado|avançado)/i);
  const objectiveMatch=command.match(/objetivo\s*[:=\-]?\s*(.+?)(?=\s+(?:desenvolvimento|duracao|duração|responsavel|responsável|status)\b|$)/i);
  const developmentMatch=command.match(/desenvolvimento\s*[:=\-]?\s*(.+?)(?=\s+(?:duracao|duração|responsavel|responsável|status)\b|$)/i);
  const durationMatch=command.match(/(?:duracao|duração)\s*[:=\-]?\s*([0-9]+\s*(?:min|minutos?|h|horas?))/i);
  const ownerMatch=command.match(/(?:responsavel|responsável)\s*[:=\-]?\s*(.+?)(?=\s+(?:status)\b|$)/i);
  const statusMatch=command.match(/status\s*[:=\-]?\s*(planejamento|em\s+producao|em\s+produção|producao|produção|em\s+revisao|em\s+revisão|revisao|revisão|concluida|concluída)/i);

  return {
    title:titleMatch?titleMatch[1].trim():'',
    level:levelMatch?canonicalLevel(levelMatch[1]):'',
    objective:objectiveMatch?objectiveMatch[1].trim():'',
    development:developmentMatch?developmentMatch[1].trim():'',
    duration:durationMatch?durationMatch[1].trim():'8 min',
    owner:ownerMatch?ownerMatch[1].trim():'',
    status:statusMatch?canonicalStatus(statusMatch[1]):'Planejamento'
  };
}

  if(mode==='single'){

    agentAddMessage('assistant','Certo. Vamos criar uma habilidade. Vou usar as informações que você já informou e pedir somente o que estiver faltando.');

function getExcelField(row,aliases){
  const normalized={};
  Object.entries(row||{}).forEach(([key,value])=>{
    normalized[normalizeExcelHeader(key)]=value;
  });
  for(const alias of aliases){
    const key=normalizeExcelHeader(alias);
    if(normalized[key]!==undefined && String(normalized[key]).trim()!=='') return String(normalized[key]).trim();
  }
  return '';
}

async function handleAgentExcelImport(event){
  if(role!=='admin') return;
  const input=event.target;
  const file=input.files&&input.files[0];
  if(!file) return;

  try{
    if(typeof XLSX==='undefined') throw new Error('Biblioteca de Excel não carregada.');

    agentAddMessage('user','Importar planilha: '+file.name);

    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array'});
    const sheetName=workbook.SheetNames[0];
    if(!sheetName) throw new Error('A planilha não possui nenhuma aba.');

    const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:false});
    if(!rows.length) throw new Error('A primeira aba está vazia.');

    const existing=new Set(data.skills.map(s=>normalizeAgentText(s.title)));
    const seen=new Set();
    const valid=[];
    const duplicates=[];
    const invalid=[];
    const unknownOwners=[];

    rows.forEach((row,index)=>{
      const title=getExcelField(row,['titulo','título','habilidade','nome']);
      const rawLevel=getExcelField(row,['nivel','nível']);
      const level=canonicalLevel(rawLevel);
      const objective=getExcelField(row,['objetivo']);
      const development=getExcelField(row,['desenvolvimento','roteiro']);
      const duration=getExcelField(row,['duracao','duração','tempo'])||'8 min';
      const rawOwner=getExcelField(row,['responsavel','responsável','instrutor']);
      const status=canonicalStatus(getExcelField(row,['status','situacao','situação']));
      const key=normalizeAgentText(title);

      if(!title || !level){
        invalid.push({linha:index+2,title:title||'(sem título)',motivo:!title?'Título ausente':'Nível inválido ou ausente'});
        return;
      }

      if(existing.has(key)||seen.has(key)){
        duplicates.push({linha:index+2,title});
        return;
      }

      seen.add(key);

      let owner='';
      if(rawOwner){
        const matched=data.people.find(p=>normalizeAgentText(p)===normalizeAgentText(rawOwner));
        if(matched) owner=matched;
        else unknownOwners.push({linha:index+2,title,responsavel:rawOwner});
      }

      valid.push({
        title,
        level,
        objective,
        development,
        duration,
        owner,
        status,
        progress:status==='Concluída'?100:0
      });
    });

    const estimatedBytes=new Blob([JSON.stringify([...data.skills,...valid])]).size;
    if(estimatedBytes>850000){
      agentPendingAction=null;
      agentAddMessage('assistant','Li a planilha, mas o volume de texto ultrapassa o limite seguro da estrutura atual do banco. Antes de importar, precisamos migrar as habilidades para uma coleção própria no Firestore. A planilha possui '+rows.length+' linha(s).');
      renderAgent();
      return;
    }

    agentPendingAction={
      type:'importSkills',
      fileName:file.name,
      sheetName,
      totalRows:rows.length,
      rows:valid,
      duplicates,
      invalid,
      unknownOwners
    };

    agentAddMessage(
      'assistant',
      'Planilha analisada. Encontrei '+valid.length+' habilidade(s) prontas para importar, '+duplicates.length+' duplicada(s) e '+invalid.length+' linha(s) inválida(s).\n\nNada foi importado ainda. Confira o resumo ao lado e confirme para executar.'
    );
  }catch(err){
    console.error('Erro ao importar Excel:',err);
    agentPendingAction=null;
    agentAddMessage('assistant','Não consegui ler essa planilha. Verifique se é um arquivo .xlsx, .xls ou .csv válido e se possui as colunas "titulo" e "nivel".');
  }finally{
    input.value='';
    renderAgent();
  }
}

function processAgentCommand(event){
  event.preventDefault();
  if(role!=='admin') return;

  const input=document.getElementById('agentInput');
  const command=(input.value||'').trim();
  if(!command) return;

  const normalized=normalizeAgentText(command);
  const sanitized=/senha/i.test(command)
    ? command.replace(/(senha\s*[:=\-]?\s*)[^\s,;]+/i,'$1******')
    : command;

  agentAddMessage('user',sanitized);
  input.value='';

  if(agentPendingAction&&agentPendingAction.type==='skillMode'){
    if(/^(uma|1|unica|única|individual|so uma|só uma)\b/.test(normalized)){
      chooseAgentSkillMode('single');
      return;
    }
    if(/^(varias|várias|multiplas|múltiplas|muitas|excel|planilha|lote)\b/.test(normalized)){
      chooseAgentSkillMode('bulk');
      return;
    }
  }

  const wantsCreateUser=/\b(crie|criar|novo|nova)\b/.test(normalized) && /(login|usuario)/.test(normalized);
  const wantsCreateSkill=/\b(crie|criar|nova|novo)\b/.test(normalized) && /habilidade/.test(normalized);

  if(wantsCreateUser){
    prepareAgentCreateUser(command);
    renderAgent();
    return;
  }

  if(wantsCreateSkill){
    prepareAgentSkillMode(command);
    renderAgent();
    return;
  }

  const skillMatch=normalized.match(/(\d+)\s*(?:habilidade|habilidades)/);
  const instructorMatch=normalized.match(/(\d+)\s*(?:instrutor|instrutores)/);
  const skillCount=skillMatch?Number(skillMatch[1]):null;
  const instructorCount=instructorMatch?Number(instructorMatch[1]):null;

  const wantsDistribution=/organiza|organize|distribu|divid|liber|planej|meta/.test(normalized);
  const wantsLoad=/carga|carregado|ocupado|livre|disponivel|quem esta|quantas tarefas/.test(normalized) && !wantsDistribution;

  if(wantsDistribution){
    const plan=buildAgentDistribution(skillCount,instructorCount);
    if(plan.error){
      agentPendingAction=null;
      agentAddMessage('assistant',plan.error);
    }else{
      agentPendingAction=plan;
      agentAddMessage('assistant',agentDistributionSummary(plan));
    }
  }else if(wantsLoad){
    agentPendingAction=null;
    agentAddMessage('assistant',agentTeamSummary());
  }else{
    agentPendingAction=null;
    agentAddMessage(
      'assistant',
      'Posso executar tarefas do portal ADM, sempre pedindo confirmação antes de criar ou alterar dados. Exemplos:\n\n• "Distribua 10 habilidades entre 2 instrutores."\n• "Crie login para Ana Silva, email ana@empresa.com, senha 123456, perfil Instrutor."\n• "Quero criar habilidade." — vou perguntar se é uma ou várias.\n• Use o modelo Excel para cadastrar centenas de habilidades de uma vez.'
    );
  }

  renderAgent();
}

function agentUseExample(text){
  const input=document.getElementById('agentInput');
  if(!input) return;
  input.value=text;
  input.focus();
}

async function executeAgentPlan(action){
  const now=Date.now();
  action.assignments.forEach((assignment,index)=>{
    const exists=data.plans.some(p=>p.week==='Semana atual' && Number(p.skillId)===Number(assignment.skillId));
    if(!exists){
      data.plans.push({
        id:now+index,
        person:assignment.person,
        skillId:assignment.skillId,
        week:'Semana atual',
        origem:'Agente ADM'
      });
    }
    const skill=data.skills.find(s=>Number(s.id)===Number(assignment.skillId));
    if(skill){
      skill.owner=assignment.person;
      if(skill.status==='Planejamento') skill.status='Em produção';
    }
  });
  await save();
  return 'Planejamento aplicado. Distribuí '+action.assignments.length+' habilidade(s) e atualizei os responsáveis.';
}

async function executeAgentCreateUser(action){
  await secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);
  try{
    const credential=await secondaryAuth.createUserWithEmailAndPassword(action.email,action.password);
    const uid=credential.user.uid;
    const profile={
      nome:action.name,
      email:action.email,
      perfil:action.profile,
      cargo:action.profile==='admin'?'ADM':'Instrutor',
      ativo:true,
      criadoPor:currentUserProfile&&currentUserProfile.uid?currentUserProfile.uid:null,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('usuarios').doc(uid).set(profile);

    if(!data.people.includes(action.name)){
      data.people.push(action.name);
      await save();
    }

    await loadTeamUsers();
    return 'Login criado com sucesso para '+action.name+' como '+(action.profile==='admin'?'ADM':'Instrutor')+'.';
  }finally{
    try{await secondaryAuth.signOut();}catch(_){}
  }
}

async function executeAgentCreateSkill(action){
  const skill={
    id:Date.now(),
    title:action.title,
    level:action.level,
    owner:action.owner||'',
    status:action.status||'Planejamento',
    progress:action.status==='Concluída'?100:0,
    duration:action.duration||'8 min',
    objective:action.objective||'',
    development:action.development||''
  };
  data.skills.push(skill);
  await save();
  return 'Habilidade criada com sucesso: '+action.title+'.';
}

async function executeAgentImportSkills(action){
  const now=Date.now();
  action.rows.forEach((row,index)=>{
    data.skills.push({
      id:now+index,
      title:row.title,
      level:row.level,
      owner:row.owner||'',
      status:row.status||'Planejamento',
      progress:Number(row.progress||0),
      duration:row.duration||'8 min',
      objective:row.objective||'',
      development:row.development||''
    });
  });
  await save();
  return 'Importação concluída. '+action.rows.length+' habilidade(s) foram adicionadas ao sistema.';
}

async function confirmAgentAction(){
  if(role!=='admin' || !agentPendingAction) return;

  const button=document.getElementById('agentConfirmButton');
  if(button){button.disabled=true;button.textContent='Executando...';}

  const action=agentPendingAction;
  try{
    let result='';
    if(action.type==='plan') result=await executeAgentPlan(action);
    if(action.type==='createUser') result=await executeAgentCreateUser(action);
    if(action.type==='createSkill') result=await executeAgentCreateSkill(action);
    if(action.type==='importSkills') result=await executeAgentImportSkills(action);

    agentPendingAction=null;
    agentAddMessage('assistant',result||'Ação concluída.');
  }catch(err){
    console.error('Erro ao executar ação do Agente ADM:',err);
    agentAddMessage('assistant','Não consegui concluir a ação. '+(err&&err.message?err.message:'Verifique Firebase e tente novamente.'));
  }
  renderAgent();
}

function cancelAgentAction(){
  agentPendingAction=null;
  agentAddMessage('assistant','Ação cancelada. Nenhuma alteração foi feita.');
  renderAgent();
}

function fleetStatusClass(status){
  if(status==='Operação normal') return 'normal';
  if(status==='Atenção') return 'atencao';
  if(status==='Crítico') return 'critico';
  return 'visita';
}

function fleetPriorityClass(priority){
  const p=normalizeAgentText(priority||'');
  if(p==='critica') return 'critica';
  if(p==='alta') return 'alta';
  if(p==='media') return 'media';
  return 'baixa';
}

function fleetStatusBadge(status){
  return '<span class="fleet-status '+fleetStatusClass(status)+'">'+esc(status)+'</span>';
}

function fleetPriorityBadge(priority){
  return '<span class="fleet-priority '+fleetPriorityClass(priority)+'">'+esc(priority||'Baixa')+'</span>';
}

function fleetDate(value){
  if(!value) return '—';
  const parts=String(value).split('-');
  if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  return value;
}
function fleetHasBattery(m){return m&&(m.tipoPropulsao==='Elétrico'||m.tipoPropulsao==='Híbrido')}
function fleetMoney(value){return Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fleetCostHistory(m){
  if(!m||m.tipoPropulsao!=='Elétrico') return [];
  let h=Array.isArray(m.historicoCustos)?m.historicoCustos.slice():[];
  if(!h.length&&Number(m.tarifaEnergia)>0&&Number(m.precoDiesel)>0){
    h=[{id:'inicial',dataInicio:m.ultimaAtualizacao||new Date().toISOString().slice(0,10),horimetroInicio:Math.max(0,Number(m.horimetroInicioEconomia)||0),tarifaEnergia:Number(m.tarifaEnergia),precoDiesel:Number(m.precoDiesel),responsavel:'Cadastro inicial'}];
  }
  return h.filter(x=>Number(x.tarifaEnergia)>0&&Number(x.precoDiesel)>0).map(x=>({...x,horimetroInicio:Math.max(0,Number(x.horimetroInicio)||0),tarifaEnergia:Number(x.tarifaEnergia),precoDiesel:Number(x.precoDiesel)})).sort((a,b)=>a.horimetroInicio-b.horimetroInicio||String(a.dataInicio||'').localeCompare(String(b.dataInicio||'')));
}
function fleetCurrentCost(m){const h=fleetCostHistory(m);return h.length?h[h.length-1]:null}
function fleetEconomy(m){
  if(!m||m.tipoPropulsao!=='Elétrico') return null;
  const electricKwh=Math.max(0,Number(m.consumoEletricoKwhHora)||0),dieselLh=Math.max(0,Number(m.consumoDieselReferenciaLHora)||0),currentHours=Math.max(0,Number(m.horimetro)||0),history=fleetCostHistory(m);
  if(!electricKwh||!dieselLh||!history.length) return null;
  let totalHours=0,totalElectric=0,totalDiesel=0,totalSaving=0;
  const periods=history.map((entry,index)=>{
    const start=Math.min(currentHours,entry.horimetroInicio);
    const next=history[index+1];
    const end=next?Math.min(currentHours,Math.max(start,next.horimetroInicio)):currentHours;
    const hours=Math.max(0,end-start),custoEletricoHora=electricKwh*entry.tarifaEnergia,custoDieselHora=dieselLh*entry.precoDiesel,economiaHora=custoDieselHora-custoEletricoHora,economiaPeriodo=economiaHora*hours;
    totalHours+=hours;totalElectric+=custoEletricoHora*hours;totalDiesel+=custoDieselHora*hours;totalSaving+=economiaPeriodo;
    return {...entry,start,end,hours,custoEletricoHora,custoDieselHora,economiaHora,economiaPeriodo};
  });
  const current=periods[periods.length-1];
  return {hours:totalHours,custoEletricoHora:current?.custoEletricoHora||0,custoDieselHora:current?.custoDieselHora||0,economiaHora:current?.economiaHora||0,economiaTotal:totalSaving,custoEletricoTotal:totalElectric,custoDieselTotal:totalDiesel,percentual:totalDiesel>0?totalSaving/totalDiesel*100:0,periods};
}
function fleetCostHistoryHtml(m){
  const e=fleetEconomy(m);if(!e||!e.periods.length)return '';
  return '<div class="fleet-panel" style="margin-top:14px"><h3>Histórico de custos aplicados</h3><div class="table-wrap"><table><thead><tr><th>Vigência</th><th>Horímetro inicial</th><th>Energia</th><th>Diesel</th><th>Horas</th><th>Economia</th></tr></thead><tbody>'+e.periods.map(p=>'<tr><td>'+fleetDate(p.dataInicio)+'</td><td>'+Number(p.start).toLocaleString('pt-BR')+' h</td><td>'+fleetMoney(p.tarifaEnergia)+'/kWh</td><td>'+fleetMoney(p.precoDiesel)+'/L</td><td>'+Number(p.hours).toLocaleString('pt-BR')+' h</td><td>'+fleetMoney(p.economiaPeriodo)+'</td></tr>').join('')+'</tbody></table></div><div class="fleet-readonly" style="margin-top:10px">Cada mudança de preço cria uma nova vigência. Os valores anteriores continuam no cálculo histórico.</div></div>';
}
function openFleetCostUpdate(id){
  if(!fleetCanEdit())return;
  const m=fleetPrototype.find(x=>Number(x.id)===Number(id));if(!m||m.tipoPropulsao!=='Elétrico')return;
  const current=fleetCurrentCost(m);
  document.getElementById('modalContent').innerHTML='<div class="section-head"><div><h3>Atualizar custos do cliente</h3><div class="muted">'+esc(m.codigo)+' • '+esc(m.modelo)+' • '+esc(m.cliente)+'</div></div><button class="btn btn-soft" onclick="openFleetMachine('+m.id+')">Voltar</button></div><div class="fleet-readonly">O valor anterior será preservado. O novo preço passa a valer apenas a partir da data e do horímetro abaixo.</div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Data de vigência</label><input id="fcData" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Horímetro nesta data</label><input id="fcHorimetro" type="number" min="0" step="0.1" value="'+Number(m.horimetro||0)+'"></div><div class="field"><label>Tarifa de energia (R$/kWh)</label><input id="fcEnergia" type="number" min="0" step="0.01" value="'+esc(current?.tarifaEnergia??m.tarifaEnergia??'')+'"></div><div class="field"><label>Preço do diesel (R$/L)</label><input id="fcDiesel" type="number" min="0" step="0.01" value="'+esc(current?.precoDiesel??m.precoDiesel??'')+'"></div><div class="span2"><button class="btn btn-primary" onclick="saveFleetCostUpdate('+m.id+')">Confirmar novos custos</button></div></div>'+fleetCostHistoryHtml(m);showModal();
}
function saveFleetCostUpdate(id){
  if(!fleetCanEdit())return;
  const m=fleetPrototype.find(x=>Number(x.id)===Number(id));if(!m||m.tipoPropulsao!=='Elétrico')return;
  const dataInicio=document.getElementById('fcData').value,horimetroInicio=Math.max(0,Number(document.getElementById('fcHorimetro').value)||0),tarifaEnergia=Number(document.getElementById('fcEnergia').value),precoDiesel=Number(document.getElementById('fcDiesel').value);
  if(!dataInicio||!(tarifaEnergia>0)||!(precoDiesel>0))return alert('Preencha data de vigência, tarifa de energia e preço do diesel.');
  if(horimetroInicio>Number(m.horimetro||0))return alert('O horímetro da vigência não pode ser maior que o horímetro atual.');
  if(!Array.isArray(m.historicoCustos)||!m.historicoCustos.length)m.historicoCustos=fleetCostHistory(m);
  const last=m.historicoCustos.slice().sort((a,b)=>Number(a.horimetroInicio)-Number(b.horimetroInicio)).pop();
  if(last&&horimetroInicio<Number(last.horimetroInicio||0))return alert('O novo horímetro precisa ser igual ou maior que o último período cadastrado.');
  m.historicoCustos.push({id:Date.now(),dataInicio,horimetroInicio,tarifaEnergia,precoDiesel,responsavel:currentPersonName||'Consultor de Treinamento'});
  m.tarifaEnergia=tarifaEnergia;m.precoDiesel=precoDiesel;fleetSavePrototype();openFleetMachineReport(m.id);
}

async function loadFleetShiftRecords(force=false){
  if(fleetShiftLoading) return;
  if(fleetShiftLoaded&&!force){
    renderFleetShiftPanel();
    return;
  }

  fleetShiftLoading=true;
  fleetShiftError='';
  renderFleetShiftPanel();

  try{
    if(!auth.currentUser) throw new Error('Sessão não encontrada.');
    const token=await auth.currentUser.getIdToken();
    const response=await fetch('/api/fleet-shifts',{
      headers:{'Authorization':'Bearer '+token}
    });

    let body={};
    try{body=await response.json()}catch(_){}
    if(!response.ok) throw new Error(body.error||'Não foi possível carregar os turnos.');

    fleetShiftRecords=Array.isArray(body.records)?body.records:[];
    fleetShiftLoaded=true;
  }catch(err){
    console.error('Falha ao sincronizar turnos:',err);
    fleetShiftError=err.message||'Falha ao carregar registros do app.';
  }finally{
    fleetShiftLoading=false;
    renderFleetShiftPanel();
  }
}

function fleetShiftMetrics(records){
  const rows=Array.isArray(records)?records:[];
  return {
    turns:rows.length,
    km:rows.reduce((s,r)=>s+Math.max(0,Number(r.distanceKm)||0),0),
    cycles:rows.reduce((s,r)=>s+Math.max(0,Number(r.loadedCycles)||0),0),
    avgSocUse:rows.length?rows.reduce((s,r)=>s+Math.max(0,Number(r.socVariation)||0),0)/rows.length:0
  };
}

function fleetShiftCard(r){
  return '<div class="fleet-event">'+
    '<div class="date">'+fleetDate(r.date)+' • '+esc(r.shift||'Turno')+' • '+esc(r.operator||'Operador não informado')+'</div>'+
    '<div class="event-title">'+esc(r.machineCode||'—')+' • dados enviados pelo app do cliente</div>'+
    '<div class="event-text">Km '+Number(r.kmStart||0).toLocaleString('pt-BR')+' → '+Number(r.kmEnd||0).toLocaleString('pt-BR')+
      ' • Distância '+Number(r.distanceKm||0).toLocaleString('pt-BR')+' km'+
      ' • SOC '+Number(r.socStart||0).toLocaleString('pt-BR')+'% → '+Number(r.socEnd||0).toLocaleString('pt-BR')+'%'+
      ' • Ciclos carregados '+Number(r.loadedCycles||0).toLocaleString('pt-BR')+'</div>'+
    (r.notes?'<div class="machine-sub" style="margin-top:5px">'+esc(r.notes)+'</div>':'')+
  '</div>';
}

function renderFleetShiftPanel(){
  const el=document.getElementById('fleetShiftSyncPanel');
  if(!el) return;

  if(fleetShiftLoading){
    el.innerHTML='<div class="muted">Sincronizando registros enviados pelo app do cliente...</div>';
    return;
  }

  if(fleetShiftError){
    el.innerHTML='<div class="fleet-readonly" style="border-color:#fecaca;background:#fef2f2;color:#991b1b">'+esc(fleetShiftError)+'</div><div class="actions" style="margin-top:10px"><button class="btn btn-soft" onclick="loadFleetShiftRecords(true)">Tentar novamente</button></div>';
    return;
  }

  const metrics=fleetShiftMetrics(fleetShiftRecords);
  const latest=fleetShiftRecords.slice(0,6);

  el.innerHTML=
    '<div class="fleet-report-grid">'+
      '<div class="fleet-report-card"><span class="muted">Turnos recebidos</span><b>'+metrics.turns+'</b></div>'+
      '<div class="fleet-report-card"><span class="muted">Km registrados</span><b>'+metrics.km.toLocaleString('pt-BR',{maximumFractionDigits:1})+' km</b></div>'+
      '<div class="fleet-report-card"><span class="muted">Ciclos carregados</span><b>'+metrics.cycles.toLocaleString('pt-BR')+'</b></div>'+
    '</div>'+
    '<div class="fleet-timeline" style="margin-top:12px">'+
      (latest.length?latest.map(fleetShiftCard).join(''):'<div class="muted">Nenhum turno foi enviado pelo app do cliente ainda.</div>')+
    '</div>';
}

function fleetMachineShiftRecords(machineCode){
  const code=String(machineCode||'').toUpperCase();
  return fleetShiftRecords.filter(r=>String(r.machineCode||'').toUpperCase()===code);
}

function fleetFiltered(){
  const q=normalizeAgentText(fleetFilters.busca);
  return fleetPrototype.filter(m=>{
    const matchesSearch=!q || normalizeAgentText([m.codigo,m.modelo,m.serie,m.cliente,m.local,m.consultor,m.necessidadeTreinamento].join(' ')).includes(q);
    const matchesStatus=fleetFilters.status==='Todos' || m.status===fleetFilters.status;
    const matchesClient=fleetFilters.cliente==='Todos' || m.cliente===fleetFilters.cliente;
    return matchesSearch && matchesStatus && matchesClient;
  });
}

      {label:'Diesel equivalente / h',data:view.dieselCostValues,backgroundColor:'#f59e0b',borderRadius:6,borderSkipped:false},
      {label:'Elétrico / h',data:view.electricCostValues,backgroundColor:'#06b6d4',borderRadius:6,borderSkipped:false}

  });

    data:{labels:view.clientLabels,datasets:[
      {label:'Normal',data:view.clientNormal,backgroundColor:'#16a34a',stack:'status',borderRadius:4},
      {label:'Atenção',data:view.clientAttention,backgroundColor:'#f59e0b',stack:'status',borderRadius:4},
      {label:'Crítico',data:view.clientCritical,backgroundColor:'#dc2626',stack:'status',borderRadius:4},

function openFleetDashboard(){
  header('Dashboard Geral • Frotas','Visão executiva dos testes, criticidade, utilização e economia operacional da frota.');

  const clients=[...new Set(fleetPrototype.map(x=>x.cliente).filter(Boolean))].sort();
  const types=['Mecânico','Híbrido','Elétrico'];
  const statuses=['Operação normal','Atenção','Crítico','Em visita'];

  const machines=fleetPrototype.filter(m=>{
    const byClient=fleetDashboardFilters.cliente==='Todos'||m.cliente===fleetDashboardFilters.cliente;
    const byType=fleetDashboardFilters.tipo==='Todos'||(m.tipoPropulsao||'Mecânico')===fleetDashboardFilters.tipo;
    const byStatus=fleetDashboardFilters.status==='Todos'||m.status===fleetDashboardFilters.status;
    return byClient&&byType&&byStatus;
  });

  const electric=machines.filter(m=>m.tipoPropulsao==='Elétrico');
  const battery=machines.filter(m=>fleetHasBattery(m));
  const economies=electric.map(m=>({m,e:fleetEconomy(m)})).filter(x=>x.e);
  const totalSaving=economies.reduce((sum,x)=>sum+x.e.economiaTotal,0);
  const dieselEquivalent=economies.reduce((sum,x)=>sum+x.e.hours*Math.max(0,Number(x.m.consumoDieselReferenciaLHora)||0),0);
  const critical=machines.filter(m=>m.status==='Crítico').length;
  const priority=machines.filter(m=>m.prioridadeTreinamento==='Alta'||m.prioridadeTreinamento==='Crítica').length;
  const totalTests=machines.reduce((sum,m)=>sum+(Array.isArray(m.historico)?m.historico.length:0),0);
  const avgSoc=battery.length?battery.reduce((sum,m)=>sum+Math.max(0,Math.min(100,Number(m.soc)||0)),0)/battery.length:0;

  const recent=[];
  machines.forEach(m=>(m.historico||[]).forEach(h=>recent.push({...h,machine:m})));
  recent.sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));

  const criticalMachines=machines.filter(m=>m.status==='Crítico');
  const lowSoc=battery.filter(m=>Number(m.soc||0)<=30);
  const topEconomy=economies.slice().sort((a,b)=>b.e.economiaTotal-a.e.economiaTotal)[0];
  const trainingPriority=machines.filter(m=>m.prioridadeTreinamento==='Crítica'||m.prioridadeTreinamento==='Alta').slice(0,3);

  const clientOptions='<option>Todos</option>'+clients.map(x=>'<option>'+esc(x)+'</option>').join('');
  const typeOptions='<option>Todos</option>'+types.map(x=>'<option>'+esc(x)+'</option>').join('');
  const statusOptions='<option>Todos</option>'+statuses.map(x=>'<option>'+esc(x)+'</option>').join('');

  const electricRows=electric.length?electric.map(m=>{
    const e=fleetEconomy(m),price=fleetCurrentCost(m),soc=Math.max(0,Math.min(100,Number(m.soc)||0));
    const socClass=soc<=20?'soc-low':soc<=50?'soc-mid':'soc-ok';
    return '<tr><td><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><div class="machine-sub">'+esc(m.cliente)+' • '+esc(m.local)+'</div></td><td>'+Number(m.horimetro||0).toLocaleString('pt-BR')+' h</td><td class="'+socClass+'">'+soc+'%</td><td>'+Number(m.consumoEletricoKwhHora||0).toLocaleString('pt-BR')+' kWh/h</td><td>'+fleetMoney(price?.tarifaEnergia||0)+'/kWh</td><td>'+Number(m.consumoDieselReferenciaLHora||0).toLocaleString('pt-BR')+' L/h</td><td>'+fleetMoney(price?.precoDiesel||0)+'/L</td><td class="money-positive">'+(e?fleetMoney(e.economiaHora)+'/h':'—')+'</td><td class="money-positive">'+(e?fleetMoney(e.economiaTotal):'—')+'</td><td><button class="btn btn-soft" onclick="openFleetMachineReport('+m.id+')">Abrir relatório</button></td></tr>';
  }).join(''):'<tr><td colspan="10" class="empty">Nenhuma máquina elétrica neste filtro.</td></tr>';

  const recentRows=recent.length?recent.slice(0,10).map(h=>'<tr><td>'+fleetDate(h.data)+'</td><td><b>'+esc(h.machine.codigo)+' • '+esc(h.machine.modelo)+'</b><div class="machine-sub">'+esc(h.machine.cliente)+'</div></td><td>'+esc(h.tipo||'Acompanhamento')+'</td><td>'+(h.horimetro!==undefined?Number(h.horimetro).toLocaleString('pt-BR')+' h':'—')+'</td><td>'+(h.soc!==undefined?Number(h.soc)+'%':'—')+'</td><td>'+esc(h.descricao||'')+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">Sem registros de acompanhamento.</td></tr>';

  const insights=[];
  criticalMachines.slice(0,2).forEach(m=>insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><span class="fleet-mini-badge red">CRÍTICO</span></div><small>'+esc(m.cliente)+' • '+esc(m.proximaAcao||'Sem próxima ação cadastrada')+'</small></div>'));
  lowSoc.slice(0,2).forEach(m=>insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><span class="fleet-mini-badge amber">SOC '+Number(m.soc||0)+'%</span></div><small>'+esc(m.cliente)+' • carga baixa registrada.</small></div>'));
  if(topEconomy) insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(topEconomy.m.codigo)+' • '+esc(topEconomy.m.modelo)+'</b><span class="fleet-mini-badge green">MAIOR ECONOMIA</span></div><small>'+esc(topEconomy.m.cliente)+' • '+fleetMoney(topEconomy.e.economiaTotal)+' acumulados.</small></div>');
  trainingPriority.slice(0,2).forEach(m=>insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><span class="fleet-mini-badge blue">TREINAMENTO</span></div><small>'+esc(m.necessidadeTreinamento||'Necessidade prioritária de treinamento')+'</small></div>'));

  destroyFleetDashboardCharts();

  document.getElementById('content').innerHTML=
    '<div class="fleet-dashboard-hero"><div class="fleet-dashboard-hero-top"><div><h3>Visão consolidada da frota</h3><p>Indicadores técnicos, criticidade, utilização e resultado financeiro dos testes em um único painel.</p></div><div class="fleet-dashboard-hero-actions"><button class="btn" onclick="renderFleet()">Voltar para frota</button><button class="btn" onclick="downloadFleetCsv()">Exportar CSV</button><button class="btn" onclick="openFleetReport()">Gerar relatório</button></div></div><div class="fleet-dashboard-filters"><div><label>Cliente</label><select id="fleetDashClient" onchange="setFleetDashboardFilter(\'cliente\',this.value)">'+clientOptions+'</select></div><div><label>Tipo</label><select id="fleetDashType" onchange="setFleetDashboardFilter(\'tipo\',this.value)">'+typeOptions+'</select></div><div><label>Status</label><select id="fleetDashStatus" onchange="setFleetDashboardFilter(\'status\',this.value)">'+statusOptions+'</select></div></div></div>'+
    '<div class="fleet-dashboard-kpis"><div class="fleet-dashboard-kpi info"><span class="kpi-label">Máquinas</span><b>'+machines.length+'</b><small>Equipamentos no filtro atual</small></div><div class="fleet-dashboard-kpi electric"><span class="kpi-label">Elétricas</span><b>'+electric.length+'</b><small>'+battery.length+' com bateria monitorada</small></div><div class="fleet-dashboard-kpi danger"><span class="kpi-label">Estado crítico</span><b>'+critical+'</b><small>'+priority+' com treinamento prioritário</small></div><div class="fleet-dashboard-kpi success"><span class="kpi-label">Economia estimada</span><b>'+fleetMoney(totalSaving)+'</b><small>Acumulado das máquinas elétricas</small></div><div class="fleet-dashboard-kpi warning"><span class="kpi-label">Diesel equivalente evitado</span><b>'+dieselEquivalent.toLocaleString('pt-BR',{maximumFractionDigits:0})+' L</b><small>Referência calculada nos testes</small></div><div class="fleet-dashboard-kpi"><span class="kpi-label">SOC médio</span><b>'+(battery.length?avgSoc.toFixed(0)+'%':'—')+'</b><small>'+totalTests+' registros de acompanhamento</small></div></div>'+
    '<div class="fleet-dashboard-main"><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Estado da frota</h3><div class="chart-sub">Distribuição rápida por situação operacional</div></div></div><div class="fleet-chart-canvas compact"><canvas id="fleetStatusChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Tipo de propulsão</h3><div class="chart-sub">Composição da frota acompanhada</div></div></div><div class="fleet-chart-canvas compact"><canvas id="fleetPropulsionChart"></canvas></div></div><div class="fleet-insight-panel"><div class="fleet-insight-title"><h3>Atenção imediata</h3><span class="fleet-mini-badge red">'+critical+' crítico(s)</span></div><div class="fleet-insight-list">'+(insights.length?insights.slice(0,6).join(''):'<div class="muted">Nenhum alerta relevante neste filtro.</div>')+'</div></div></div>'+
    '<div class="fleet-dashboard-grid"><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Economia acumulada por máquina</h3><div class="chart-sub">Resultado estimado da operação elétrica em relação ao diesel</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetEconomyChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Custo energético por hora</h3><div class="chart-sub">Diesel equivalente x operação elétrica</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetCostChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>SOC das máquinas com bateria</h3><div class="chart-sub">Verde acima de 50%, amarelo até 50%, vermelho até 20%</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetSocChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Criticidade por cliente</h3><div class="chart-sub">Distribuição dos estados para priorização de atendimento</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetClientStatusChart"></canvas></div></div></div>'+
    '<div class="fleet-dashboard-section fleet-dashboard-table"><div class="section-head"><div><h3>Parâmetros dos testes • máquinas elétricas</h3><div class="muted">Dados atuais usados no cálculo de economia. Os preços históricos permanecem preservados por vigência.</div></div></div><div class="table-wrap"><table><thead><tr><th>Máquina</th><th>Horímetro</th><th>SOC</th><th>Consumo elétrico</th><th>Energia</th><th>Diesel ref.</th><th>Preço diesel</th><th>Economia/h</th><th>Economia acumulada</th><th>Ação</th></tr></thead><tbody>'+electricRows+'</tbody></table></div></div>'+
    '<div class="fleet-dashboard-section"><div class="section-head"><div><h3>Últimos testes e acompanhamentos</h3><div class="muted">Atividades mais recentes da frota filtrada.</div></div><span class="fleet-mini-badge blue">'+recent.length+' registro(s)</span></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Máquina</th><th>Tipo</th><th>Horímetro</th><th>SOC</th><th>Registro</th></tr></thead><tbody>'+recentRows+'</tbody></table></div></div>';

  const clientSelect=document.getElementById('fleetDashClient');
  const typeSelect=document.getElementById('fleetDashType');
  const statusSelect=document.getElementById('fleetDashStatus');
  if(clientSelect) clientSelect.value=fleetDashboardFilters.cliente;
  if(typeSelect) typeSelect.value=fleetDashboardFilters.tipo;
  if(statusSelect) statusSelect.value=fleetDashboardFilters.status;

  const sortedEconomy=economies.slice().sort((a,b)=>b.e.economiaTotal-a.e.economiaTotal);
  const clientList=[...new Set(machines.map(m=>m.cliente).filter(Boolean))].sort();

  renderFleetDashboardCharts({
    statusLabels:statuses,
    statusValues:statuses.map(label=>machines.filter(m=>m.status===label).length),
    propulsionLabels:types,
    propulsionValues:types.map(label=>machines.filter(m=>(m.tipoPropulsao||'Mecânico')===label).length),
    economyLabels:sortedEconomy.map(x=>x.m.codigo+' • '+x.m.modelo),
    economyValues:sortedEconomy.map(x=>Math.max(0,x.e.economiaTotal)),
    costLabels:economies.map(x=>x.m.codigo+' • '+x.m.modelo),
    dieselCostValues:economies.map(x=>x.e.custoDieselHora),
    electricCostValues:economies.map(x=>x.e.custoEletricoHora),
    socLabels:battery.map(m=>m.codigo+' • '+m.modelo),
    socValues:battery.map(m=>Math.max(0,Math.min(100,Number(m.soc)||0))),
    clientLabels:clientList,
    clientNormal:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Operação normal').length),
    clientAttention:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Atenção').length),
    clientCritical:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Crítico').length),
    clientVisit:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Em visita').length)
  });
}

  '<div style="margin-top:20px"><h3>Registros enviados pelo app do cliente</h3><div class="fleet-timeline">'+

  ).join('');
  const w=window.open('','_blank');
  if(!w) return alert('O navegador bloqueou a janela de impressão.');
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Relatório de Frotas</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#111}h1{font-size:22px}p{color:#555}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}th{background:#f3f4f6}</style></head><body><h1>Relatório de Acompanhamento de Frotas</h1><p>Gerado em '+new Date().toLocaleString('pt-BR')+' • EAD Irmen</p><table><thead><tr><th>Código</th><th>Modelo</th><th>Cliente</th><th>Local</th><th>Status</th><th>Necessidade de treinamento</th><th>Próxima ação</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>');
  w.document.close();
  w.focus();
  setTimeout(()=>w.print(),250);
}

function downloadFleetCsv(){
  const header=['Código','Modelo','Número de série','Cliente','Local','Horímetro','SOC (%)','Status','Consultor','Última atualização','Necessidade de treinamento','Prioridade','Próxima ação','Observações'];
  const rows=fleetPrototype.map(m=>[
    m.codigo,m.modelo,m.serie,m.cliente,m.local,m.horimetro,m.soc,m.status,m.consultor,m.ultimaAtualizacao,m.necessidadeTreinamento,m.prioridadeTreinamento,m.proximaAcao,m.observacoes
  ]);
  const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\uFEFF'+[header,...rows].map(row=>row.map(quote).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='acompanhamento-frotas-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderUsers(success=''){

  const rows=teamUsers.length
    ? teamUsers.map(u=>{
        const isSelf=currentUserProfile && currentUserProfile.uid===u.uid;
        const active=u.ativo!==false;
        return '<tr>'+
          '<td><div class="person"><div class="avatar">'+esc((u.nome||u.email||'?')[0])+'</div><div><b>'+esc(u.nome||'Sem nome')+'</b><div class="muted">'+esc(u.email||'')+'</div></div></div></td>'+
          '<td>'+esc(userRoleLabel(u))+'</td>'+
          '<td><span class="status '+(active?'s-done':'s-rev')+'">'+(active?'Ativo':'Desativado')+'</span></td>'+
          '<td><div class="actions">'+
            '<button class="btn btn-soft" onclick="openEditUser(\''+u.uid+'\')">Editar</button>'+
            (isSelf
              ? '<span class="muted" style="align-self:center">Usuário atual</span>'
              : '<button class="btn btn-soft" onclick="toggleUserActive(\''+u.uid+'\')">'+(active?'Desativar':'Ativar')+'</button>')+
          '</div></td>'+
        '</tr>';
      }).join('')
    : '<tr><td colspan="4" class="empty">Nenhum usuário cadastrado.</td></tr>';

  document.getElementById('content').innerHTML=
    '<div class="section">'+
      '<div class="section-head"><div><h3>Criar novo login</h3><div class="muted">O usuário poderá entrar no EAD Irmen usando este e-mail e senha.</div></div></div>'+
      '<form class="form-grid" onsubmit="createUserLogin(event)">'+
        '<div class="field"><label>Nome completo</label><input id="newUserName" placeholder="Nome do colaborador" required></div>'+
        '<div class="field"><label>Perfil</label><select id="newUserRole"><option value="instructor">Instrutor</option><option value="consultant">Consultor de Treinamento</option><option value="admin">ADM</option></select></div>'+
        '<div class="field"><label>E-mail</label><input id="newUserEmail" type="email" placeholder="nome@irmen..." required></div>'+
        '<div class="field"><label>Senha inicial</label><input id="newUserPassword" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required></div>'+
        '<div class="span2"><button id="createUserButton" class="btn btn-primary" type="submit">Criar login</button><div id="userCreateMessage" class="muted" style="margin-top:10px;'+(success?'color:#15803d;font-weight:700':'')+'">'+esc(success)+'</div></div>'+
      '</form>'+
    '</div>'+
    '<div class="section"><div class="section-head"><div><h3>Usuários cadastrados</h3><div class="muted">As alterações de e-mail, senha e ativação também são aplicadas ao Firebase Authentication.</div></div></div><div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderTeam(){
  header('Equipe','Acompanhe os integrantes, cargos e a distribuição das metas.');
  const knownNames=new Set(teamUsers.map(u=>u.nome).filter(Boolean));
  const localOnly=data.people.filter(name=>!knownNames.has(name)).map(name=>({nome:name,cargo:'Instrutor',perfil:'instructor',ativo:true}));
  const members=[...teamUsers,...localOnly];
  document.getElementById('content').innerHTML='<div class="section"><div class="section-head"><h3>Equipe EAD</h3></div><div class="grid">'+members.map(p=>{let name=p.nome||p.email||'Usuário';let total=data.skills.filter(s=>s.owner===name).length;let weekly=data.plans.filter(x=>x.person===name).length;return '<div class="card"><div class="person"><div class="avatar">'+esc(name[0]||'?')+'</div><div><b>'+esc(name)+'</b><div class="muted">'+esc(p.cargo||'Instrutor')+'</div></div></div><div style="margin-top:14px" class="muted">'+total+' habilidade(s) atribuída(s) • '+weekly+' entrega(s) na semana</div></div>'}).join('')+'</div></div>'
}
