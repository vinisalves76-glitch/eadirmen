function cacheLocal(){
  localStorage.setItem(instructorSimulationMode?INSTRUCTOR_SIM_KEY:'ead-irmen-data',JSON.stringify(data));
}

async function save(){
  cacheLocal();
  if(instructorSimulationMode){
    cloudMessage='Sistema atualizado';
    updateCloudBadge();
    return;
  }
  if(!cloudReady) return;
  try{
    await db.collection('sistema').doc('sharedData').set({
      skills:data.skills,
      plans:data.plans,
      people:data.people,
      atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
    cloudMessage='Sistema atualizado';
    updateCloudBadge();
  }catch(err){
    console.error('Erro ao salvar no Firebase:',err);
    cloudMessage='Sincronização indisponível';
    updateCloudBadge();
  }
}

async function initCloud(){
  try{
    const ref=db.collection('sistema').doc('sharedData');
    const snap=await ref.get();
    if(snap.exists){
      const remote=snap.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people,
        trainingDemands:Array.isArray(remote.trainingDemands)?remote.trainingDemands:[]
      };
      cacheLocal();
    }else{
      await ref.set({
        skills:defaults.skills,
        plans:defaults.plans,
        people:defaults.people,
        trainingDemands:defaults.trainingDemands,
        criadoEm:firebase.firestore.FieldValue.serverTimestamp(),
        atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
      });
      data=JSON.parse(JSON.stringify(defaults));
      cacheLocal();
    }
    cloudReady=true;
    cloudMessage='Sistema atualizado';
    updateCloudBadge();

    if(cloudUnsubscribe) cloudUnsubscribe();
    cloudUnsubscribe=ref.onSnapshot(doc=>{
      if(!doc.exists) return;
      if(instructorSimulationMode) return;
      const remote=doc.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people,
        trainingDemands:Array.isArray(remote.trainingDemands)?remote.trainingDemands:[]
      };
      cacheLocal();
      if(role) go(currentPage);
    },err=>{
      console.error('Falha na sincronização em tempo real:',err);
      cloudMessage='Modo offline';
      updateCloudBadge();
    });
  }catch(err){
    console.warn('Firestore ainda não disponível; usando armazenamento local.',err);
    cloudReady=false;
    cloudMessage='Modo offline';
    updateCloudBadge();
  }
}

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function friendlyAuthError(err){
  const code=err && err.code ? err.code : '';
  if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')) return 'E-mail ou senha inválidos.';
  if(code.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if(code.includes('network-request-failed')) return 'Falha de conexão. Verifique a internet.';
  if(code.includes('operation-not-allowed')) return 'O login por e-mail e senha ainda não está ativado no Firebase.';
  if(code.includes('user-disabled')) return 'Este usuário está desativado no Firebase.';
  return 'Não foi possível entrar. Confira o e-mail e a senha.';
}

async function loginWithEmail(event){
  event.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;

  // Lembra apenas o e-mail no navegador.
  // A senha fica a cargo do gerenciador seguro de senhas do próprio navegador.
  if(email) localStorage.setItem('ead-irmen-last-email',email);
  const btn=document.getElementById('loginButton');
  const error=document.getElementById('loginError');

  error.textContent='';
  btn.disabled=true;
  btn.textContent='Entrando...';

  try{
    loginAutorizadoNestaPagina=true;
    await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
    const credential=await auth.signInWithEmailAndPassword(email,password);

    // Não dependemos apenas do onAuthStateChanged.
    // Isso evita ficar preso em "Entrando..." quando já existe uma sessão salva.
    await openAuthenticatedApp(credential.user);
  }catch(err){
    loginAutorizadoNestaPagina=false;
    console.error('Falha no login:',err);
    const message=err && err.message ? err.message : '';
    error.textContent=message.startsWith('EAD:') ? message.replace(/^EAD:\s*/,'') : friendlyAuthError(err);
    btn.disabled=false;
    btn.textContent='Entrar';
  }
}

async function ensureUserProfile(user){
  const ref=db.collection('usuarios').doc(user.uid);
  const email=(user.email||'').trim().toLowerCase();
  const isZion=email==='zion.almeida@irmen.com.br';

  const perfilZion={
    nome:'Zion Almeida',
    email:user.email||'',
    perfil:'admin',
    cargo:'ADM',
    ativo:true
  };

  try{
    const snap=await ref.get();

    if(snap.exists){
      return {uid:user.uid,...snap.data()};
    }

    if(isZion){
      try{
        await ref.set({
          ...perfilZion,
          criadoEm:firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});
      }catch(writeErr){
        console.warn('Perfil ADM autenticado; Firestore ainda sem permissão de escrita.',writeErr);
      }
      return {uid:user.uid,...perfilZion};
    }

    return null;
  }catch(err){
    console.warn('Não foi possível ler o perfil no Firestore.',err);
    if(isZion){
      return {uid:user.uid,...perfilZion};
    }
    throw err;
  }
}

async function loadTeamUsers(){
  try{
    const snap=await db.collection('usuarios').get();
    teamUsers=snap.docs.map(d=>({uid:d.id,...d.data()}));
    const names=teamUsers.map(u=>u.nome).filter(Boolean);
    names.forEach(name=>{ if(!data.people.includes(name)) data.people.push(name); });
  }catch(err){
    console.warn('Não foi possível carregar usuários da equipe',err);
    teamUsers=[];
  }
}

async function openAuthenticatedApp(user){
  if(!user) return;
  if(appReadyUid===user.uid && !document.getElementById('app').classList.contains('hidden')) return;
  if(openingUserUid===user.uid) return;

  openingUserUid=user.uid;
  const loginError=document.getElementById('loginError');
  const btn=document.getElementById('loginButton');

  try{
    const profile=await ensureUserProfile(user);

    if(!profile){
      throw new Error('EAD: Login autenticado, mas o perfil ainda não foi cadastrado no EAD Irmen.');
    }

    if(profile.ativo===false){
      throw new Error('EAD: Este login está desativado. Procure um administrador.');
    }

    if(!['admin','consultant','instructor'].includes(profile.perfil)){
      throw new Error('EAD: O perfil deste usuário está inválido no Firestore.');
    }

    currentUserProfile=profile;
    role=profile.perfil;
    currentPersonName=profile.nome||user.email||'Usuário';

    document.getElementById('profileName').textContent=currentPersonName;
    document.getElementById('profileRole').textContent='Perfil: '+(profile.cargo || (role==='admin'?'ADM':role==='consultant'?'Consultor de Treinamento':'Instrutor'));

    // Abre a interface primeiro. Sincronizações secundárias não podem travar o login.
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    buildNav();
    go(role==='consultant'?'fleet':'dashboard');
    appReadyUid=user.uid;

    // Carregamentos complementares executam depois que a interface já abriu.
    await loadTeamUsers();
    await initCloud();
    go(currentPage);
  }catch(err){
    appReadyUid=null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
    loginError.textContent=(err && err.message ? err.message.replace(/^EAD:\s*/,'') : 'Falha ao carregar o perfil do usuário.');
    throw err;
  }finally{
    openingUserUid=null;
    if(btn){
      btn.disabled=false;
      btn.textContent='Entrar';
    }
  }
}

auth.onAuthStateChanged(async user=>{
  if(user){
    // Pode existir uma sessão antiga armazenada por versões anteriores.
    // Não fazemos signOut automático aqui porque isso pode correr em paralelo
    // com um novo clique em "Entrar" e derrubar a sessão recém-autenticada.
    // A interface continua bloqueada até o usuário autenticar manualmente nesta página.
    if(!loginAutorizadoNestaPagina){
      appReadyUid=null;
      openingUserUid=null;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login').classList.remove('hidden');

      const email=document.getElementById('loginEmail');
      if(email && !email.value){
        email.value=localStorage.getItem('ead-irmen-last-email')||user.email||'';
      }

      const btn=document.getElementById('loginButton');
      if(btn){btn.disabled=false;btn.textContent='Entrar';}
      return;
    }

    try{
      await openAuthenticatedApp(user);
    }catch(err){
      console.error('Falha ao abrir sessão autenticada:',err);
      loginAutorizadoNestaPagina=false;
      appReadyUid=null;
      openingUserUid=null;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login').classList.remove('hidden');

      const btn=document.getElementById('loginButton');
      if(btn){btn.disabled=false;btn.textContent='Entrar';}
    }
  }else{
    role='';
    instructorSimulationMode=false;
    instructorSimulationRealData=null;
    currentUserProfile=null;
    currentPersonName='';
    appReadyUid=null;
    openingUserUid=null;
    if(cloudUnsubscribe){cloudUnsubscribe();cloudUnsubscribe=null;}
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');

    // Mantém o e-mail lembrado e permite que o navegador preencha a senha,
    // mas nunca entra sozinho: o usuário precisa clicar em "Entrar".
    const email=document.getElementById('loginEmail');
    if(email && !email.value){
      email.value=localStorage.getItem('ead-irmen-last-email')||'';
    }

    const btn=document.getElementById('loginButton');
    if(btn){btn.disabled=false;btn.textContent='Entrar';}
  }
})

function normalizePersonName(value){
  return String(value||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9 ]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function resolveInstructorDataName(name=currentPersonName){
  const target=normalizePersonName(name);
  if(!target) return name||'';

  const candidates=[...new Set([
    ...(Array.isArray(data.people)?data.people:[]),
    ...(Array.isArray(data.skills)?data.skills.map(s=>s.owner):[]),
    ...(Array.isArray(data.plans)?data.plans.map(p=>p.person):[])
  ].filter(Boolean))];

  const exact=candidates.find(candidate=>normalizePersonName(candidate)===target);
  if(exact) return exact;

  const targetFirst=target.split(' ')[0];
  const sameFirst=candidates.filter(candidate=>{
    const n=normalizePersonName(candidate);
    return n && n.split(' ')[0]===targetFirst;
  });

  if(sameFirst.length===1) return sameFirst[0];

  const contained=candidates.filter(candidate=>{
    const n=normalizePersonName(candidate);
    return n && (target.includes(n)||n.includes(target));
  });

  if(contained.length===1) return contained[0];

  return name||'';
}

function fleetPriorityScore(m){
  const statusScore=m.status==='Crítico'?100:m.status==='Atenção'?70:m.status==='Em visita'?45:10;
  const trainingScore=fleetIsTrainingNeed(m)?(m.prioridadeTreinamento==='Crítica'?45:m.prioridadeTreinamento==='Alta'?30:m.prioridadeTreinamento==='Média'?15:0):0;
  let ageScore=0;
  const parsed=Date.parse(String(m.ultimaAtualizacao||'')+'T00:00:00');
  if(Number.isFinite(parsed)){
    const days=Math.max(0,Math.floor((Date.now()-parsed)/86400000));
    ageScore=Math.min(25,days);
  }
  return statusScore+trainingScore+ageScore;
}

function fleetPriorityReason(m){
  if(m.status==='Crítico') return 'Equipamento em estado crítico';
  if(fleetIsTrainingNeed(m)&&m.prioridadeTreinamento==='Crítica') return 'Treinamento classificado como crítico';
  if(m.status==='Atenção') return 'Equipamento requer atenção';
  if(fleetIsTrainingNeed(m)&&m.prioridadeTreinamento==='Alta') return 'Treinamento classificado com prioridade alta';
  if(m.status==='Em visita') return 'Acompanhamento em andamento';
  if((m.classificacaoNecessidade||'A definir')!=='A definir') return 'Necessidade classificada como '+m.classificacaoNecessidade;
  return 'Classificação da necessidade pendente';
}

function fleetPriorityClassName(m){
  if(m.status==='Crítico'||m.prioridadeTreinamento==='Crítica') return 'danger';
  if(m.status==='Atenção'||m.prioridadeTreinamento==='Alta') return 'warning';
  return 'info';
}

function fleetPriorityItems(){
  return fleetPrototype.slice().sort((a,b)=>fleetPriorityScore(b)-fleetPriorityScore(a));
}

function fleetDaysSinceUpdate(m){
  const parsed=Date.parse(String(m?.ultimaAtualizacao||'')+'T00:00:00');
  if(!Number.isFinite(parsed)) return null;
  return Math.max(0,Math.floor((Date.now()-parsed)/86400000));
}

function fleetPriorityLevel(m){
  if(m.status==='Crítico'||(fleetIsTrainingNeed(m)&&m.prioridadeTreinamento==='Crítica')) return 'Crítica';
  if(m.status==='Atenção'||(fleetIsTrainingNeed(m)&&m.prioridadeTreinamento==='Alta')) return 'Alta';
  if(m.status==='Em visita'||(fleetIsTrainingNeed(m)&&m.prioridadeTreinamento==='Média')) return 'Média';
  return 'Rotina';
}

function fleetPriorityType(m){
  if(m.status==='Crítico'||(fleetIsTrainingNeed(m)&&m.prioridadeTreinamento==='Crítica')) return 'Críticas';
  if(fleetIsTrainingNeed(m)&&(m.prioridadeTreinamento==='Alta'||m.prioridadeTreinamento==='Crítica')) return 'Treinamento';
  return 'Acompanhamento';
}

function fleetActionQueue(){

function ensureSkillWorkflow(s){
  if(!s) return s;
  if(!Array.isArray(s.materials)) s.materials=[];
  if(!Array.isArray(s.productionOutputs)) s.productionOutputs=[];
  if(typeof s.noMaterials!=='boolean') s.noMaterials=s.materials.length===0;

  if(!s.workflow||typeof s.workflow!=='object'){
    const oldStatus=s.status||'Planejamento';
    s.workflow={
      production:oldStatus==='Concluída'||oldStatus==='Em revisão'?'Finalizado':oldStatus==='Em produção'?'Em produção':'Não iniciado',
      review:oldStatus==='Concluída'?'Aprovado':oldStatus==='Em revisão'?'Em revisão':'Não iniciado',
      finalization:oldStatus==='Concluída'?'Finalizado':'Não iniciado'
    };
  }

  if(!['Não iniciado','Em produção','Finalizado'].includes(s.workflow.production)) s.workflow.production='Não iniciado';
  if(!['Não iniciado','Em revisão','Aprovado'].includes(s.workflow.review)) s.workflow.review='Não iniciado';
  if(!['Não iniciado','Em finalização','Finalizado'].includes(s.workflow.finalization)) s.workflow.finalization='Não iniciado';
  return s;
}

function skillWorkflowMetrics(s){
  ensureSkillWorkflow(s);

  const objectiveOk=String(s.objective||'').trim().length>0;
  const developmentOk=String(s.development||'').trim().length>0;
  const durationOk=String(s.duration||'').trim().length>0;
  const planningScore=[objectiveOk,developmentOk,durationOk].filter(Boolean).length/3;
  const planningDone=objectiveOk&&developmentOk&&durationOk;

  let materialScore=0;
  let materialsDone=false;
  if(s.noMaterials){
    materialScore=1;
    materialsDone=true;
  }else if(s.materials.length){
    materialScore=s.materials.reduce((sum,m)=>sum+(m.status==='Finalizado'?1:m.status==='Em produção'?0.5:0),0)/s.materials.length;
    materialsDone=s.materials.every(m=>m.status==='Finalizado');
  }

  const productionScore=s.workflow.production==='Finalizado'?1:s.workflow.production==='Em produção'?0.5:0;
  const productionDone=s.workflow.production==='Finalizado';
  const reviewScore=s.workflow.review==='Aprovado'?1:s.workflow.review==='Em revisão'?0.5:0;
  const reviewDone=s.workflow.review==='Aprovado';
  const finalScore=s.workflow.finalization==='Finalizado'?1:s.workflow.finalization==='Em finalização'?0.5:0;
  const finalDone=s.workflow.finalization==='Finalizado';

  const progress=Math.round((planningScore+materialScore+productionScore+reviewScore+finalScore)*20);
  let status='Planejamento';
  if(finalDone) status='Concluída';
  else if(productionDone||s.workflow.review!=='Não iniciado'||s.workflow.finalization!=='Não iniciado') status='Em revisão';
  else if(planningDone||s.materials.length||s.noMaterials||s.workflow.production==='Em produção') status='Em produção';

  const done=[planningDone,materialsDone,productionDone,reviewDone,finalDone];
  const labels=['Planejamento','Materiais','Produção','Revisão','Finalização'];
  const currentIndex=done.findIndex(v=>!v);

  return {progress,status,planningDone,materialsDone,productionDone,reviewDone,finalDone,done,labels,currentIndex:currentIndex<0?5:currentIndex};
}

async function fileToBase64Chunk(blob){
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
    reader.onerror=()=>reject(reader.error||new Error('Falha ao ler arquivo.'));
    reader.readAsDataURL(blob);
  });
}

async function apiProductionFile(body){
  if(!auth.currentUser) throw new Error('auth-required');
  const token=await auth.currentUser.getIdToken(true);
  const response=await fetch('/api/production-files',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+token
    },
    body:JSON.stringify(body)
  });

  let result={};
  try{ result=await response.json(); }catch(_){}
  if(!response.ok) throw new Error(result.error||'Falha ao processar arquivo.');
  return result;
}

async function uploadProductionResult(skillId){
  const skill=data.skills.find(x=>Number(x.id)===Number(skillId));
  if(!skill) return;
  ensureSkillWorkflow(skill);

  const input=document.getElementById('mOutputFile');
  const file=input?.files?.[0];
  const outputType=document.getElementById('mOutputType')?.value||'Outro arquivo';

  if(!file){
    productionUploadMessage('Selecione um arquivo antes de anexar.','error');
    return;
  }
  if(file.size>25*1024*1024){
    productionUploadMessage('O arquivo deve ter no máximo 25 MB.','error');
    return;
  }

  applyWorkflowFormToSkill(skill);
  if(!skillWorkflowMetrics(skill).planningDone){
    productionUploadMessage('Preencha objetivo, desenvolvimento e duração antes de anexar o resultado.','error');
    return;
  }

  const button=document.getElementById('mUploadOutputBtn');
  if(button){button.disabled=true;button.textContent='Enviando...';}
  productionUploadMessage('Preparando arquivo...');

  try{
    const chunkSize=1.5*1024*1024;
    const chunkCount=Math.ceil(file.size/chunkSize);
    const uploadId='upl_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);

    for(let i=0;i<chunkCount;i++){
      const startByte=i*chunkSize;
      const endByte=Math.min(file.size,startByte+chunkSize);
      const blob=file.slice(startByte,endByte);
      const dataBase64=await fileToBase64Chunk(blob);

      await apiProductionFile({
        action:'chunk',
        uploadId,
        skillId:String(skill.id),
        chunkIndex:i,
        chunkCount,
        dataBase64
      });

      const pct=Math.round(((i+1)/chunkCount)*90);
      productionUploadMessage('Enviando resultado... '+pct+'%');
    }

    productionUploadMessage('Finalizando arquivo... 95%');

    const safeName=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
    const done=await apiProductionFile({
      action:'complete',
      uploadId,
      skillId:String(skill.id),
      chunkCount,
      fileName:safeName,
      originalName:file.name,
      contentType:file.type||'application/octet-stream'
    });

    const output={
      id:Date.now(),
      type:outputType,
      name:file.name,
      url:done.url,
      storagePath:done.storagePath,
      size:file.size,
      contentType:file.type||'',
      uploadedAt:new Date().toISOString(),
      uploadedBy:currentPersonName||''
    };

    skill.productionOutputs.push(output);
    skill.legacyProductionComplete=false;
    syncProductionOutputWithMaterials(skill,outputType,done.url);
    skill.workflow.production='Finalizado';

    const metrics=skillWorkflowMetrics(skill);
    skill.status=metrics.status;
    skill.progress=metrics.progress;
    await save();

    renderProductionOutputs(skill);
    const production=document.getElementById('mProductionStep');
    if(production) production.value='Finalizado';
    if(input) input.value='';
    productionUploadMessage('Resultado anexado com sucesso. Produção finalizada.','ok');
    refreshWorkflowPreview();
  }catch(err){
    console.error('Falha ao anexar resultado:',err);
    let message=err&&err.message?err.message:'Não foi possível anexar o resultado.';
    if(String(message).includes('auth-required')) message='Sua sessão expirou. Entre novamente no sistema.';
    productionUploadMessage(message,'error');
  }finally{
    if(button){button.disabled=false;button.textContent='Anexar resultado';}
  }
}

async function removeProductionResult(skillId,outputId){
  const skill=data.skills.find(x=>Number(x.id)===Number(skillId));
  if(!skill||!Array.isArray(skill.productionOutputs)) return;
  const output=skill.productionOutputs.find(o=>Number(o.id)===Number(outputId));
  if(!output||!confirm('Remover este resultado da produção?')) return;

  if(output.storagePath){
    try{
      await apiProductionFile({
        action:'delete',
        skillId:String(skill.id),
        storagePath:output.storagePath
      });
    }catch(err){
      console.warn('Arquivo físico não removido:',err);
    }
  }

  skill.productionOutputs=skill.productionOutputs.filter(o=>Number(o.id)!==Number(outputId));
  if(!skill.productionOutputs.length&&skill.legacyProductionComplete!==true){
    skill.workflow.production='Em produção';
    skill.workflow.review='Não iniciado';
    skill.workflow.finalization='Não iniciado';
  }

  const metrics=skillWorkflowMetrics(skill);
  skill.status=metrics.status;
  skill.progress=metrics.progress;
  await save();

  renderProductionOutputs(skill);
  const production=document.getElementById('mProductionStep');
  if(production) production.value=skill.workflow.production;
  productionUploadMessage(skill.productionOutputs.length?'Resultado removido.':'Resultado removido. A Produção voltou para Em produção.');
  refreshWorkflowPreview();
}

function refreshWorkflowPreview(){
  const draft=draftSkillFromForm();
  const m=skillWorkflowMetrics(draft);

  const progress=document.getElementById('mAutoProgress');
  const progressBar=document.getElementById('mAutoProgressBar');
  const status=document.getElementById('mAutoStatus');
  const current=document.getElementById('mCurrentStep');
  if(progress) progress.textContent=m.progress+'%';
  if(progressBar) progressBar.style.width=m.progress+'%';
  if(status) status.textContent=m.status;
  if(current) current.textContent=m.currentIndex>=5?'Concluída':m.labels[m.currentIndex];

  document.querySelectorAll('[data-workflow-step]').forEach((el,index)=>{
    el.classList.remove('done','current','locked');
    el.classList.add(m.done[index]?'done':m.currentIndex===index?'current':'locked');
    const span=el.querySelector('span');
    if(span) span.textContent=m.done[index]?'Concluído':m.currentIndex===index?'Etapa atual':'Aguardando';
  });

  const production=document.getElementById('mProductionStep');
  const review=document.getElementById('mReviewStep');
  const finalStep=document.getElementById('mFinalStep');
  if(production) production.disabled=!(m.planningDone&&m.materialsDone);
  if(review) review.disabled=!(m.productionDone&&m.materialsDone);
  if(finalStep) finalStep.disabled=!m.reviewDone;

  if(!(m.planningDone&&m.materialsDone)&&production&&production.value!=='Não iniciado') production.value='Não iniciado';
  if(!(m.productionDone&&m.materialsDone)&&review&&review.value!=='Não iniciado') review.value='Não iniciado';
  if(!m.reviewDone&&finalStep&&finalStep.value!=='Não iniciado') finalStep.value='Não iniciado';

  syncWorkflowPanels(m);
}

async function saveSkill(id){
  let s=data.skills.find(x=>x.id===id);
  if(!s)return;

  if(role!=='admin'&&s.owner!==currentInstructorDataName()){
    alert('Você só pode atualizar habilidades atribuídas a você.');
    return;
  }

  ensureSkillWorkflow(s);
  s.objective=document.getElementById('mObjective').value.trim();
  s.development=document.getElementById('mDevelopment').value.trim();
  s.duration=document.getElementById('mDuration').value.trim();
  s.materials=readSkillMaterialsFromForm();
  s.noMaterials=!!document.getElementById('mNoMaterials').checked;
  s.workflow.production=document.getElementById('mProductionStep').value;
  s.workflow.review=document.getElementById('mReviewStep').value;
  s.workflow.finalization=document.getElementById('mFinalStep').value;

  let metrics=skillWorkflowMetrics(s);

  if(!(metrics.planningDone&&metrics.materialsDone)){
    s.workflow.production='Não iniciado';
    s.workflow.review='Não iniciado';
    s.workflow.finalization='Não iniciado';
  }else if(!metrics.productionDone){
    s.workflow.review='Não iniciado';
    s.workflow.finalization='Não iniciado';
  }else if(!metrics.reviewDone){
    s.workflow.finalization='Não iniciado';
  }

  metrics=skillWorkflowMetrics(s);
  s.status=metrics.status;
  s.progress=metrics.progress;

  if(role==='admin'&&document.getElementById('mOwner')) s.owner=document.getElementById('mOwner').value;

  const saveButton=document.querySelector('#modalContent .btn.btn-primary');
  if(saveButton){
    saveButton.disabled=true;
    saveButton.textContent='Salvando...';
  }

  try{
    if(role==='admin'){
      await save();
    }else{
      const user=auth.currentUser;
      if(!user) throw new Error('Sua sessão expirou. Entre novamente.');
      const token=await user.getIdToken(true);

      const response=await fetch('/api/instructor-skill',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+token
        },
        body:JSON.stringify({
          skillId:s.id,
          objective:s.objective,
          development:s.development,
          duration:s.duration,
          materials:s.materials,
          noMaterials:s.noMaterials,
          workflow:s.workflow
        })
      });

      let body={};
      try{body=await response.json();}catch(_){}
      if(!response.ok) throw new Error(body.error||'Não foi possível salvar.');

      if(body.skill){
        Object.assign(s,body.skill);
      }

      cacheLocal();
      cloudMessage='Sistema atualizado';
      updateCloudBadge();
    }

    closeModal();
    renderSkills();
  }catch(err){
    console.error('Erro ao salvar habilidade:',err);
    alert(err.message||'Não foi possível salvar as alterações.');
  }finally{
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent='Salvar andamento';
    }
  }
}

async function toggleUserActive(uid){

async function createUserLogin(event){
  event.preventDefault();
  if(role!=='admin') return;

  const name=document.getElementById('newUserName').value.trim();
  const email=document.getElementById('newUserEmail').value.trim().toLowerCase();
  const password=document.getElementById('newUserPassword').value;
  const newRole=document.getElementById('newUserRole').value;
  const msg=document.getElementById('userCreateMessage');
  const btn=document.getElementById('createUserButton');

  msg.textContent='';
  msg.style.color='#b91c1c';

  if(!name){msg.textContent='Informe o nome.';return;}
  if(password.length<6){msg.textContent='A senha precisa ter pelo menos 6 caracteres.';return;}
  if(!['admin','consultant','instructor'].includes(newRole)){msg.textContent='Selecione ADM, Consultor de Treinamento ou Instrutor.';return;}

  btn.disabled=true;
  btn.textContent='Criando...';

  try{

    const credential=await secondaryAuth.createUserWithEmailAndPassword(email,password);
    const uid=credential.user.uid;
    const profile={
      nome:name,
      email,
      perfil:newRole,
      cargo:newRole==='admin'?'ADM':newRole==='consultant'?'Consultor de Treinamento':'Instrutor',
      ativo:true,
      criadoPor:currentUserProfile&&currentUserProfile.uid?currentUserProfile.uid:null,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('usuarios').doc(uid).set(profile);

    if(!data.people.includes(name)){
      data.people.push(name);
      await save();
    }

    await secondaryAuth.signOut();
    await loadTeamUsers();

    try{await secondaryAuth.signOut();}catch(_){}
    msg.textContent=userCreationError(err);
    btn.disabled=false;
    btn.textContent='Criar login';
  }
}


function normalizeAgentText(text){
  return String(text||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();
}

function normalizeExcelHeader(text){
  return normalizeAgentText(text)
    .replace(/[^a-z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'');
}

function canonicalLevel(value){
  const v=normalizeAgentText(value);
  if(v==='basica'||v==='basico') return 'Básica';
  if(v==='intermediaria'||v==='intermediario') return 'Intermediária';
  if(v==='media'||v==='medio') return 'Média';
  if(v==='avancada'||v==='avancado') return 'Avançada';
  return '';
}

function canonicalStatus(value){
  const v=normalizeAgentText(value);
  if(!v) return 'Planejamento';
  if(v==='planejamento') return 'Planejamento';
  if(v==='em producao'||v==='producao') return 'Em produção';
  if(v==='em revisao'||v==='revisao') return 'Em revisão';
  if(v==='concluida'||v==='concluido'||v==='concluido(a)') return 'Concluída';
  return 'Planejamento';
}

function getActiveInstructors(){
  const firestoreInstructors=teamUsers
    .filter(u=>u.perfil==='instructor' && u.ativo!==false)
    .map(u=>u.nome)
    .filter(Boolean);

  const fallback=data.people.filter(name=>{
    if(!name) return false;
    const user=teamUsers.find(u=>u.nome===name);
    if(user && user.perfil==='admin') return false;
    return name!==currentPersonName;
  });

  return [...new Set(firestoreInstructors.length?firestoreInstructors:fallback)];
}

function getWeeklyLoad(person){
  return data.plans.filter(p=>p.week==='Semana atual' && p.person===person).length;
}

function getAgentEligibleSkills(){
  const alreadyPlanned=new Set(
    data.plans
      .filter(p=>p.week==='Semana atual')
      .map(p=>Number(p.skillId))
  );

  const statusPriority={'Planejamento':0,'Em produção':1,'Em revisão':2};

  return data.skills
    .filter(s=>s.status!=='Concluída' && !alreadyPlanned.has(Number(s.id)))
    .sort((a,b)=>{
      const pa=statusPriority[a.status]??9;
      const pb=statusPriority[b.status]??9;
      if(pa!==pb) return pa-pb;
      return Number(a.progress||0)-Number(b.progress||0);
    });
}

function buildAgentDistribution(skillCount,instructorCount){
  const instructors=getActiveInstructors()
    .map(name=>({name,load:getWeeklyLoad(name)}))
    .sort((a,b)=>a.load-b.load || a.name.localeCompare(b.name));

  if(!instructors.length){
    return {error:'Não encontrei nenhum usuário ativo com perfil Instrutor. Cadastre ou ative os instrutores antes de montar a distribuição.'};
  }

  const useCount=Math.max(1,Math.min(Number(instructorCount)||instructors.length,instructors.length));
  const selectedInstructors=instructors.slice(0,useCount);
  const eligible=getAgentEligibleSkills();

  if(!eligible.length){
    return {error:'Não há habilidades pendentes e ainda não planejadas disponíveis para distribuir nesta semana.'};
  }

  const requested=Math.max(1,Number(skillCount)||eligible.length);
  const selectedSkills=eligible.slice(0,requested);
  const dynamicLoads=Object.fromEntries(selectedInstructors.map(i=>[i.name,i.load]));
  const assignments=[];

  selectedSkills.forEach(skill=>{
    const person=selectedInstructors
      .slice()
      .sort((a,b)=>dynamicLoads[a.name]-dynamicLoads[b.name] || a.name.localeCompare(b.name))[0];

    assignments.push({
      skillId:skill.id,
      skillTitle:skill.title,
      level:skill.level,
      person:person.name,
      previousLoad:dynamicLoads[person.name]
    });
    dynamicLoads[person.name]+=1;
  });

  return {
    type:'plan',
    requested,
    available:eligible.length,
    selectedInstructors:selectedInstructors.map(i=>i.name),
    assignments,
    finalLoads:dynamicLoads,
    limited:selectedSkills.length<requested
  };
}

function agentAddMessage(type,text){
  agentMessages.push({type,text});
  if(agentMessages.length>40) agentMessages=agentMessages.slice(-40);
}

function agentDistributionSummary(plan){
  const perPerson={};
  plan.assignments.forEach(a=>{
    if(!perPerson[a.person]) perPerson[a.person]=[];
    perPerson[a.person].push(a);
  });

  let text='Preparei a distribuição de '+plan.assignments.length+' habilidade(s) para esta semana.\n\n';
  Object.entries(perPerson).forEach(([person,items])=>{
    text+='• '+person+': '+items.length+' habilidade(s)\n';
  });

  if(plan.limited){
    text+='\nVocê pediu '+plan.requested+', mas encontrei somente '+plan.assignments.length+' habilidade(s) pendentes e disponíveis.';
  }else{
    text+='\nA distribuição foi equilibrada considerando a carga que cada instrutor já possui nesta semana.';
  }

  text+='\n\nNenhuma alteração foi feita ainda. Confirme o plano ao lado para executar.';
  return text;
}

function agentTeamSummary(){
  const instructors=getActiveInstructors();
  if(!instructors.length) return 'Não encontrei instrutores ativos cadastrados.';
  const stats=instructors
    .map(name=>({name,load:getWeeklyLoad(name)}))
    .sort((a,b)=>b.load-a.load);

  return 'Carga atual da semana:\n\n'+stats.map(s=>'• '+s.name+': '+s.load+' habilidade(s)').join('\n');
}

function parseAgentUserCommand(command){
  const email=(command.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';
  const passMatch=command.match(/senha\s*[:=\-]?\s*["']?([^\s,;]+)["']?/i);
  const password=passMatch?passMatch[1]:'';
  const roleMatch=command.match(/(?:perfil|como)\s*[:=\-]?\s*(adm|admin|administrador|instrutor)/i);
  const profile=roleMatch
    ? (/adm|admin|administrador/i.test(roleMatch[1])?'admin':'instructor')
    : '';

  let name='';
  const nameMatch=command.match(/(?:crie|criar|novo|nova)?\s*(?:um\s*)?(?:login|usuario|usuário)\s+(?:para\s+)?(.+?)(?=\s+(?:email|e-mail|senha|perfil|como)\b|$)/i);
  if(nameMatch) name=nameMatch[1].replace(/^para\s+/i,'').trim();

  return {name,email,password,profile};
}

function parseAgentSkillCommand(command){
  const titleMatch=command.match(/(?:habilidade|titulo|título)\s*[:=\-]?\s*(.+?)(?=\s+(?:nivel|nível|objetivo|desenvolvimento|duracao|duração|responsavel|responsável|status)\b|$)/i);
  const levelMatch=command.match(/(?:nivel|nível)\s*[:=\-]?\s*(basica|básica|basico|básico|intermediaria|intermediária|intermediario|intermediário|media|média|medio|médio|avancada|avançada|avancado|avançado)/i);
  const objectiveMatch=command.match(/objetivo\s*[:=\-]?\s*(.+?)(?=\s+(?:desenvolvimento|duracao|duração|responsavel|responsável|status)\b|$)/i);
  const developmentMatch=command.match(/desenvolvimento\s*[:=\-]?\s*(.+?)(?=\s+(?:duracao|duração|responsavel|responsável|status)\b|$)/i);
  const durationMatch=command.match(/(?:duracao|duração)\s*[:=\-]?\s*([0-9]+\s*(?:min|minutos?|h|horas?))/i);
  const ownerMatch=command.match(/(?:responsavel|responsável)\s*[:=\-]?\s*(.+?)(?=\s+(?:status)\b|$)/i);
  const statusMatch=command.match(/status\s*[:=\-]?\s*(planejamento|em\s+producao|em\s+produção|producao|produção|em\s+revisao|em\s+revisão|revisao|revisão|concluida|concluída)/i);

  return {
    title:titleMatch?titleMatch[1].trim():'',
    level:levelMatch?canonicalLevel(levelMatch[1]):'',
    objective:objectiveMatch?objectiveMatch[1].trim():'',
    development:developmentMatch?developmentMatch[1].trim():'',
    duration:durationMatch?durationMatch[1].trim():'8 min',
    owner:ownerMatch?ownerMatch[1].trim():'',
    status:statusMatch?canonicalStatus(statusMatch[1]):'Planejamento'
  };
}

function getExcelField(row,aliases){
  const normalized={};
  Object.entries(row||{}).forEach(([key,value])=>{
    normalized[normalizeExcelHeader(key)]=value;
  });
  for(const alias of aliases){
    const key=normalizeExcelHeader(alias);
    if(normalized[key]!==undefined && String(normalized[key]).trim()!=='') return String(normalized[key]).trim();
  }
  return '';
}

async function handleAgentExcelImport(event){
  if(role!=='admin') return;
  const input=event.target;
  const file=input.files&&input.files[0];
  if(!file) return;

  try{
    if(typeof XLSX==='undefined') throw new Error('Biblioteca de Excel não carregada.');

    agentAddMessage('user','Importar planilha: '+file.name);

    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array'});
    const sheetName=workbook.SheetNames[0];
    if(!sheetName) throw new Error('A planilha não possui nenhuma aba.');

    const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:false});
    if(!rows.length) throw new Error('A primeira aba está vazia.');

    const existing=new Set(data.skills.map(s=>normalizeAgentText(s.title)));
    const seen=new Set();
    const valid=[];
    const duplicates=[];
    const invalid=[];
    const unknownOwners=[];

    rows.forEach((row,index)=>{
      const title=getExcelField(row,['titulo','título','habilidade','nome']);
      const rawLevel=getExcelField(row,['nivel','nível']);
      const level=canonicalLevel(rawLevel);
      const objective=getExcelField(row,['objetivo']);
      const development=getExcelField(row,['desenvolvimento','roteiro']);
      const duration=getExcelField(row,['duracao','duração','tempo'])||'8 min';
      const rawOwner=getExcelField(row,['responsavel','responsável','instrutor']);
      const status=canonicalStatus(getExcelField(row,['status','situacao','situação']));
      const key=normalizeAgentText(title);

      if(!title || !level){
        invalid.push({linha:index+2,title:title||'(sem título)',motivo:!title?'Título ausente':'Nível inválido ou ausente'});
        return;
      }

      if(existing.has(key)||seen.has(key)){
        duplicates.push({linha:index+2,title});
        return;
      }

      seen.add(key);

      let owner='';
      if(rawOwner){
        const matched=data.people.find(p=>normalizeAgentText(p)===normalizeAgentText(rawOwner));
        if(matched) owner=matched;
        else unknownOwners.push({linha:index+2,title,responsavel:rawOwner});
      }

      valid.push({
        title,
        level,
        objective,
        development,
        duration,
        owner,
        status,
        progress:status==='Concluída'?100:0
      });
    });

    const estimatedBytes=new Blob([JSON.stringify([...data.skills,...valid])]).size;
    if(estimatedBytes>850000){
      agentPendingAction=null;
      agentAddMessage('assistant','Li a planilha, mas o volume de texto ultrapassa o limite seguro da estrutura atual do banco. Antes de importar, precisamos migrar as habilidades para uma coleção própria no Firestore. A planilha possui '+rows.length+' linha(s).');
      renderAgent();
      return;
    }

    agentPendingAction={
      type:'importSkills',
      fileName:file.name,
      sheetName,
      totalRows:rows.length,
      rows:valid,
      duplicates,
      invalid,
      unknownOwners
    };

    agentAddMessage(
      'assistant',
      'Planilha analisada. Encontrei '+valid.length+' habilidade(s) prontas para importar, '+duplicates.length+' duplicada(s) e '+invalid.length+' linha(s) inválida(s).\n\nNada foi importado ainda. Confira o resumo ao lado e confirme para executar.'
    );
  }catch(err){
    console.error('Erro ao importar Excel:',err);
    agentPendingAction=null;
    agentAddMessage('assistant','Não consegui ler essa planilha. Verifique se é um arquivo .xlsx, .xls ou .csv válido e se possui as colunas "titulo" e "nivel".');
  }finally{
    input.value='';
    renderAgent();
  }
}

function processAgentCommand(event){
  event.preventDefault();
  if(role!=='admin') return;

  const input=document.getElementById('agentInput');
  const command=(input.value||'').trim();
  if(!command) return;

  const normalized=normalizeAgentText(command);
  const sanitized=/senha/i.test(command)
    ? command.replace(/(senha\s*[:=\-]?\s*)[^\s,;]+/i,'$1******')
    : command;

  agentAddMessage('user',sanitized);
  input.value='';

  if(agentPendingAction&&agentPendingAction.type==='skillMode'){
    if(/^(uma|1|unica|única|individual|so uma|só uma)\b/.test(normalized)){
      chooseAgentSkillMode('single');
      return;
    }
    if(/^(varias|várias|multiplas|múltiplas|muitas|excel|planilha|lote)\b/.test(normalized)){
      chooseAgentSkillMode('bulk');
      return;
    }
  }

  const wantsCreateUser=/\b(crie|criar|novo|nova)\b/.test(normalized) && /(login|usuario)/.test(normalized);
  const wantsCreateSkill=/\b(crie|criar|nova|novo)\b/.test(normalized) && /habilidade/.test(normalized);

  if(wantsCreateUser){
    prepareAgentCreateUser(command);
    renderAgent();
    return;
  }

  if(wantsCreateSkill){
    prepareAgentSkillMode(command);
    renderAgent();
    return;
  }

  const skillMatch=normalized.match(/(\d+)\s*(?:habilidade|habilidades)/);
  const instructorMatch=normalized.match(/(\d+)\s*(?:instrutor|instrutores)/);
  const skillCount=skillMatch?Number(skillMatch[1]):null;
  const instructorCount=instructorMatch?Number(instructorMatch[1]):null;

  const wantsDistribution=/organiza|organize|distribu|divid|liber|planej|meta/.test(normalized);
  const wantsLoad=/carga|carregado|ocupado|livre|disponivel|quem esta|quantas tarefas/.test(normalized) && !wantsDistribution;

  if(wantsDistribution){
    const plan=buildAgentDistribution(skillCount,instructorCount);
    if(plan.error){
      agentPendingAction=null;
      agentAddMessage('assistant',plan.error);
    }else{
      agentPendingAction=plan;
      agentAddMessage('assistant',agentDistributionSummary(plan));
    }
  }else if(wantsLoad){
    agentPendingAction=null;
    agentAddMessage('assistant',agentTeamSummary());
  }else{
    agentPendingAction=null;
    agentAddMessage(
      'assistant',
      'Posso executar tarefas do portal ADM, sempre pedindo confirmação antes de criar ou alterar dados. Exemplos:\n\n• "Distribua 10 habilidades entre 2 instrutores."\n• "Crie login para Ana Silva, email ana@empresa.com, senha 123456, perfil Instrutor."\n• "Quero criar habilidade." — vou perguntar se é uma ou várias.\n• Use o modelo Excel para cadastrar centenas de habilidades de uma vez.'
    );
  }

  renderAgent();
}

async function executeAgentPlan(action){
  const now=Date.now();
  action.assignments.forEach((assignment,index)=>{
    const exists=data.plans.some(p=>p.week==='Semana atual' && Number(p.skillId)===Number(assignment.skillId));
    if(!exists){
      data.plans.push({
        id:now+index,
        person:assignment.person,
        skillId:assignment.skillId,
        week:'Semana atual',
        origem:'Agente ADM'
      });
    }
    const skill=data.skills.find(s=>Number(s.id)===Number(assignment.skillId));
    if(skill){
      skill.owner=assignment.person;
      if(skill.status==='Planejamento') skill.status='Em produção';
    }
  });
  await save();
  return 'Planejamento aplicado. Distribuí '+action.assignments.length+' habilidade(s) e atualizei os responsáveis.';
}

async function executeAgentCreateUser(action){
  await secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);
  try{
    const credential=await secondaryAuth.createUserWithEmailAndPassword(action.email,action.password);
    const uid=credential.user.uid;
    const profile={
      nome:action.name,
      email:action.email,
      perfil:action.profile,
      cargo:action.profile==='admin'?'ADM':'Instrutor',
      ativo:true,
      criadoPor:currentUserProfile&&currentUserProfile.uid?currentUserProfile.uid:null,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('usuarios').doc(uid).set(profile);

    if(!data.people.includes(action.name)){
      data.people.push(action.name);
      await save();
    }

    await loadTeamUsers();
    return 'Login criado com sucesso para '+action.name+' como '+(action.profile==='admin'?'ADM':'Instrutor')+'.';
  }finally{
    try{await secondaryAuth.signOut();}catch(_){}
  }
}

async function executeAgentCreateSkill(action){
  const skill={
    id:Date.now(),
    title:action.title,
    level:action.level,
    owner:action.owner||'',
    status:action.status||'Planejamento',
    progress:action.status==='Concluída'?100:0,
    duration:action.duration||'8 min',
    objective:action.objective||'',
    development:action.development||''
  };
  data.skills.push(skill);
  await save();
  return 'Habilidade criada com sucesso: '+action.title+'.';
}

async function executeAgentImportSkills(action){
  const now=Date.now();
  action.rows.forEach((row,index)=>{
    data.skills.push({
      id:now+index,
      title:row.title,
      level:row.level,
      owner:row.owner||'',
      status:row.status||'Planejamento',
      progress:Number(row.progress||0),
      duration:row.duration||'8 min',
      objective:row.objective||'',
      development:row.development||''
    });
  });
  await save();
  return 'Importação concluída. '+action.rows.length+' habilidade(s) foram adicionadas ao sistema.';
}

async function confirmAgentAction(){
  if(role!=='admin' || !agentPendingAction) return;

  const button=document.getElementById('agentConfirmButton');
  if(button){button.disabled=true;button.textContent='Executando...';}

  const action=agentPendingAction;
  try{
    let result='';
    if(action.type==='plan') result=await executeAgentPlan(action);
    if(action.type==='createUser') result=await executeAgentCreateUser(action);
    if(action.type==='createSkill') result=await executeAgentCreateSkill(action);
    if(action.type==='importSkills') result=await executeAgentImportSkills(action);

    agentPendingAction=null;
    agentAddMessage('assistant',result||'Ação concluída.');
  }catch(err){
    console.error('Erro ao executar ação do Agente ADM:',err);
    agentAddMessage('assistant','Não consegui concluir a ação. '+(err&&err.message?err.message:'Verifique Firebase e tente novamente.'));
  }
  renderAgent();
}

function cancelAgentAction(){
  agentPendingAction=null;
  agentAddMessage('assistant','Ação cancelada. Nenhuma alteração foi feita.');
  renderAgent();
}

function trainingDemands(){
  return Array.isArray(data.trainingDemands)?data.trainingDemands:[];
}

function trainingDemandSkill(d){
  return data.skills.find(s=>Number(s.id)===Number(d?.linkedSkillId))||null;
}

function trainingDemandEffectiveStatus(d){
  if(!d) return 'Pendente ADM';
  if(d.status==='Em produção'){
    const skill=trainingDemandSkill(d);
    if(skill&&skillWorkflowMetrics(skill).currentIndex>=5) return 'Pronto para aplicação';
  }
  return d.status||'Pendente ADM';
}

function trainingDemandStatusBadge(status){
  const cls=status==='Pendente ADM'?'amber':status==='Em produção'?'blue':status==='Pronto para aplicação'?'green':status==='Em acompanhamento'?'blue':status==='Concluída'?'green':'red';
  return '<span class="fleet-mini-badge '+cls+'">'+esc(status)+'</span>';
}

function trainingDemandCounts(d){
  return {
    before:Array.isArray(d?.preTrainingOccurrences)?d.preTrainingOccurrences.length:0,
    after:Array.isArray(d?.postTrainingOccurrences)?d.postTrainingOccurrences.length:0
  };
}

async function trainingDemandApi(body){
  const user=auth.currentUser;
  if(!user) throw new Error('Sua sessão expirou. Entre novamente.');
  const token=await user.getIdToken(true);
  const response=await fetch('/api/training-demands',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify(body)
  });
  let result={};
  try{result=await response.json();}catch(_){}
  if(!response.ok) throw new Error(result.error||'Não foi possível atualizar a demanda.');
  return result;
}

function trainingDemandCard(d){
  const status=trainingDemandEffectiveStatus(d);
  const counts=trainingDemandCounts(d);
  const skill=trainingDemandSkill(d);
  return '<div class="skill">'+
    '<div class="skill-top"><b>'+esc(d.topic||'Necessidade de treinamento')+'</b>'+trainingDemandStatusBadge(status)+'</div>'+
    '<p class="muted">'+esc(d.machineCode||'—')+' • '+esc(d.machineName||'')+(d.client?' • '+esc(d.client):'')+'</p>'+
    '<div class="fleet-readonly"><b>Evidência:</b> '+esc(d.evidence||'Não informada')+'</div>'+
    '<div class="fleet-detail-grid" style="grid-template-columns:repeat(3,1fr)">'+
      '<div class="fleet-detail-item"><span>Prioridade</span><b>'+esc(d.priority||'Baixa')+'</b></div>'+
      '<div class="fleet-detail-item"><span>Ocorrências antes</span><b>'+counts.before+'</b></div>'+
      '<div class="fleet-detail-item"><span>Ocorrências após</span><b>'+counts.after+'</b></div>'+
    '</div>'+
    (skill?'<div class="muted" style="margin-top:8px">Habilidade: <b>'+esc(skill.title)+'</b> • '+esc(skill.owner||'')+' • '+skillWorkflowMetrics(skill).progress+'%</div>':'')+
    '<div class="actions">'+
      (role==='admin'&&status==='Pendente ADM'?'<button class="btn btn-primary" onclick="openTrainingDemandApproval('+d.id+')">Analisar / aprovar</button>':'')+
      ((role==='admin'||role==='consultant')&&status==='Pronto para aplicação'?'<button class="btn btn-primary" onclick="markTrainingDemandApplied('+d.id+')">Registrar treinamento aplicado</button>':'')+
      ((role==='admin'||role==='consultant')&&status==='Em acompanhamento'?'<button class="btn btn-soft" onclick="closeTrainingDemand('+d.id+')">Encerrar acompanhamento</button>':'')+
      '<button class="btn btn-soft" onclick="openTrainingDemandDetail('+d.id+')">Detalhes</button>'+
    '</div>'+
  '</div>';
}

function renderTrainingDemands(){
  header('Demandas de Treinamento','Transforme evidências de campo em ações de treinamento rastreáveis e acompanhe o resultado após a aplicação.');
  const demands=trainingDemands().slice().sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));
  const pending=demands.filter(d=>trainingDemandEffectiveStatus(d)==='Pendente ADM').length;
  const production=demands.filter(d=>['Em produção','Pronto para aplicação'].includes(trainingDemandEffectiveStatus(d))).length;
  const follow=demands.filter(d=>trainingDemandEffectiveStatus(d)==='Em acompanhamento').length;
  const done=demands.filter(d=>trainingDemandEffectiveStatus(d)==='Concluída').length;

  document.getElementById('content').innerHTML=
    '<div class="cards"><div class="card"><div class="muted">Pendentes ADM</div><div class="metric">'+pending+'</div></div><div class="card"><div class="muted">Em produção</div><div class="metric">'+production+'</div></div><div class="card"><div class="muted">Em acompanhamento</div><div class="metric">'+follow+'</div></div><div class="card"><div class="muted">Concluídas</div><div class="metric">'+done+'</div></div></div>'+
    '<div class="section"><div class="section-head"><div><h3>Fila de demandas</h3><div class="muted">Frota → necessidade → aprovação → habilidade → aplicação → acompanhamento.</div></div></div><div class="grid">'+
      (demands.length?demands.map(trainingDemandCard).join(''):'<div class="empty">Nenhuma demanda de treinamento foi criada pela frota.</div>')+
    '</div></div>';
}

async function approveTrainingDemand(id){
  try{
    const result=await trainingDemandApi({
      action:'approve',
      demandId:id,
      title:document.getElementById('tdTitle').value.trim(),
      owner:document.getElementById('tdOwner').value,
      level:document.getElementById('tdLevel').value,
      duration:document.getElementById('tdDuration').value.trim()
    });
    if(result.demand){
      data.trainingDemands=trainingDemands().filter(d=>Number(d.id)!==Number(id));
      data.trainingDemands.unshift(result.demand);
    }
    if(result.skill&&!data.skills.some(s=>Number(s.id)===Number(result.skill.id))) data.skills.push(result.skill);
    closeModal();renderTrainingDemands();
  }catch(err){alert(err.message||'Não foi possível aprovar a demanda.');}
}

async function rejectTrainingDemand(id){
  const reason=prompt('Motivo para não aprovar esta demanda:')||'';
  if(!confirm('Confirmar que esta demanda não será transformada em habilidade?')) return;
  try{
    const result=await trainingDemandApi({action:'reject',demandId:id,reason});
    data.trainingDemands=trainingDemands().map(d=>Number(d.id)===Number(id)?result.demand:d);
    closeModal();renderTrainingDemands();
  }catch(err){alert(err.message||'Não foi possível atualizar a demanda.');}
}

async function markTrainingDemandApplied(id){
  const notes=prompt('Observação sobre a aplicação do treinamento (equipe, turma, local, etc.):')||'';
  try{
    const result=await trainingDemandApi({action:'mark-applied',demandId:id,notes});
    data.trainingDemands=trainingDemands().map(d=>Number(d.id)===Number(id)?result.demand:d);
    renderTrainingDemands();
  }catch(err){alert(err.message||'Não foi possível registrar a aplicação.');}
}

async function closeTrainingDemand(id){
  const d=trainingDemands().find(x=>Number(x.id)===Number(id));if(!d)return;
  const counts=trainingDemandCounts(d);
  const outcome=prompt('Conclusão do acompanhamento (ex.: recorrência reduziu, manteve, aumentou, dados insuficientes):','Dados insuficientes')||'Dados insuficientes';
  const notes=prompt('Observações finais:')||'';
  try{
    const result=await trainingDemandApi({action:'close',demandId:id,outcome,notes});
    data.trainingDemands=trainingDemands().map(x=>Number(x.id)===Number(id)?result.demand:x);
    renderTrainingDemands();
  }catch(err){alert(err.message||'Não foi possível encerrar o acompanhamento.');}
}

async function registerFleetTrainingDemand(m,eventData){
  if(!m||!eventData||eventData.classificacaoNecessidade!=='Treinamento'||!eventData.necessidadeTreinamento) return null;
  const result=await trainingDemandApi({
    action:'register-occurrence',
    machineCode:m.codigo,
    machineName:m.modelo,
    machineFamily:fleetFamily(m),
    client:m.cliente,
    location:m.local,
    eventDate:eventData.data,
    evidence:eventData.evidenciaObservada,
    analysis:eventData.analiseTecnica,
    trainingNeed:eventData.necessidadeTreinamento,
    priority:eventData.prioridadeTreinamento
  });
  if(result.demand){
    const list=trainingDemands().filter(d=>Number(d.id)!==Number(result.demand.id));
    data.trainingDemands=[result.demand,...list];
  }
  return result;
}

function fleetFamily(m){return String(m?.familia||'Outro')}

function fleetFieldAvailable(m,key){

  if(key==='cycles')return !!m.ciclosDisponiveis;

  if(key==='application'||key==='condition')return fleetFamily(m)==='Escavadeira'||fleetFamily(m)==='Carregadeira';
  return false;
}
function fleetMoney(value){return Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fleetCostHistory(m){
  if(!m||m.tipoPropulsao!=='Elétrico') return [];
  let h=Array.isArray(m.historicoCustos)?m.historicoCustos.slice():[];
  if(!h.length&&Number(m.tarifaEnergia)>0&&Number(m.precoDiesel)>0){
    h=[{id:'inicial',dataInicio:m.ultimaAtualizacao||new Date().toISOString().slice(0,10),horimetroInicio:Math.max(0,Number(m.horimetroInicioEconomia)||0),tarifaEnergia:Number(m.tarifaEnergia),precoDiesel:Number(m.precoDiesel),responsavel:'Cadastro inicial'}];
  }
  return h.filter(x=>Number(x.tarifaEnergia)>0&&Number(x.precoDiesel)>0).map(x=>({...x,horimetroInicio:Math.max(0,Number(x.horimetroInicio)||0),tarifaEnergia:Number(x.tarifaEnergia),precoDiesel:Number(x.precoDiesel)})).sort((a,b)=>a.horimetroInicio-b.horimetroInicio||String(a.dataInicio||'').localeCompare(String(b.dataInicio||'')));
}
function fleetCurrentCost(m){const h=fleetCostHistory(m);return h.length?h[h.length-1]:null}
function fleetEconomy(m){
  if(!m||m.tipoPropulsao!=='Elétrico') return null;
  const electricKwh=Math.max(0,Number(m.consumoEletricoKwhHora)||0),dieselLh=Math.max(0,Number(m.consumoDieselReferenciaLHora)||0),currentHours=Math.max(0,Number(m.horimetro)||0),history=fleetCostHistory(m);
  if(!electricKwh||!dieselLh||!history.length) return null;
  let totalHours=0,totalElectric=0,totalDiesel=0,totalSaving=0;
  const periods=history.map((entry,index)=>{
    const start=Math.min(currentHours,entry.horimetroInicio);
    const next=history[index+1];
    const end=next?Math.min(currentHours,Math.max(start,next.horimetroInicio)):currentHours;
    const hours=Math.max(0,end-start),custoEletricoHora=electricKwh*entry.tarifaEnergia,custoDieselHora=dieselLh*entry.precoDiesel,economiaHora=custoDieselHora-custoEletricoHora,economiaPeriodo=economiaHora*hours;
    totalHours+=hours;totalElectric+=custoEletricoHora*hours;totalDiesel+=custoDieselHora*hours;totalSaving+=economiaPeriodo;
    return {...entry,start,end,hours,custoEletricoHora,custoDieselHora,economiaHora,economiaPeriodo};
  });
  const current=periods[periods.length-1];
  return {hours:totalHours,custoEletricoHora:current?.custoEletricoHora||0,custoDieselHora:current?.custoDieselHora||0,economiaHora:current?.economiaHora||0,economiaTotal:totalSaving,custoEletricoTotal:totalElectric,custoDieselTotal:totalDiesel,percentual:totalDiesel>0?totalSaving/totalDiesel*100:0,periods};
}
function fleetCostHistoryHtml(m){
  const e=fleetEconomy(m);if(!e||!e.periods.length)return '';
  return '<div class="fleet-panel" style="margin-top:14px"><h3>Histórico de custos aplicados</h3><div class="table-wrap"><table><thead><tr><th>Vigência</th><th>Horímetro inicial</th><th>Energia</th><th>Diesel</th><th>Horas</th><th>Economia</th></tr></thead><tbody>'+e.periods.map(p=>'<tr><td>'+fleetDate(p.dataInicio)+'</td><td>'+Number(p.start).toLocaleString('pt-BR')+' h</td><td>'+fleetMoney(p.tarifaEnergia)+'/kWh</td><td>'+fleetMoney(p.precoDiesel)+'/L</td><td>'+Number(p.hours).toLocaleString('pt-BR')+' h</td><td>'+fleetMoney(p.economiaPeriodo)+'</td></tr>').join('')+'</tbody></table></div><div class="fleet-readonly" style="margin-top:10px">Cada mudança de preço cria uma nova vigência. Os valores anteriores continuam no cálculo histórico.</div></div>';
}
function openFleetCostUpdate(id){
  if(!fleetCanEdit())return;

  const current=fleetCurrentCost(m);

function saveFleetCostUpdate(id){
  if(!fleetCanEdit())return;
  const m=fleetPrototype.find(x=>Number(x.id)===Number(id));if(!m||m.tipoPropulsao!=='Elétrico')return;
  const dataInicio=document.getElementById('fcData').value,horimetroInicio=Math.max(0,Number(document.getElementById('fcHorimetro').value)||0),tarifaEnergia=Number(document.getElementById('fcEnergia').value),precoDiesel=Number(document.getElementById('fcDiesel').value);
  if(!dataInicio||!(tarifaEnergia>0)||!(precoDiesel>0))return alert('Preencha data de vigência, tarifa de energia e preço do diesel.');
  if(horimetroInicio>Number(m.horimetro||0))return alert('O horímetro da vigência não pode ser maior que o horímetro atual.');
  if(!Array.isArray(m.historicoCustos)||!m.historicoCustos.length)m.historicoCustos=fleetCostHistory(m);
  const last=m.historicoCustos.slice().sort((a,b)=>Number(a.horimetroInicio)-Number(b.horimetroInicio)).pop();
  if(last&&horimetroInicio<Number(last.horimetroInicio||0))return alert('O novo horímetro precisa ser igual ou maior que o último período cadastrado.');
  m.historicoCustos.push({id:Date.now(),dataInicio,horimetroInicio,tarifaEnergia,precoDiesel,responsavel:currentPersonName||'Consultor de Treinamento'});
  m.tarifaEnergia=tarifaEnergia;m.precoDiesel=precoDiesel;fleetSavePrototype();openFleetMachineReport(m.id);
}

async function loadFleetShiftRecords(force=false){
  if(fleetShiftLoading) return;
  if(fleetShiftLoaded&&!force){
    renderFleetShiftPanel();
    return;
  }

  fleetShiftLoading=true;
  fleetShiftError='';
  renderFleetShiftPanel();

  try{
    if(!auth.currentUser) throw new Error('Sessão não encontrada.');
    const token=await auth.currentUser.getIdToken();
    const response=await fetch('/api/fleet-shifts',{
      headers:{'Authorization':'Bearer '+token}
    });

    let body={};
    try{body=await response.json()}catch(_){}
    if(!response.ok) throw new Error(body.error||'Não foi possível carregar os turnos.');

    fleetShiftRecords=Array.isArray(body.records)?body.records:[];
    fleetShiftLoaded=true;
  }catch(err){
    console.error('Falha ao sincronizar turnos:',err);
    fleetShiftError=err.message||'Falha ao carregar registros do app.';
  }finally{
    fleetShiftLoading=false;
    renderFleetShiftPanel();
  }
}

function fleetShiftMetrics(records){
  const rows=Array.isArray(records)?records:[];
  return {
    turns:rows.length,
    hours:rows.reduce((s,r)=>s+Math.max(0,Number(r.hourmeterDelta)||0),0),
    km:rows.reduce((s,r)=>s+Math.max(0,Number(r.distanceKm)||0),0),
    cycles:rows.reduce((s,r)=>s+Math.max(0,Number(r.loadedCycles)||0),0)
  };
}

function fleetShiftCard(r){
  const details=[];
  if(r.hourmeterStart!==undefined&&r.hourmeterStart!==null&&r.hourmeterEnd!==undefined&&r.hourmeterEnd!==null)details.push('Horímetro '+Number(r.hourmeterStart).toLocaleString('pt-BR')+' → '+Number(r.hourmeterEnd).toLocaleString('pt-BR')+' h');
  if(r.distanceKm!==undefined&&r.distanceKm!==null)details.push('Distância '+Number(r.distanceKm).toLocaleString('pt-BR')+' km');
  if(r.socStart!==undefined&&r.socStart!==null)details.push('SOC '+Number(r.socStart).toLocaleString('pt-BR')+'% → '+Number(r.socEnd).toLocaleString('pt-BR')+'%');
  if(r.loadedCycles!==undefined&&r.loadedCycles!==null)details.push('Ciclos '+Number(r.loadedCycles).toLocaleString('pt-BR'));
  if(r.payloadTons!==undefined&&r.payloadTons!==null)details.push('Carga '+Number(r.payloadTons).toLocaleString('pt-BR')+' t');
  if(r.energyConsumedKwh!==undefined&&r.energyConsumedKwh!==null)details.push('Energia '+Number(r.energyConsumedKwh).toLocaleString('pt-BR')+' kWh');
  if(r.fuelConsumedLiters!==undefined&&r.fuelConsumedLiters!==null)details.push('Combustível '+Number(r.fuelConsumedLiters).toLocaleString('pt-BR')+' L');
  if(r.application)details.push('Aplicação '+r.application);
  if(r.operationalCondition)details.push('Condição '+r.operationalCondition);
  return '<div class="fleet-event">'+
    '<div class="date">'+fleetDate(r.date)+' • '+esc(r.shift||'Turno')+' • '+esc(r.operator||'Operador não informado')+'</div>'+
    '<div class="event-title">'+esc(r.machineCode||'—')+' • '+esc(r.machineFamily||'Equipamento')+' • dados enviados pelo app do cliente</div>'+
    '<div class="event-text">'+details.map(esc).join(' • ')+'</div>'+
    (r.notes?'<div class="machine-sub" style="margin-top:5px">'+esc(r.notes)+'</div>':'')+
  '</div>';
}

function renderFleetShiftPanel(){
  const el=document.getElementById('fleetShiftSyncPanel');
  if(!el) return;

  if(fleetShiftLoading){
    el.innerHTML='<div class="muted">Sincronizando registros enviados pelo app do cliente...</div>';

  }

  if(fleetShiftError){

  el.innerHTML=
    '<div class="fleet-report-grid">'+
      '<div class="fleet-report-card"><span class="muted">Turnos recebidos</span><b>'+metrics.turns+'</b></div>'+
