<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:flex-start;padding:32px clamp(24px,7vw,120px);background-image:linear-gradient(rgba(0,0,0,.24),rgba(0,0,0,.45)),url("/assets/images/login-background.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
.login-card{width:min(500px,100%);background:rgba(255,255,255,.94);border-radius:24px;padding:34px;box-shadow:0 24px 70px #0008;backdrop-filter:blur(8px)}.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:14px;background:var(--primary);color:white;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:28px}.brand p{margin:4px 0 0;color:var(--muted)}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.role{border:1px solid var(--line);border-radius:18px;padding:24px;background:#fafafa;text-align:left}.role:hover{border-color:#aaa;transform:translateY(-1px)}.role strong{display:block;font-size:20px;margin-bottom:8px}.role span{color:var(--muted);line-height:1.5}.role .go{margin-top:18px;color:var(--primary);font-weight:800}.login-form{margin-top:28px;max-width:460px}.login-form label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.login-form input{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:12px 13px;margin-bottom:14px}.login-form button{width:100%;padding:12px;border:0;border-radius:11px;background:var(--primary);color:white;font-weight:800}.login-error{margin-top:12px;color:#b91c1c;font-size:13px;min-height:18px}.login-help{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.5}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#171717;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.side .brand{margin:0 8px 28px}.side .logo{width:40px;height:40px;border-radius:10px}.side h1{font-size:19px}.side p{font-size:12px;color:#bbb}
.nav button{width:100%;border:0;background:transparent;color:#bbb;text-align:left;padding:12px 14px;border-radius:10px;margin:4px 0}.nav button:hover,.nav button.active{background:#292929;color:white}.profile{position:absolute;bottom:18px;left:16px;right:16px;border-top:1px solid #333;padding-top:16px}.profile b{display:block}.profile small{color:#aaa}.profile button{margin-top:10px;width:100%;padding:9px;border-radius:9px;border:1px solid #444;background:#222;color:white}
.main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.top h2{margin:0 0 6px;font-size:28px}.top p{margin:0;color:var(--muted)}.pill{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:30px;font-weight:850;margin-top:8px}.muted{color:var(--muted);font-size:13px}.section{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.section h3{margin:0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.btn-primary{background:var(--primary);color:white}.btn-soft{background:#f3f4f6}.btn-danger{background:#fee2e2;color:#b91c1c}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.skill{border:1px solid var(--line);border-radius:14px;padding:16px}.skill-top{display:flex;justify-content:space-between;gap:10px}.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:#f3f4f6}.status{font-size:12px;font-weight:700}.s-plan{color:#7c3aed}.s-prod{color:#2563eb}.s-rev{color:#d97706}.s-done{color:#15803d}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--primary)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px;background:white}.field textarea{min-height:90px;resize:vertical}.span2{grid-column:1/-1}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase}.person{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#e5e7eb;display:grid;place-items:center;font-weight:800}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.day{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:190px}.day h4{margin:0 0 12px}.task{border-left:4px solid var(--primary);background:#fafafa;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.notice{padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;font-size:13px}
.agent-shell{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:18px}
.agent-chat{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.agent-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.agent-title{display:flex;align-items:center;gap:12px}.agent-icon{width:42px;height:42px;border-radius:13px;background:#171717;color:#fff;display:grid;place-items:center;font-weight:900}
.agent-messages{padding:18px;min-height:330px;max-height:520px;overflow:auto;background:#fafafa;display:flex;flex-direction:column;gap:12px}
.agent-msg{max-width:88%;padding:12px 14px;border-radius:14px;line-height:1.5;font-size:14px;white-space:pre-wrap}
.agent-msg.assistant{background:#fff;border:1px solid var(--line);align-self:flex-start}
.agent-msg.user{background:#171717;color:#fff;align-self:flex-end}
.agent-compose{padding:16px;border-top:1px solid var(--line);background:#fff}
.agent-compose textarea{width:100%;min-height:86px;resize:vertical;border:1px solid #d0d5dd;border-radius:12px;padding:12px;outline:none}
.agent-compose-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.agent-side{display:flex;flex-direction:column;gap:14px}
.agent-side .section{margin-top:0}
.agent-plan{border:1px solid #dbeafe;background:#eff6ff;border-radius:14px;padding:14px;margin-top:12px}
.agent-plan h4{margin:0 0 10px}
.agent-plan-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #dbeafe;font-size:13px}
.agent-plan-row:last-child{border-bottom:0}
.agent-plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.agent-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}
.agent-chip:hover{background:#f3f4f6}
.agent-stat{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.agent-stat:last-child{border-bottom:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:30}.modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.week{grid-template-columns:1fr 1fr}.agent-shell{grid-template-columns:1fr}.app{grid-template-columns:210px 1fr}}
@media(max-width:720px){.login{justify-content:center;padding:18px;background-position:center}.login-card{padding:24px}.role-grid,.cards,.grid,.week,.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.app{display:block}.side{height:auto;position:relative}.profile{position:static;margin-top:20px}.main{padding:18px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.top{flex-direction:column}}
</style>

<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="brand"><div class="logo">EAD</div><div><h1>EAD Irmen</h1><p>Gestão do desenvolvimento de microaulas e habilidades</p></div></div>
    <form class="login-form" onsubmit="loginWithEmail(event)">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="nome@irmen..." required>
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Sua senha" required>
      <button id="loginButton" type="submit">Entrar</button>
      <div id="loginError" class="login-error"></div>
      <div class="login-help">O sistema possui apenas dois perfis: ADM e Instrutor. O ADM possui acesso geral e pode criar novos logins.</div>
    </form>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><div class="logo">E</div><div><h1>EAD Irmen</h1><p>Gestão de microaulas</p></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="profile"><b id="profileName"></b><small id="profileRole"></small><button onclick="logout()">Sair</button></div>
  </aside>
  <main class="main">
    <div class="top"><div><h2 id="pageTitle"></h2><p id="pageSub"></p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><div class="pill" id="cloudStatus">Conectando ao Firebase...</div><div class="pill" id="today"></div></div></div>
    <div id="content"></div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><div id="modalContent"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCWqu8_spqjZBj1CiSrGK_NipN_bdVpUd8",
  authDomain: "eadirmen-a6693.firebaseapp.com",
  projectId: "eadirmen-a6693",
  storageBucket: "eadirmen-a6693.firebasestorage.app",
  messagingSenderId: "592886995320",
  appId: "1:592886995320:web:93f8a3b78f65af2f7bd08d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const secondaryApp = firebase.initializeApp(firebaseConfig,'ead-irmen-user-creator');
const secondaryAuth = secondaryApp.auth();
let cloudReady = false;
let cloudMessage = "Conectando ao Firebase...";
let currentPage = "dashboard";
let currentUserProfile = null;
let currentPersonName = "";
let teamUsers = [];
let cloudUnsubscribe = null;
let agentPendingPlan = null;
let agentMessages = [
  {
    type:'assistant',
    text:'Sou o Agente ADM do EAD Irmen. Posso analisar a carga da equipe, distribuir habilidades e montar o planejamento semanal. Exemplo: "Quero liberar 15 habilidades essa semana, temos 2 instrutores livres. Organize o trabalho entre os dois."'
  }
];

const defaults={
 skills:[
  {id:1,title:'Identificação dos componentes do sistema hidráulico',level:'Básica',owner:'Vinícius',status:'Em produção',progress:60,duration:'8 min',objective:'Reconhecer os principais componentes hidráulicos.',development:'Apresentação visual dos componentes, função básica e localização na máquina.'},
  {id:2,title:'Leitura inicial de esquema hidráulico',level:'Intermediária',owner:'Carlos',status:'Planejamento',progress:25,duration:'10 min',objective:'Interpretar símbolos e caminho básico do fluxo.',development:'Explicar símbolos, linhas e sequência de leitura com um circuito simples.'},
  {id:3,title:'Diagnóstico de baixa pressão hidráulica',level:'Avançada',owner:'Vinícius',status:'Em revisão',progress:85,duration:'12 min',objective:'Aplicar raciocínio de diagnóstico em baixa pressão.',development:'Caso prático com sintoma, hipóteses, pontos de medição e decisão técnica.'},
  {id:4,title:'Segurança antes da manutenção',level:'Básica',owner:'Mariana',status:'Concluída',progress:100,duration:'7 min',objective:'Executar preparação segura antes da intervenção.',development:'Bloqueio, alívio de energia, EPIs e confirmação da condição segura.'},
  {id:5,title:'Análise de falhas em sensores',level:'Média',owner:'Carlos',status:'Planejamento',progress:20,duration:'9 min',objective:'Relacionar sintomas elétricos a testes básicos.',development:'Multímetro, alimentação, terra, sinal e comparação com parâmetros esperados.'}
 ],
 plans:[
  {id:1,person:'Vinícius',skillId:1,week:'Semana atual'},
  {id:2,person:'Vinícius',skillId:3,week:'Semana atual'},
  {id:3,person:'Carlos',skillId:2,week:'Semana atual'},
  {id:4,person:'Mariana',skillId:4,week:'Semana atual'}
 ],
 people:['Vinícius','Carlos','Mariana']
};
let data=JSON.parse(localStorage.getItem('ead-irmen-data')||'null')||JSON.parse(JSON.stringify(defaults));
let role='';

function cacheLocal(){
  localStorage.setItem('ead-irmen-data',JSON.stringify(data));
}

async function save(){
  cacheLocal();
  if(!cloudReady) return;
  try{
    await db.collection('sistema').doc('sharedData').set({
      skills:data.skills,
      plans:data.plans,
      people:data.people,
      atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    cloudMessage='Firebase sincronizado';
    updateCloudBadge();
  }catch(err){
    console.error('Erro ao salvar no Firebase:',err);
    cloudMessage='Firebase sem permissão';
    updateCloudBadge();
  }
}

async function initCloud(){
  try{
    const ref=db.collection('sistema').doc('sharedData');
    const snap=await ref.get();
    if(snap.exists){
      const remote=snap.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people
      };
      cacheLocal();
    }else{
      await ref.set({
        skills:defaults.skills,
        plans:defaults.plans,
        people:defaults.people,
        criadoEm:firebase.firestore.FieldValue.serverTimestamp(),
        atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
      });
      data=JSON.parse(JSON.stringify(defaults));
      cacheLocal();
    }
    cloudReady=true;
    cloudMessage='Firebase sincronizado';
    updateCloudBadge();

    if(cloudUnsubscribe) cloudUnsubscribe();
    cloudUnsubscribe=ref.onSnapshot(doc=>{
      if(!doc.exists) return;
      const remote=doc.data();
      data={
        skills:Array.isArray(remote.skills)?remote.skills:[],
        plans:Array.isArray(remote.plans)?remote.plans:[],
        people:Array.isArray(remote.people)&&remote.people.length?remote.people:defaults.people
      };
      cacheLocal();
      if(role) go(currentPage);
    },err=>{
      console.error('Falha na sincronização em tempo real:',err);
      cloudMessage='Firebase offline';
      updateCloudBadge();
    });
  }catch(err){
    console.warn('Firestore ainda não disponível; usando armazenamento local.',err);
    cloudReady=false;
    cloudMessage='Usando dados locais';
    updateCloudBadge();
  }
}

function updateCloudBadge(){
  const el=document.getElementById('cloudStatus');
  if(el) el.textContent=cloudMessage;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function friendlyAuthError(err){
  const code=err && err.code ? err.code : '';
  if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')) return 'E-mail ou senha inválidos.';
  if(code.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if(code.includes('network-request-failed')) return 'Falha de conexão. Verifique a internet.';
  if(code.includes('operation-not-allowed')) return 'O login por e-mail e senha ainda não está ativado no Firebase.';
  if(code.includes('user-disabled')) return 'Este usuário está desativado no Firebase.';
  return 'Não foi possível entrar. Confira o e-mail e a senha.';
}

async function loginWithEmail(event){
  event.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginButton');
  const error=document.getElementById('loginError');
  error.textContent='';
  btn.disabled=true;
  btn.textContent='Entrando...';
  try{
    await auth.signInWithEmailAndPassword(email,password);
  }catch(err){
    console.error(err);
    error.textContent=friendlyAuthError(err);
    btn.disabled=false;
    btn.textContent='Entrar';
  }
}

async function ensureUserProfile(user){
  const ref=db.collection('usuarios').doc(user.uid);
  const email=(user.email||'').trim().toLowerCase();
  const isZion=email==='zion.almeida@irmen.com.br';

  const perfilZion={
    nome:'Zion Almeida',
    email:user.email||'',
    perfil:'admin',
    cargo:'ADM',
    ativo:true
  };

  try{
    const snap=await ref.get();

    if(snap.exists){
      return {uid:user.uid,...snap.data()};
    }

    if(isZion){
      try{
        await ref.set({
          ...perfilZion,
          criadoEm:firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});
      }catch(writeErr){
        console.warn('Perfil ADM autenticado; Firestore ainda sem permissão de escrita.',writeErr);
      }
      return {uid:user.uid,...perfilZion};
    }

    return null;
  }catch(err){
    console.warn('Não foi possível ler o perfil no Firestore.',err);
    if(isZion){
      return {uid:user.uid,...perfilZion};
    }
    throw err;
  }
}

async function loadTeamUsers(){
  try{
    const snap=await db.collection('usuarios').get();
    teamUsers=snap.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>u.ativo!==false);
    const names=teamUsers.map(u=>u.nome).filter(Boolean);
    names.forEach(name=>{ if(!data.people.includes(name)) data.people.push(name); });
  }catch(err){
    console.warn('Não foi possível carregar usuários da equipe',err);
    teamUsers=[];
  }
}

async function openAuthenticatedApp(user){
  const profile=await ensureUserProfile(user);
  const loginError=document.getElementById('loginError');
  if(!profile || profile.ativo===false){
    loginError.textContent='Usuário autenticado, mas ainda sem perfil liberado no EAD Irmen.';
    await auth.signOut();
    return;
  }
  currentUserProfile=profile;
  role=profile.perfil;
  currentPersonName=profile.nome||user.email||'Usuário';

  document.getElementById('profileName').textContent=currentPersonName;
  document.getElementById('profileRole').textContent='Perfil: '+(profile.cargo || (role==='admin'?'ADM':'Instrutor'));
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  await loadTeamUsers();
  await initCloud();
  buildNav();
  go('dashboard');
}

async function logout(){
  try{ await auth.signOut(); }catch(err){ console.error(err); }
}

function buildNav(){
  const items=role==='admin'
    ? [['dashboard','Visão geral'],['agent','Agente ADM'],['skills','Habilidades'],['week','Planejamento semanal'],['team','Equipe'],['users','Usuários']]
    : [['dashboard','Minha semana'],['skills','Minhas habilidades'],['week','Planejamento']];

  const nav=document.getElementById('nav');
  nav.innerHTML='';

  items.forEach(([page,label])=>{
    const button=document.createElement('button');
    button.type='button';
    button.dataset.p=page;
    button.textContent=label;
    button.addEventListener('click',()=>go(page));
    nav.appendChild(button);
  });
}

auth.onAuthStateChanged(async user=>{
  if(user){
    try{
      await openAuthenticatedApp(user);
    }catch(err){
      console.error(err);
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
      document.getElementById('loginError').textContent='Falha ao carregar o perfil do usuário.';
      const btn=document.getElementById('loginButton');
      btn.disabled=false;
      btn.textContent='Entrar';
    }
  }else{
    role='';
    currentUserProfile=null;
    currentPersonName='';
    if(cloudUnsubscribe){cloudUnsubscribe();cloudUnsubscribe=null;}
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
    const btn=document.getElementById('loginButton');
    if(btn){btn.disabled=false;btn.textContent='Entrar';}
  }
})
function go(p){currentPage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p)); if(p==='dashboard')renderDashboard();if(p==='agent')renderAgent();if(p==='skills')renderSkills();if(p==='week')renderWeek();if(p==='team')renderTeam();if(p==='users')renderUsers()}
function header(t,s){document.getElementById('pageTitle').textContent=t;document.getElementById('pageSub').textContent=s;document.getElementById('today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}

function userRoleLabel(u){
  return u && u.perfil==='admin' ? 'ADM' : 'Instrutor';
}

function userCreationError(err){
  const code=err&&err.code?err.code:'';
  if(code.includes('email-already-in-use')) return 'Já existe um login com esse e-mail.';
  if(code.includes('invalid-email')) return 'Informe um e-mail válido.';
  if(code.includes('weak-password')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(code.includes('operation-not-allowed')) return 'Ative E-mail/senha no Firebase Authentication.';
  if(code.includes('permission-denied')) return 'Sem permissão para gravar o perfil no Firestore.';
  return 'Não foi possível criar o login.';
}

async function createUserLogin(event){
  event.preventDefault();
  if(role!=='admin') return;

  const name=document.getElementById('newUserName').value.trim();
  const email=document.getElementById('newUserEmail').value.trim().toLowerCase();
  const password=document.getElementById('newUserPassword').value;
  const newRole=document.getElementById('newUserRole').value;
  const msg=document.getElementById('userCreateMessage');
  const btn=document.getElementById('createUserButton');

  msg.textContent='';
  msg.style.color='#b91c1c';

  if(!name){msg.textContent='Informe o nome.';return;}
  if(password.length<6){msg.textContent='A senha precisa ter pelo menos 6 caracteres.';return;}
  if(!['admin','instructor'].includes(newRole)){msg.textContent='Selecione ADM ou Instrutor.';return;}

  btn.disabled=true;
  btn.textContent='Criando...';

  try{
    await secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);
    const credential=await secondaryAuth.createUserWithEmailAndPassword(email,password);
    const uid=credential.user.uid;
    const profile={
      nome:name,
      email,
      perfil:newRole,
      cargo:newRole==='admin'?'ADM':'Instrutor',
      ativo:true,
      criadoPor:currentUserProfile&&currentUserProfile.uid?currentUserProfile.uid:null,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('usuarios').doc(uid).set(profile);

    if(!data.people.includes(name)){
      data.people.push(name);
      await save();
    }

    await secondaryAuth.signOut();
    await loadTeamUsers();
    renderUsers('Login criado com sucesso para '+name+'.');
  }catch(err){
    console.error(err);
    try{await secondaryAuth.signOut();}catch(_){}
    msg.textContent=userCreationError(err);
    btn.disabled=false;
    btn.textContent='Criar login';
  }
}


function normalizeAgentText(text){
  return String(text||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();
}

function getActiveInstructors(){
  const firestoreInstructors=teamUsers
    .filter(u=>u.perfil==='instructor' && u.ativo!==false)
    .map(u=>u.nome)
    .filter(Boolean);

  const fallback=data.people.filter(name=>{
    if(!name) return false;
    const user=teamUsers.find(u=>u.nome===name);
    if(user && user.perfil==='admin') return false;
    return name!==currentPersonName;
  });

  return [...new Set(firestoreInstructors.length?firestoreInstructors:fallback)];
}

function getWeeklyLoad(person){
  return data.plans.filter(p=>p.week==='Semana atual' && p.person===person).length;
}

function getAgentEligibleSkills(){
  const alreadyPlanned=new Set(
    data.plans
      .filter(p=>p.week==='Semana atual')
      .map(p=>Number(p.skillId))
  );

  const statusPriority={
    'Planejamento':0,
    'Em produção':1,
    'Em revisão':2
  };

  return data.skills
    .filter(s=>s.status!=='Concluída' && !alreadyPlanned.has(Number(s.id)))
    .sort((a,b)=>{
      const pa=statusPriority[a.status]??9;
      const pb=statusPriority[b.status]??9;
      if(pa!==pb) return pa-pb;
      return Number(a.progress||0)-Number(b.progress||0);
    });
}

function buildAgentDistribution(skillCount,instructorCount){
  const instructors=getActiveInstructors()
    .map(name=>({name,load:getWeeklyLoad(name)}))
    .sort((a,b)=>a.load-b.load || a.name.localeCompare(b.name));

  if(!instructors.length){
    return {error:'Não encontrei nenhum usuário ativo com perfil Instrutor. Cadastre ou ative os instrutores antes de montar a distribuição.'};
  }

  const useCount=Math.max(1,Math.min(Number(instructorCount)||instructors.length,instructors.length));
  const selectedInstructors=instructors.slice(0,useCount);

  const eligible=getAgentEligibleSkills();
  if(!eligible.length){
    return {error:'Não há habilidades pendentes e ainda não planejadas disponíveis para distribuir nesta semana.'};
  }

  const requested=Math.max(1,Number(skillCount)||eligible.length);
  const selectedSkills=eligible.slice(0,requested);
  const dynamicLoads=Object.fromEntries(selectedInstructors.map(i=>[i.name,i.load]));
  const assignments=[];

  selectedSkills.forEach(skill=>{
    const person=selectedInstructors
      .slice()
      .sort((a,b)=>dynamicLoads[a.name]-dynamicLoads[b.name] || a.name.localeCompare(b.name))[0];

    assignments.push({
      skillId:skill.id,
      skillTitle:skill.title,
      level:skill.level,
      person:person.name,
      previousLoad:dynamicLoads[person.name]
    });

    dynamicLoads[person.name]+=1;
  });

  return {
    requested,
    available:eligible.length,
    selectedInstructors:selectedInstructors.map(i=>i.name),
    assignments,
    finalLoads:dynamicLoads,
    limited:selectedSkills.length<requested
  };
}

function agentAddMessage(type,text){
  agentMessages.push({type,text});
  if(agentMessages.length>30) agentMessages=agentMessages.slice(-30);
}

function agentDistributionSummary(plan){
  const perPerson={};
  plan.assignments.forEach(a=>{
    if(!perPerson[a.person]) perPerson[a.person]=[];
    perPerson[a.person].push(a);
  });

  let text='Preparei a distribuição de '+plan.assignments.length+' habilidade(s) para esta semana.\n\n';
  Object.entries(perPerson).forEach(([person,items])=>{
    text+='• '+person+': '+items.length+' habilidade(s)\n';
  });

  if(plan.limited){
    text+='\nVocê pediu '+plan.requested+', mas encontrei somente '+plan.assignments.length+' habilidade(s) pendentes e disponíveis.';
  }else{
    text+='\nA distribuição foi equilibrada considerando a carga que cada instrutor já possui nesta semana.';
  }

  text+='\n\nRevise o plano ao lado e clique em "Aplicar planejamento" para eu executar.';
  return text;
}

function agentTeamSummary(){
  const instructors=getActiveInstructors();
  if(!instructors.length) return 'Não encontrei instrutores ativos cadastrados.';
  const stats=instructors
    .map(name=>({name,load:getWeeklyLoad(name)}))
    .sort((a,b)=>b.load-a.load);

  return 'Carga atual da semana:\n\n'+stats.map(s=>'• '+s.name+': '+s.load+' habilidade(s)').join('\n');
}

function processAgentCommand(event){
  event.preventDefault();
  if(role!=='admin') return;

  const input=document.getElementById('agentInput');
  const command=(input.value||'').trim();
  if(!command) return;

  agentAddMessage('user',command);
  input.value='';

  const text=normalizeAgentText(command);
  const skillMatch=text.match(/(\d+)\s*(?:habilidade|habilidades)/);
  const instructorMatch=text.match(/(\d+)\s*(?:instrutor|instrutores)/);
  const skillCount=skillMatch?Number(skillMatch[1]):null;
  const instructorCount=instructorMatch?Number(instructorMatch[1]):null;

  const wantsDistribution=
    /organiza|organize|distribu|divid|liber|planej|meta/.test(text);

  const wantsLoad=
    /carga|carregado|ocupado|livre|disponivel|quem esta|quantas tarefas/.test(text)
    && !wantsDistribution;

  if(wantsDistribution){
    const plan=buildAgentDistribution(skillCount,instructorCount);
    if(plan.error){
      agentPendingPlan=null;
      agentAddMessage('assistant',plan.error);
    }else{
      agentPendingPlan=plan;
      agentAddMessage('assistant',agentDistributionSummary(plan));
    }
  }else if(wantsLoad){
    agentPendingPlan=null;
    agentAddMessage('assistant',agentTeamSummary());
  }else{
    agentPendingPlan=null;
    agentAddMessage(
      'assistant',
      'Eu consigo agir principalmente sobre planejamento e distribuição de trabalho. Tente algo como:\n\n• "Distribua 10 habilidades entre 2 instrutores."\n• "Quero liberar 15 habilidades essa semana."\n• "Como está a carga dos instrutores?"'
    );
  }

  renderAgent();
}

function agentUseExample(text){
  const input=document.getElementById('agentInput');
  if(!input) return;
  input.value=text;
  input.focus();
}

async function applyAgentPlan(){
  if(role!=='admin' || !agentPendingPlan || !agentPendingPlan.assignments.length) return;

  const button=document.getElementById('agentApplyButton');
  if(button){
    button.disabled=true;
    button.textContent='Aplicando...';
  }

  try{
    const now=Date.now();

    agentPendingPlan.assignments.forEach((assignment,index)=>{
      const exists=data.plans.some(
        p=>p.week==='Semana atual' && Number(p.skillId)===Number(assignment.skillId)
      );

      if(!exists){
        data.plans.push({
          id:now+index,
          person:assignment.person,
          skillId:assignment.skillId,
          week:'Semana atual',
          origem:'Agente ADM'
        });
      }

      const skill=data.skills.find(s=>Number(s.id)===Number(assignment.skillId));
      if(skill){
        skill.owner=assignment.person;
        if(skill.status==='Planejamento') skill.status='Em produção';
      }
    });

    const appliedCount=agentPendingPlan.assignments.length;
    await save();

    agentAddMessage(
      'assistant',
      'Planejamento aplicado. Distribuí '+appliedCount+' habilidade(s), atualizei os responsáveis e registrei as entregas em "Planejamento semanal".'
    );

    agentPendingPlan=null;
    renderAgent();
  }catch(err){
    console.error('Erro ao aplicar plano do Agente ADM:',err);
    agentAddMessage('assistant','Não consegui aplicar o planejamento. Verifique a sincronização com o Firebase e tente novamente.');
    renderAgent();
  }
}

function cancelAgentPlan(){
  agentPendingPlan=null;
  agentAddMessage('assistant','Plano descartado. Nenhuma alteração foi feita nas metas da semana.');
  renderAgent();
}

function renderAgentPlan(){
  if(!agentPendingPlan) return '<div class="muted">Nenhuma ação aguardando confirmação.</div>';

  const grouped={};
  agentPendingPlan.assignments.forEach(a=>{
    if(!grouped[a.person]) grouped[a.person]=[];
    grouped[a.person].push(a);
  });

  return '<div class="agent-plan">'+
    '<h4>Plano proposto</h4>'+
    Object.entries(grouped).map(([person,items])=>
      '<div style="margin-bottom:12px"><b>'+esc(person)+'</b>'+
      items.map(item=>'<div class="agent-plan-row"><span>'+esc(item.skillTitle)+'</span><span class="tag">'+esc(item.level||'')+'</span></div>').join('')+
      '</div>'
    ).join('')+
    '<div class="agent-plan-actions">'+
      '<button id="agentApplyButton" class="btn btn-primary" onclick="applyAgentPlan()">Aplicar planejamento</button>'+
      '<button class="btn btn-soft" onclick="cancelAgentPlan()">Descartar</button>'+
    '</div>'+
  '</div>';
}

            '<button class="btn btn-primary" type="submit">Analisar e organizar</button>'+
          '</div>'+
        '</form>'+
      '</div>'+
      '<div class="agent-side">'+
        '<div class="section">'+
          '<div class="section-head"><h3>Contexto atual</h3></div>'+
          '<div class="agent-stat"><span>Habilidades disponíveis</span><b>'+pending+'</b></div>'+
          '<div class="agent-stat"><span>Instrutores ativos</span><b>'+instructors.length+'</b></div>'+
          instructors.map(i=>'<div class="agent-stat"><span>'+esc(i.name)+'</span><b>'+i.load+' na semana</b></div>').join('')+

      '<div class="section-head"><div><h3>Criar novo login</h3><div class="muted">O usuário poderá entrar no EAD Irmen usando este e-mail e senha.</div></div></div>'+
      '<form class="form-grid" onsubmit="createUserLogin(event)">'+
        '<div class="field"><label>Nome completo</label><input id="newUserName" placeholder="Nome do colaborador" required></div>'+
        '<div class="field"><label>Perfil</label><select id="newUserRole"><option value="instructor">Instrutor</option><option value="admin">ADM</option></select></div>'+
        '<div class="field"><label>E-mail</label><input id="newUserEmail" type="email" placeholder="nome@irmen..." required></div>'+
        '<div class="field"><label>Senha inicial</label><input id="newUserPassword" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required></div>'+
        '<div class="span2"><button id="createUserButton" class="btn btn-primary" type="submit">Criar login</button><div id="userCreateMessage" class="muted" style="margin-top:10px;'+(success?'color:#15803d;font-weight:700':'')+'">'+esc(success)+'</div></div>'+
      '</form>'+
    '</div>'+
    '<div class="section"><div class="section-head"><h3>Usuários cadastrados</h3></div><div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function renderTeam(){
  header('Equipe','Acompanhe os integrantes, cargos e a distribuição das metas.');
  const knownNames=new Set(teamUsers.map(u=>u.nome).filter(Boolean));
  const localOnly=data.people.filter(name=>!knownNames.has(name)).map(name=>({nome:name,cargo:'Instrutor',perfil:'instructor',ativo:true}));
  const members=[...teamUsers,...localOnly];
  document.getElementById('content').innerHTML='<div class="section"><div class="section-head"><h3>Equipe EAD</h3></div><div class="grid">'+members.map(p=>{let name=p.nome||p.email||'Usuário';let total=data.skills.filter(s=>s.owner===name).length;let weekly=data.plans.filter(x=>x.person===name).length;return '<div class="card"><div class="person"><div class="avatar">'+esc(name[0]||'?')+'</div><div><b>'+esc(name)+'</b><div class="muted">'+esc(p.cargo||'Instrutor')+'</div></div></div><div style="margin-top:14px" class="muted">'+total+' habilidade(s) atribuída(s) • '+weekly+' entrega(s) na semana</div></div>'}).join('')+'</div></div>'
}
function showModal(){document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
updateCloudBadge();
</script>
