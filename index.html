      '<div class="consultant-fleet-details-body">'+
        '<div class="section-head"><div><h3>Máquinas em acompanhamento</h3><div id="fleetResultCount" class="muted"></div></div><div class="actions"><button class="btn btn-soft" onclick="downloadFleetCsv()">Exportar CSV</button>'+(fleetCanEdit()?'<button class="btn btn-soft" onclick="fleetResetPrototype()">Restaurar demonstração</button>':'')+'</div></div>'+
        '<div class="fleet-filters">'+
          '<input value="'+esc(fleetFilters.busca)+'" placeholder="Buscar por código, modelo, série, cliente, local..." oninput="setFleetFilter(\'busca\',this.value)">'+
          '<select onchange="setFleetFilter(\'status\',this.value)"><option>Todos</option><option>Operação normal</option><option>Atenção</option><option>Crítico</option><option>Em visita</option></select>'+
          '<select onchange="setFleetFilter(\'cliente\',this.value)"><option>Todos</option>'+clients.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'+
        '</div>'+
        '<div class="table-wrap fleet-table"><table><thead><tr><th>Equipamento</th><th>Cliente / local</th><th>Horímetro</th><th>SOC</th><th>Status</th><th>Classificação / evidência</th><th>Próxima ação</th><th>Ações</th></tr></thead><tbody id="fleetTableBody"></tbody></table></div>'+
      '</div>'+
    '</details>';

  const statusSelect=document.querySelector('.fleet-filters select:nth-of-type(1)');
  const clientSelect=document.querySelector('.fleet-filters select:nth-of-type(2)');
  if(statusSelect) statusSelect.value=fleetFilters.status;
  if(clientSelect) clientSelect.value=fleetFilters.cliente;
  loadFleetShiftRecords(false);
  renderFleetTable();
}

function destroyFleetDashboardCharts(){
  if(!Array.isArray(fleetDashboardCharts)) fleetDashboardCharts=[];
  fleetDashboardCharts.forEach(chart=>{try{chart.destroy()}catch(_){ }});
  fleetDashboardCharts=[];
}

function setFleetDashboardFilter(key,value){
  fleetDashboardFilters[key]=value;
  openFleetDashboard();
}

function fleetChart(canvasId,config){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  if(typeof Chart==='undefined'){
    canvas.parentElement.innerHTML='<div class="fleet-chart-fallback">Não foi possível carregar os gráficos.</div>';
    return;
  }
  const chart=new Chart(canvas,config);
  fleetDashboardCharts.push(chart);
}

function renderFleetDashboardCharts(view){
  destroyFleetDashboardCharts();
  if(typeof Chart==='undefined') return;

  Chart.defaults.font.family='Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
  Chart.defaults.color='#667085';
  Chart.defaults.borderColor='#eef1f4';

  const legend={position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,boxHeight:8,padding:14,font:{size:11,weight:'600'}}};
  const tooltip={backgroundColor:'#0f172a',titleColor:'#fff',bodyColor:'#e2e8f0',padding:11,cornerRadius:9,displayColors:true};

  fleetChart('fleetStatusChart',{
    type:'doughnut',
    data:{labels:view.statusLabels,datasets:[{data:view.statusValues,backgroundColor:['#16a34a','#f59e0b','#dc2626','#3b82f6'],borderWidth:0,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend,tooltip}}
  });

  fleetChart('fleetPropulsionChart',{
    type:'doughnut',
    data:{labels:view.propulsionLabels,datasets:[{data:view.propulsionValues,backgroundColor:['#64748b','#7c3aed','#06b6d4'],borderWidth:0,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend,tooltip}}
  });

  fleetChart('fleetEconomyChart',{
    type:'bar',
    data:{labels:view.economyLabels,datasets:[{label:'Economia acumulada',data:view.economyValues,backgroundColor:'#16a34a',borderRadius:7,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...tooltip,callbacks:{label:ctx=>' '+fleetMoney(ctx.raw)}}},scales:{x:{beginAtZero:true,grid:{color:'#f1f5f9'},ticks:{callback:v=>'R$ '+Number(v).toLocaleString('pt-BR',{notation:'compact'})}},y:{grid:{display:false},ticks:{font:{size:10,weight:'600'}}}}}
  });

  fleetChart('fleetCostChart',{
    type:'bar',
    data:{labels:view.costLabels,datasets:[
      {label:'Diesel equivalente / h',data:view.dieselCostValues,backgroundColor:'#f59e0b',borderRadius:6,borderSkipped:false},
      {label:'Elétrico / h',data:view.electricCostValues,backgroundColor:'#06b6d4',borderRadius:6,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend,tooltip:{...tooltip,callbacks:{label:ctx=>' '+ctx.dataset.label+': '+fleetMoney(ctx.raw)}}},scales:{y:{beginAtZero:true,grid:{color:'#f1f5f9'},ticks:{callback:v=>'R$ '+Number(v).toLocaleString('pt-BR')}},x:{grid:{display:false},ticks:{font:{size:10,weight:'600'}}}}}
  });

  fleetChart('fleetSocChart',{
    type:'bar',
    data:{labels:view.socLabels,datasets:[{label:'SOC',data:view.socValues,backgroundColor:view.socValues.map(v=>v<=20?'#dc2626':v<=50?'#f59e0b':'#16a34a'),borderRadius:7,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...tooltip,callbacks:{label:ctx=>' SOC: '+ctx.raw+'%'}}},scales:{y:{beginAtZero:true,max:100,grid:{color:'#f1f5f9'},ticks:{callback:v=>v+'%'}},x:{grid:{display:false},ticks:{font:{size:10,weight:'600'}}}}}
  });

  fleetChart('fleetClientStatusChart',{
    type:'bar',
    data:{labels:view.clientLabels,datasets:[
      {label:'Normal',data:view.clientNormal,backgroundColor:'#16a34a',stack:'status',borderRadius:4},
      {label:'Atenção',data:view.clientAttention,backgroundColor:'#f59e0b',stack:'status',borderRadius:4},
      {label:'Crítico',data:view.clientCritical,backgroundColor:'#dc2626',stack:'status',borderRadius:4},
      {label:'Em visita',data:view.clientVisit,backgroundColor:'#3b82f6',stack:'status',borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend,tooltip},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10,weight:'600'}}},y:{stacked:true,beginAtZero:true,ticks:{precision:0},grid:{color:'#f1f5f9'}}}}
  });
}

function openFleetDashboard(){
  header('Dashboard Geral • Frotas','Visão executiva dos testes, criticidade, utilização e economia operacional da frota.');

  const clients=[...new Set(fleetPrototype.map(x=>x.cliente).filter(Boolean))].sort();
  const types=['Mecânico','Híbrido','Elétrico'];
  const statuses=['Operação normal','Atenção','Crítico','Em visita'];

  const machines=fleetPrototype.filter(m=>{
    const byClient=fleetDashboardFilters.cliente==='Todos'||m.cliente===fleetDashboardFilters.cliente;
    const byType=fleetDashboardFilters.tipo==='Todos'||(m.tipoPropulsao||'Mecânico')===fleetDashboardFilters.tipo;
    const byStatus=fleetDashboardFilters.status==='Todos'||m.status===fleetDashboardFilters.status;
    return byClient&&byType&&byStatus;
  });

  const electric=machines.filter(m=>m.tipoPropulsao==='Elétrico');
  const battery=machines.filter(m=>fleetHasBattery(m));
  const economies=electric.map(m=>({m,e:fleetEconomy(m)})).filter(x=>x.e);
  const totalSaving=economies.reduce((sum,x)=>sum+x.e.economiaTotal,0);
  const dieselEquivalent=economies.reduce((sum,x)=>sum+x.e.hours*Math.max(0,Number(x.m.consumoDieselReferenciaLHora)||0),0);
  const critical=machines.filter(m=>m.status==='Crítico').length;
  const priority=machines.filter(m=>m.prioridadeTreinamento==='Alta'||m.prioridadeTreinamento==='Crítica').length;
  const totalTests=machines.reduce((sum,m)=>sum+(Array.isArray(m.historico)?m.historico.length:0),0);
  const avgSoc=battery.length?battery.reduce((sum,m)=>sum+Math.max(0,Math.min(100,Number(m.soc)||0)),0)/battery.length:0;

  const recent=[];
  machines.forEach(m=>(m.historico||[]).forEach(h=>recent.push({...h,machine:m})));
  recent.sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));

  const criticalMachines=machines.filter(m=>m.status==='Crítico');
  const lowSoc=battery.filter(m=>Number(m.soc||0)<=30);
  const topEconomy=economies.slice().sort((a,b)=>b.e.economiaTotal-a.e.economiaTotal)[0];
  const trainingPriority=machines.filter(m=>m.prioridadeTreinamento==='Crítica'||m.prioridadeTreinamento==='Alta').slice(0,3);

  const clientOptions='<option>Todos</option>'+clients.map(x=>'<option>'+esc(x)+'</option>').join('');
  const typeOptions='<option>Todos</option>'+types.map(x=>'<option>'+esc(x)+'</option>').join('');
  const statusOptions='<option>Todos</option>'+statuses.map(x=>'<option>'+esc(x)+'</option>').join('');

  const electricRows=electric.length?electric.map(m=>{
    const e=fleetEconomy(m),price=fleetCurrentCost(m),soc=Math.max(0,Math.min(100,Number(m.soc)||0));
    const socClass=soc<=20?'soc-low':soc<=50?'soc-mid':'soc-ok';
    return '<tr><td><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><div class="machine-sub">'+esc(m.cliente)+' • '+esc(m.local)+'</div></td><td>'+Number(m.horimetro||0).toLocaleString('pt-BR')+' h</td><td class="'+socClass+'">'+soc+'%</td><td>'+Number(m.consumoEletricoKwhHora||0).toLocaleString('pt-BR')+' kWh/h</td><td>'+fleetMoney(price?.tarifaEnergia||0)+'/kWh</td><td>'+Number(m.consumoDieselReferenciaLHora||0).toLocaleString('pt-BR')+' L/h</td><td>'+fleetMoney(price?.precoDiesel||0)+'/L</td><td class="money-positive">'+(e?fleetMoney(e.economiaHora)+'/h':'—')+'</td><td class="money-positive">'+(e?fleetMoney(e.economiaTotal):'—')+'</td><td><button class="btn btn-soft" onclick="openFleetMachineReport('+m.id+')">Abrir relatório</button></td></tr>';
  }).join(''):'<tr><td colspan="10" class="empty">Nenhuma máquina elétrica neste filtro.</td></tr>';

  const recentRows=recent.length?recent.slice(0,10).map(h=>'<tr><td>'+fleetDate(h.data)+'</td><td><b>'+esc(h.machine.codigo)+' • '+esc(h.machine.modelo)+'</b><div class="machine-sub">'+esc(h.machine.cliente)+'</div></td><td>'+esc(h.tipo||'Acompanhamento')+'</td><td>'+(h.horimetro!==undefined?Number(h.horimetro).toLocaleString('pt-BR')+' h':'—')+'</td><td>'+(h.soc!==undefined?Number(h.soc)+'%':'—')+'</td><td>'+esc(h.descricao||'')+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">Sem registros de acompanhamento.</td></tr>';

  const insights=[];
  criticalMachines.slice(0,2).forEach(m=>insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><span class="fleet-mini-badge red">CRÍTICO</span></div><small>'+esc(m.cliente)+' • '+esc(m.proximaAcao||'Sem próxima ação cadastrada')+'</small></div>'));
  lowSoc.slice(0,2).forEach(m=>insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><span class="fleet-mini-badge amber">SOC '+Number(m.soc||0)+'%</span></div><small>'+esc(m.cliente)+' • carga baixa registrada.</small></div>'));
  if(topEconomy) insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(topEconomy.m.codigo)+' • '+esc(topEconomy.m.modelo)+'</b><span class="fleet-mini-badge green">MAIOR ECONOMIA</span></div><small>'+esc(topEconomy.m.cliente)+' • '+fleetMoney(topEconomy.e.economiaTotal)+' acumulados.</small></div>');
  trainingPriority.slice(0,2).forEach(m=>insights.push('<div class="fleet-insight"><div class="fleet-insight-top"><b>'+esc(m.codigo)+' • '+esc(m.modelo)+'</b><span class="fleet-mini-badge blue">TREINAMENTO</span></div><small>'+esc(m.necessidadeTreinamento||'Necessidade prioritária de treinamento')+'</small></div>'));

  destroyFleetDashboardCharts();

  document.getElementById('content').innerHTML=
    '<div class="fleet-dashboard-hero"><div class="fleet-dashboard-hero-top"><div><h3>Visão consolidada da frota</h3><p>Indicadores técnicos, criticidade, utilização e resultado financeiro dos testes em um único painel.</p></div><div class="fleet-dashboard-hero-actions"><button class="btn" onclick="renderFleet()">Voltar para frota</button><button class="btn" onclick="downloadFleetCsv()">Exportar CSV</button><button class="btn" onclick="openFleetReport()">Gerar relatório</button></div></div><div class="fleet-dashboard-filters"><div><label>Cliente</label><select id="fleetDashClient" onchange="setFleetDashboardFilter(\'cliente\',this.value)">'+clientOptions+'</select></div><div><label>Tipo</label><select id="fleetDashType" onchange="setFleetDashboardFilter(\'tipo\',this.value)">'+typeOptions+'</select></div><div><label>Status</label><select id="fleetDashStatus" onchange="setFleetDashboardFilter(\'status\',this.value)">'+statusOptions+'</select></div></div></div>'+
    '<div class="fleet-dashboard-kpis"><div class="fleet-dashboard-kpi info"><span class="kpi-label">Máquinas</span><b>'+machines.length+'</b><small>Equipamentos no filtro atual</small></div><div class="fleet-dashboard-kpi electric"><span class="kpi-label">Elétricas</span><b>'+electric.length+'</b><small>'+battery.length+' com bateria monitorada</small></div><div class="fleet-dashboard-kpi danger"><span class="kpi-label">Estado crítico</span><b>'+critical+'</b><small>'+priority+' com treinamento prioritário</small></div><div class="fleet-dashboard-kpi success"><span class="kpi-label">Economia estimada</span><b>'+fleetMoney(totalSaving)+'</b><small>Acumulado das máquinas elétricas</small></div><div class="fleet-dashboard-kpi warning"><span class="kpi-label">Diesel equivalente evitado</span><b>'+dieselEquivalent.toLocaleString('pt-BR',{maximumFractionDigits:0})+' L</b><small>Referência calculada nos testes</small></div><div class="fleet-dashboard-kpi"><span class="kpi-label">SOC médio</span><b>'+(battery.length?avgSoc.toFixed(0)+'%':'—')+'</b><small>'+totalTests+' registros de acompanhamento</small></div></div>'+
    '<div class="fleet-dashboard-main"><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Estado da frota</h3><div class="chart-sub">Distribuição rápida por situação operacional</div></div></div><div class="fleet-chart-canvas compact"><canvas id="fleetStatusChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Tipo de propulsão</h3><div class="chart-sub">Composição da frota acompanhada</div></div></div><div class="fleet-chart-canvas compact"><canvas id="fleetPropulsionChart"></canvas></div></div><div class="fleet-insight-panel"><div class="fleet-insight-title"><h3>Atenção imediata</h3><span class="fleet-mini-badge red">'+critical+' crítico(s)</span></div><div class="fleet-insight-list">'+(insights.length?insights.slice(0,6).join(''):'<div class="muted">Nenhum alerta relevante neste filtro.</div>')+'</div></div></div>'+
    '<div class="fleet-dashboard-grid"><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Economia acumulada por máquina</h3><div class="chart-sub">Resultado estimado da operação elétrica em relação ao diesel</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetEconomyChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Custo energético por hora</h3><div class="chart-sub">Diesel equivalente x operação elétrica</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetCostChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>SOC das máquinas com bateria</h3><div class="chart-sub">Verde acima de 50%, amarelo até 50%, vermelho até 20%</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetSocChart"></canvas></div></div><div class="fleet-chart"><div class="fleet-chart-head"><div><h3>Criticidade por cliente</h3><div class="chart-sub">Distribuição dos estados para priorização de atendimento</div></div></div><div class="fleet-chart-canvas"><canvas id="fleetClientStatusChart"></canvas></div></div></div>'+
    '<div class="fleet-dashboard-section fleet-dashboard-table"><div class="section-head"><div><h3>Parâmetros dos testes • máquinas elétricas</h3><div class="muted">Dados atuais usados no cálculo de economia. Os preços históricos permanecem preservados por vigência.</div></div></div><div class="table-wrap"><table><thead><tr><th>Máquina</th><th>Horímetro</th><th>SOC</th><th>Consumo elétrico</th><th>Energia</th><th>Diesel ref.</th><th>Preço diesel</th><th>Economia/h</th><th>Economia acumulada</th><th>Ação</th></tr></thead><tbody>'+electricRows+'</tbody></table></div></div>'+
    '<div class="fleet-dashboard-section"><div class="section-head"><div><h3>Últimos testes e acompanhamentos</h3><div class="muted">Atividades mais recentes da frota filtrada.</div></div><span class="fleet-mini-badge blue">'+recent.length+' registro(s)</span></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Máquina</th><th>Tipo</th><th>Horímetro</th><th>SOC</th><th>Registro</th></tr></thead><tbody>'+recentRows+'</tbody></table></div></div>';

  const clientSelect=document.getElementById('fleetDashClient');
  const typeSelect=document.getElementById('fleetDashType');
  const statusSelect=document.getElementById('fleetDashStatus');
  if(clientSelect) clientSelect.value=fleetDashboardFilters.cliente;
  if(typeSelect) typeSelect.value=fleetDashboardFilters.tipo;
  if(statusSelect) statusSelect.value=fleetDashboardFilters.status;

  const sortedEconomy=economies.slice().sort((a,b)=>b.e.economiaTotal-a.e.economiaTotal);
  const clientList=[...new Set(machines.map(m=>m.cliente).filter(Boolean))].sort();

  renderFleetDashboardCharts({
    statusLabels:statuses,
    statusValues:statuses.map(label=>machines.filter(m=>m.status===label).length),
    propulsionLabels:types,
    propulsionValues:types.map(label=>machines.filter(m=>(m.tipoPropulsao||'Mecânico')===label).length),
    economyLabels:sortedEconomy.map(x=>x.m.codigo+' • '+x.m.modelo),
    economyValues:sortedEconomy.map(x=>Math.max(0,x.e.economiaTotal)),
    costLabels:economies.map(x=>x.m.codigo+' • '+x.m.modelo),
    dieselCostValues:economies.map(x=>x.e.custoDieselHora),
    electricCostValues:economies.map(x=>x.e.custoEletricoHora),
    socLabels:battery.map(m=>m.codigo+' • '+m.modelo),
    socValues:battery.map(m=>Math.max(0,Math.min(100,Number(m.soc)||0))),
    clientLabels:clientList,
    clientNormal:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Operação normal').length),
    clientAttention:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Atenção').length),
    clientCritical:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Crítico').length),
    clientVisit:clientList.map(client=>machines.filter(m=>m.cliente===client&&m.status==='Em visita').length)
  });
}

function openFleetMachine(id){
  const m=fleetPrototype.find(x=>Number(x.id)===Number(id));if(!m)return;
  const editable=fleetCanEdit(),history=(m.historico||[]).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))),e=fleetEconomy(m);
  document.getElementById('modalContent').innerHTML='<div class="section-head"><div><h3>'+esc(m.codigo)+' • '+esc(m.modelo)+'</h3><div class="muted">'+esc(m.cliente)+' • '+esc(m.local)+'</div></div><button class="btn btn-soft" onclick="closeModal()">Fechar</button></div>'+

function toggleFleetMachineProfileFields(){
  const type=document.getElementById('fmPropulsao')?.value||'Mecânico';
  const family=document.getElementById('fmFamilia')?.value||'Outro';
  const electric=document.getElementById('fleetElectricFields'),soc=document.getElementById('fleetSocField');
  if(electric)electric.style.display=type==='Elétrico'?'block':'none';
  if(soc)soc.style.display=(type==='Elétrico'||type==='Híbrido')?'block':'none';
  const cycles=document.getElementById('fmCiclos'),load=document.getElementById('fmCarga'),fuel=document.getElementById('fmCombustivelDisponivel');
  if(cycles&&!cycles.dataset.touched)cycles.checked=(family==='Caminhão'||family==='Carregadeira');

async function saveFleetEvent(id){
  if(!fleetCanEdit())return;
  const m=fleetPrototype.find(x=>Number(x.id)===Number(id));if(!m)return;

  const evidencia=document.getElementById('feEvidencia').value.trim();
  if(!evidencia)return alert('Registre a evidência observada antes de salvar.');

  const classificacao=document.getElementById('feClassificacao').value||'A definir';
  const analise=document.getElementById('feAnalise').value.trim();
  const date=document.getElementById('feData').value||new Date().toISOString().slice(0,10);
  const hours=Number(document.getElementById('feHorimetro').value);
  if(hours>0)m.horimetro=hours;

  const soc=document.getElementById('feSoc');
  if(soc)m.soc=Math.max(0,Math.min(100,Number(soc.value)||0));

  const treinamento=classificacao==='Treinamento'?document.getElementById('feTreinamento').value.trim():'';
  const prioridade=classificacao==='Treinamento'?document.getElementById('fePrioridade').value:'Baixa';

  if(!Array.isArray(m.historico))m.historico=[];
  const fleetEvent={
    id:Date.now(),
    data:date,
    tipo:document.getElementById('feTipo').value,
    classificacaoNecessidade:classificacao,
    evidenciaObservada:evidencia,
    analiseTecnica:analise,
    descricao:analise||evidencia,
    necessidadeTreinamento:treinamento,
    prioridadeTreinamento:prioridade,
    proximaAcao:document.getElementById('feAcao').value.trim(),
    responsavel:currentPersonName||'Consultor de Treinamento',
    horimetro:m.horimetro,
    ...(soc?{soc:m.soc}:{})
  };
  m.historico.push(fleetEvent);

  m.status=document.getElementById('feStatus').value;
  m.classificacaoNecessidade=classificacao;
  m.evidenciaObservada=evidencia;
  m.analiseTecnica=analise;
  m.necessidadeTreinamento=treinamento;
  m.prioridadeTreinamento=prioridade;
  m.proximaAcao=document.getElementById('feAcao').value.trim();
  m.ultimaAtualizacao=date;

  fleetSavePrototype();

  if(classificacao==='Treinamento'&&treinamento){
    try{
      const demandResult=await registerFleetTrainingDemand(m,fleetEvent);
      const message=demandResult?.created
        ? 'Demanda de treinamento criada e enviada para análise do ADM.'
        : (demandResult?.phase==='Após treinamento'
            ? 'Ocorrência registrada no acompanhamento pós-treinamento.'
            : 'Nova ocorrência vinculada à demanda de treinamento existente.');
      alert(message);
    }catch(err){
      console.error('Falha ao criar demanda de treinamento:',err);
      alert('O acompanhamento da máquina foi salvo, mas a demanda de treinamento não sincronizou: '+(err.message||'erro de comunicação.'));
    }
  }

  openFleetMachine(m.id);
}

function fleetCheckUrl(m){
  const base=window.location.origin+'/cliente-turno';
  const params=new URLSearchParams({
    machine:m.codigo||'',
    name:m.modelo||m.codigo||'',
    family:fleetFamily(m),
    power:m.tipoPropulsao||'Mecânico',
    cycles:m.ciclosDisponiveis?'1':'0',
    load:m.cargaDisponivel?'1':'0',
    energy:m.energiaDisponivel?'1':'0',
    fuel:m.combustivelDisponivel?'1':'0'
  });
  return base+'?'+params.toString();
}

function openFleetQr(id){
  const m=fleetPrototype.find(x=>Number(x.id)===Number(id));if(!m)return;
  const url=fleetCheckUrl(m);
  const qrSrc='/api/fleet-qr?data='+encodeURIComponent(url);
  document.getElementById('modalContent').innerHTML=

function downloadFleetCsv(){
  const header=['Código','Modelo','Número de série','Cliente','Local','Horímetro','SOC (%)','Status','Consultor','Última atualização','Necessidade de treinamento','Prioridade','Próxima ação','Observações'];
  const rows=fleetPrototype.map(m=>[
    m.codigo,m.modelo,m.serie,m.cliente,m.local,m.horimetro,m.soc,m.status,m.consultor,m.ultimaAtualizacao,m.necessidadeTreinamento,m.prioridadeTreinamento,m.proximaAcao,m.observacoes
  ]);
  const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\uFEFF'+[header,...rows].map(row=>row.map(quote).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='acompanhamento-frotas-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

    '<div class="section"><div class="section-head"><div><h3>Usuários cadastrados</h3><div class="muted">As alterações de e-mail, senha e ativação também são aplicadas ao Firebase Authentication.</div></div></div><div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderTeam(){
  header('Equipe','Acompanhe os integrantes, cargos e a distribuição das metas.');
  const knownNames=new Set(teamUsers.map(u=>u.nome).filter(Boolean));
  const localOnly=data.people.filter(name=>!knownNames.has(name)).map(name=>({nome:name,cargo:'Instrutor',perfil:'instructor',ativo:true}));
  const members=[...teamUsers,...localOnly];
  document.getElementById('content').innerHTML='<div class="section"><div class="section-head"><h3>Equipe EAD</h3></div><div class="grid">'+members.map(p=>{let name=p.nome||p.email||'Usuário';let total=data.skills.filter(s=>s.owner===name).length;let weekly=data.plans.filter(x=>x.person===name).length;return '<div class="card"><div class="person"><div class="avatar">'+esc(name[0]||'?')+'</div><div><b>'+esc(name)+'</b><div class="muted">'+esc(p.cargo||'Instrutor')+'</div></div></div><div style="margin-top:14px" class="muted">'+total+' habilidade(s) atribuída(s) • '+weekly+' entrega(s) na semana</div></div>'}).join('')+'</div></div>'
}
function showModal(){document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

// Preenche o último e-mail usado. A senha pode ser preenchida pelo gerenciador
// de senhas do navegador, mas o sistema só autentica após clicar em "Entrar".
const rememberedEmail=localStorage.getItem('ead-irmen-last-email');
if(rememberedEmail){
  const loginEmail=document.getElementById('loginEmail');
  if(loginEmail) loginEmail.value=rememberedEmail;
}

updateCloudBadge();
